<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Studio TV · proposta Bianco e oro</title>
<!--
  DISEGNO DI PROVA (non è ancora l'app): come diventerebbe lo studio del game show in «Bianco e oro».
  Stessa pianta dello studio vero (js/studio.js): maxischermo al centro con la sua cornice, due gradinate ai lati e una sotto,
  due torri a led, i banconi dei concorrenti in basso, e la telecamera che inquadra una parte alla volta.
  Si guarda a 390 × 844 (un telefono). Si sceglie l'inquadratura dopo il # dell'indirizzo:
     #largo   tutto lo studio (la panoramica)         #leggio   un concorrente al suo bancone, acceso
     #schermo  il maxischermo con una carta (chiaro)  #scuro    lo stesso, con lo schermo scuro
     #pubblico la gradinata di sinistra               #finale   chi vince, coi coriandoli
  I colori sono quelli dell'app (--o-* di css/styles.css); il «legno chiaro» è l'oro chiaro stemperato nel fondo.
  Gli avatar sono quelli veri (js/omino.js).
-->
<style>
@font-face{ font-family:"SG Titoli"; font-style:normal; font-weight:500 700; font-display:block; src:url(font/sg-titoli.woff2) format("woff2"); }
:root{
  --o-fondo:#fcfbf9; --o-fondo-2:#f4f2ee; --o-carta:#ffffff; --o-carta-2:#f6f4ef; --o-filo:#e9e4d8; --o-filo-oro:#e2c56a;
  --o-testo:#1e1b16; --o-tenue:#6b665c; --o-oro:#bd931a; --o-oro-testo:#87680c; --o-oro-chiaro:#ecd283;
  --o-tasto:linear-gradient(180deg,#efca4c,#cf9f1e); --o-tasto-testo:#1e190d; --o-scuro:#1e1b16; --o-scuro-testo:#efd88f;
  --o-verde:#2e7d4f; --o-rosso:#b8433a; --o-crema:#fbf6e3; --o-carta-viva:#fffbec;
  --o-ombra:0 1px 2px rgba(62,55,42,.06), 0 6px 18px rgba(88,76,54,.08);
  --o-ombra-alta:0 2px 6px rgba(62,55,42,.08), 0 16px 40px rgba(62,55,42,.16);
  --o-tit:"SG Titoli","Cormorant Garamond",Georgia,serif;
  /* il legno chiaro: l'oro chiaro stemperato nel fondo (due variabili nuove, solo per lo studio) */
  --legno:#f2ebdb; --legno-2:#e7dcc3; --legno-3:#d4c4a0;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#d9d3c4}
body{width:390px;height:844px;overflow:hidden;font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--o-testo);-webkit-font-smoothing:antialiased}

/* ---------- la vista e la telecamera ---------- */
#vista{position:relative;width:390px;height:844px;overflow:hidden;background:var(--o-fondo);user-select:none}
#mondo{position:absolute;left:0;top:0;width:780px;height:1688px;transform-origin:0 0}
#mondo>*{position:absolute}

/* ---------- il muro: intonaco avorio al centro, doghe di legno chiaro ai lati ---------- */
.muro{left:0;top:0;width:780px;height:1250px;background:
  radial-gradient(52% 34% at 50% 15%, rgba(255,255,255,.95), rgba(255,255,255,0) 72%),
  linear-gradient(180deg,#fdfcfa 0%,#f8f5ee 55%,#f1ece0 100%)}
.doghe{top:30px;width:158px;height:1220px;background:
  linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 40%,rgba(120,85,30,.10)),
  repeating-linear-gradient(90deg,var(--legno) 0 13px,var(--legno-2) 13px 14.5px,var(--legno) 14.5px 27px,var(--legno-3) 27px 28px)}
.doghe.sx{left:0;box-shadow:inset -10px 0 18px -10px rgba(110,80,30,.35)}
.doghe.dx{right:0;box-shadow:inset 10px 0 18px -10px rgba(110,80,30,.35)}
.doghe:after{content:"";position:absolute;top:0;bottom:0;width:3px;background:linear-gradient(90deg,var(--o-oro-chiaro),var(--o-oro),var(--o-oro-chiaro))}
.doghe.sx:after{right:0}.doghe.dx:after{left:0}

/* l'arco dietro al maxischermo (al posto dell'arco al neon) */
.arco{left:170px;top:10px;width:440px;height:1240px;border-radius:220px 220px 0 0 / 120px 120px 0 0;
  background:linear-gradient(180deg,#ffffff 0%,#faf7f0 40%,#f3eee1 100%);
  box-shadow:0 0 0 3px #d2a93a,0 0 0 5px rgba(255,255,255,.8),0 0 0 6px rgba(189,147,26,.45),0 0 60px rgba(226,197,106,.30)}

/* ---------- il traliccio coi fari: barra dorata e fari caldi ---------- */
.traliccio{left:0;top:0;width:780px;height:30px;background:
  repeating-linear-gradient(60deg,transparent 0 11px,rgba(120,85,20,.28) 11px 12.5px),
  repeating-linear-gradient(-60deg,transparent 0 11px,rgba(120,85,20,.28) 11px 12.5px),
  linear-gradient(180deg,#f6e3a0,#d3aa3a 60%,#a98113);box-shadow:0 3px 8px rgba(88,76,54,.25)}
.faro{top:14px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:radial-gradient(circle at 38% 34%,#fff,#fff0b8 38%,#e0b53c 72%,#7f5f0c);
  box-shadow:0 0 0 2px #a98113,0 0 22px 7px rgba(255,214,120,.6);z-index:3}
.fascio{top:26px;width:172px;height:1150px;transform-origin:50% 0;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,236,176,.60),rgba(255,236,176,.20) 45%,rgba(255,236,176,0));
  clip-path:polygon(44% 0,56% 0,100% 100%,0 100%);animation:fascio 6s ease-in-out infinite alternate}
@keyframes fascio{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}

/* ---------- le torri: due colonne avorio con i led d'oro che ballano ---------- */
.torre{top:84px;width:140px;height:304px;border-radius:16px;background:linear-gradient(180deg,#ffffff,#f6f2e8);
  box-shadow:0 0 0 2px var(--o-filo-oro),0 0 0 4px rgba(255,255,255,.8),var(--o-ombra-alta)}
.torre .stelle{position:absolute;left:0;right:0;top:10px;text-align:center;font-size:17px;letter-spacing:.35em;color:var(--o-oro);text-indent:.35em}
.torre .eq{position:absolute;left:8px;right:8px;top:44px;bottom:10px;display:flex;gap:3px}
.torre .col{flex:1;position:relative;overflow:hidden;border-radius:2px;
  background:repeating-linear-gradient(180deg,var(--o-fondo-2) 0 20px,transparent 20px 24.8px)}
.torre .col i{position:absolute;left:0;right:0;bottom:0;height:100%;will-change:transform;animation:eq var(--d,1.2s) steps(11) var(--r,0s) infinite alternate;
  background:repeating-linear-gradient(180deg,var(--c1,#efca4c) 0 20px,transparent 20px 24.8px);transform:translateY(var(--y,40%))}
@keyframes eq{from{transform:translateY(var(--y0,70%))}to{transform:translateY(var(--y1,10%))}}

/* ---------- il pavimento: parquet chiaro con il filetto d'oro ---------- */
.pavimento{left:0;top:1250px;width:780px;height:438px;background:
  radial-gradient(70% 26% at 50% 0,rgba(255,255,255,.65),rgba(255,255,255,0)),
  repeating-linear-gradient(90deg,rgba(150,110,40,.0) 0 69px,rgba(150,110,40,.16) 69px 70.5px),
  linear-gradient(180deg,#f0e7d2 0%,#e6d9bb 55%,#dccda8 100%)}
.tappeto{left:70px;top:1395px;width:640px;height:230px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.62),rgba(255,255,255,.18) 78%,rgba(255,255,255,0));box-shadow:0 0 0 1.5px rgba(189,147,26,.32),0 0 0 8px rgba(255,255,255,.22),0 0 0 9px rgba(189,147,26,.18)}
.filetto{left:0;top:1250px;width:780px;height:7px;background:linear-gradient(90deg,#ecd283,#bd931a 25%,#f4e2a0 50%,#bd931a 75%,#ecd283);box-shadow:0 2px 10px rgba(189,147,26,.55);z-index:2}

/* ---------- le gradinate (il canvas del pubblico) ---------- */
#folla{left:0;top:439px;width:780px;height:810px}
.carto{z-index:4;margin:-34px 0 0 -23px;width:46px;transform-origin:50% 100%;animation:sventola var(--d,1.8s) ease-in-out var(--r,0s) infinite alternate}
.carto b{display:block;background:var(--o-carta);color:var(--o-testo);border-radius:5px;font:700 11px/1.1 var(--o-tit);letter-spacing:.04em;text-align:center;padding:4px 2px 3px;
  box-shadow:0 0 0 1px var(--o-filo-oro),0 3px 7px rgba(62,55,42,.25)}
.carto:after{content:"";display:block;width:3px;height:12px;margin:0 auto;background:#b9954c}
@keyframes sventola{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.scint{z-index:4;width:14px;height:14px;margin:-7px;background:radial-gradient(circle,#fff6cf 0 18%,#efca4c 19% 42%,rgba(239,202,76,0) 70%);
  clip-path:polygon(50% 0,59% 41%,100% 50%,59% 59%,50% 100%,41% 59%,0 50%,41% 41%);animation:scint 2.4s ease-in-out var(--r,0s) infinite}
@keyframes scint{0%,100%{opacity:.15;transform:scale(.5)}50%{opacity:1;transform:scale(1.1)}}
.macchia{z-index:3;width:210px;height:210px;margin:-105px;border-radius:50%;background:radial-gradient(circle,rgba(255,226,150,.45),rgba(255,226,150,0) 68%);pointer-events:none}

/* ---------- il maxischermo ---------- */
.schermo{left:195px;top:51px;width:390px;height:844px;z-index:5}
.cornice{position:absolute;inset:-16px;border-radius:26px;
  background:linear-gradient(135deg,#f7e6a6 0%,#d6ad3c 28%,#a98113 52%,#e8c862 78%,#f7e6a6 100%);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.55),inset 0 0 0 4px rgba(120,85,20,.28),0 0 0 1px rgba(120,85,20,.45),0 18px 44px rgba(88,76,54,.30)}
.cornice:after{content:"";position:absolute;inset:14px;border-radius:14px;background:linear-gradient(160deg,#fffefb,#efe3bf);box-shadow:inset 0 0 0 1px rgba(120,85,20,.35)}
.perla{position:absolute;width:7px;height:7px;margin:-3.5px;border-radius:50%;background:radial-gradient(circle at 38% 34%,#fff,#fff0b8 45%,#d6ad3c);box-shadow:0 0 8px 2px rgba(255,223,130,.8)}
.perla.s{background:radial-gradient(circle at 38% 34%,#e9d49a,#b58f23);box-shadow:none}
.perla.b{animation:lamp .9s linear infinite alternate}.perla.b.s{animation:lampSp .9s linear infinite alternate}
@keyframes lamp{0%,45%{opacity:1}55%,100%{opacity:.2}}
@keyframes lampSp{0%,45%{opacity:.2}55%,100%{opacity:1}}
.vetro{position:absolute;inset:0;border-radius:14px;overflow:hidden;
  background:linear-gradient(180deg,#fffefc 0%,#fbf8ef 60%,#f6f0df 100%);
  box-shadow:inset 0 0 0 1px var(--o-filo-oro),inset 0 0 50px rgba(226,197,106,.20)}
.vetro:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(118deg,rgba(255,255,255,.75),rgba(255,255,255,0) 30%)}
.dentro{position:absolute;inset:0;display:flex;flex-direction:column;padding:8px 12px 104px}

/* sigla sul maxischermo */
.sigla:before{content:"";position:absolute;left:50%;top:44%;width:150%;aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none;background:repeating-conic-gradient(from 0deg,rgba(226,197,106,.16) 0 7deg,rgba(226,197,106,0) 7deg 15deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 62%);mask:radial-gradient(circle,#000 0,transparent 62%)}
.sigla{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.sigla .st{font-size:24px;letter-spacing:.35em;text-indent:.35em;color:var(--o-oro)}
.sigla .logo{font:700 52px/.98 var(--o-tit);letter-spacing:.015em;color:var(--o-testo)}
.sigla .linea{width:96px;height:2px;background:linear-gradient(90deg,transparent,var(--o-oro),transparent)}
.sigla .sotto{font-size:13px;font-weight:700;letter-spacing:.34em;text-indent:.34em;text-transform:uppercase;color:var(--o-oro-testo)}

/* una carta della Linea del tempo sul maxischermo (il gioco poi si converte per conto suo: qui si vede come sta sul vetro chiaro) */
.vetro{--v-testo:var(--o-testo);--v-tenue:var(--o-tenue);--v-carta:var(--o-carta);--v-filo:var(--o-filo-oro);--v-pill:var(--o-scuro);--v-pill-t:var(--o-scuro-testo);--v-oro:var(--o-oro)}
.hud{display:flex;gap:6px;margin:0 42px;justify-content:center}
.pill{display:flex;align-items:center;gap:5px;padding:3px 9px 3px 3px;border-radius:99px;background:var(--v-carta);box-shadow:inset 0 0 0 1px var(--o-filo),var(--o-ombra);font-size:11px;font-weight:600;color:var(--v-tenue)}
.pill.io{box-shadow:inset 0 0 0 1.5px var(--o-oro),var(--o-ombra);background:var(--o-carta-viva);color:var(--v-testo)}
.pill .f{width:28px;height:28px;border-radius:50%;overflow:hidden;background:var(--o-fondo-2);flex:0 0 auto}
.pill .f img{width:100%;height:100%;object-fit:cover;object-position:50% 0;display:block}
.pill b{display:block;font-size:15px;line-height:1;color:inherit;font-weight:800}
.tocca{text-align:center;margin-top:9px}
.tocca h3{margin:0;font:700 23px/1 var(--o-tit);color:var(--v-testo)}
.tocca p{margin:3px 0 0;font-size:11.5px;font-weight:600;color:var(--v-tenue);letter-spacing:.02em}
.barra-t{height:5px;border-radius:5px;background:var(--o-filo);margin:9px 0 10px;overflow:hidden}
.barra-t i{display:block;height:100%;width:68%;border-radius:5px;background:linear-gradient(90deg,#efca4c,#cf9f1e)}
.carta{position:relative;border-radius:18px;padding:12px 14px 14px;background:var(--v-carta);box-shadow:inset 0 0 0 1px var(--v-filo),var(--o-ombra)}
.carta .riga{display:flex;align-items:center;gap:6px}
.cat{display:inline-flex;align-items:center;gap:5px;background:var(--v-pill);color:var(--v-pill-t);border-radius:99px;padding:5px 11px;font-size:10.5px;font-weight:800;letter-spacing:.14em}
.mini{margin-left:auto;font-size:11px;font-weight:700;color:var(--v-testo);padding:5px 10px;border-radius:99px;box-shadow:inset 0 0 0 1px var(--v-filo);background:var(--o-carta)}
.anno{background:var(--v-pill);color:var(--v-pill-t);border-radius:99px;padding:5px 13px;font:700 14px/1 var(--o-tit);font-variant-numeric:lining-nums;letter-spacing:.12em}
.carta h4{margin:11px 0 0;font:700 27px/1.04 var(--o-tit);color:var(--v-testo);padding-right:20px}
.tl{position:relative;margin-top:16px;height:210px}
.tl .asse{position:absolute;left:86px;top:0;bottom:0;width:2px;background:linear-gradient(180deg,transparent,var(--o-oro) 12%,var(--o-oro) 88%,transparent);opacity:.85}
.slot{position:absolute;left:68px;display:flex;align-items:center;gap:6px}
.slot span.p{width:20px;height:20px;border-radius:50%;background:var(--v-carta);box-shadow:inset 0 0 0 1.5px var(--o-oro);display:grid;place-items:center;font:800 14px/1 system-ui;color:var(--o-oro-testo);flex:0 0 auto}
.slot span.t{border:1.5px dashed var(--o-oro);border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:700;color:var(--o-oro-testo);background:rgba(255,251,236,.7)}
.ev{position:absolute;left:0;top:70px;right:0;display:flex;align-items:center}
.ev .y{width:62px;text-align:center;background:var(--v-pill);color:var(--v-pill-t);border-radius:99px;padding:6px 0;font:700 17px/1 var(--o-tit);font-variant-numeric:lining-nums;letter-spacing:.06em;margin-right:-4px;z-index:1}
.ev .d{width:11px;height:11px;border-radius:50%;background:var(--o-oro);box-shadow:0 0 0 3px var(--v-carta),0 0 0 4px var(--o-oro);margin:0 12px 0 10px;flex:0 0 auto}
.ev .c{flex:1;background:var(--v-carta);border-radius:12px;padding:8px 10px;box-shadow:inset 0 0 0 1px var(--v-filo),inset 3px 0 0 var(--o-oro);font-size:11.5px;line-height:1.3;color:var(--v-tenue)}
.ev .c b{display:block;font:700 16px/1.1 var(--o-tit);color:var(--v-testo);margin-bottom:3px}
.comandi{margin-top:auto;display:flex;gap:6px;align-items:center;justify-content:center;margin-bottom:6px}
.comandi span{padding:9px 11px;border-radius:12px;background:var(--o-carta);box-shadow:inset 0 0 0 1px var(--o-filo-oro);font-size:12.5px;font-weight:700;color:var(--v-testo)}
.comandi span.g{flex:1;text-align:center;color:var(--o-oro-testo)}
.slider{height:4px;border-radius:4px;background:var(--o-filo);margin:6px 8px 0;position:relative}
.slider:before{content:"";position:absolute;left:0;top:0;bottom:0;width:50%;background:linear-gradient(90deg,#efca4c,#cf9f1e);border-radius:4px}
.slider:after{content:"";position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px;border-radius:50%;background:var(--o-carta);box-shadow:inset 0 0 0 2px var(--o-oro),var(--o-ombra)}

/* versione «schermo scuro»: nero caldo con filetti d'oro (come uno schermo vero di lusso) */
#vista.scuro .vetro{background:radial-gradient(130% 55% at 50% 0%,#3a3224 0%,#26211a 52%,#171410 100%);box-shadow:inset 0 0 0 1px rgba(226,197,106,.7),inset 0 0 60px rgba(0,0,0,.4);
  --v-testo:#fbf4de;--v-tenue:#cdbf98;--v-carta:rgba(255,255,255,.07);--v-filo:rgba(226,197,106,.55);--v-pill:var(--o-oro-chiaro);--v-pill-t:#1e1b16;--v-oro:var(--o-oro-chiaro)}
#vista.scuro .vetro:after{background:linear-gradient(118deg,rgba(255,255,255,.14),rgba(255,255,255,0) 32%)}
#vista.scuro .sigla .logo{color:#fbf4de}#vista.scuro .sigla .sotto{color:var(--o-oro-chiaro)}#vista.scuro .sigla .st{color:var(--o-oro-chiaro)}
#vista.scuro .pill{box-shadow:inset 0 0 0 1px rgba(226,197,106,.35)}#vista.scuro .pill.io{background:rgba(236,210,131,.14);box-shadow:inset 0 0 0 1.5px var(--o-oro-chiaro);color:#fbf4de}
#vista.scuro .mini,#vista.scuro .comandi span{background:rgba(255,255,255,.07);color:#fbf4de}
#vista.scuro .slot span.t{background:rgba(255,255,255,.05);color:var(--o-oro-chiaro);border-color:var(--o-oro-chiaro)}
#vista.scuro .slot span.p{color:var(--o-oro-chiaro);box-shadow:inset 0 0 0 1.5px var(--o-oro-chiaro)}
#vista.scuro .comandi span.g{color:var(--o-oro-chiaro)}
#vista.scuro .ev .d{box-shadow:0 0 0 3px #26211a,0 0 0 4px var(--o-oro-chiaro);background:var(--o-oro-chiaro)}
#vista.scuro .tl .asse{background:linear-gradient(180deg,transparent,var(--o-oro-chiaro) 12%,var(--o-oro-chiaro) 88%,transparent)}
#vista.scuro .slider{background:rgba(255,255,255,.14)}#vista.scuro .slider:after{background:#26211a}
#vista.scuro .barra-t{background:rgba(255,255,255,.14)}

/* ---------- i banconi dei concorrenti (i «leggii») ---------- */
.riflettore{z-index:5;left:-800px;top:-300px;width:2400px;height:2400px;pointer-events:none;background:radial-gradient(closest-side,rgba(40,34,24,0) 0,rgba(40,34,24,0) 12%,rgba(40,34,24,.34) 42%,rgba(40,34,24,.40) 100%)}
.leg{z-index:6}
#vista.spot .leg:not(.acceso){z-index:4}
.leg .luce{position:absolute;left:50%;bottom:-17%;width:172%;height:480%;transform:translateX(-50%);opacity:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,244,205,.95),rgba(255,244,205,.55) 55%,rgba(255,244,205,0));clip-path:polygon(41% 0,59% 0,100% 100%,0 100%)}
.leg .pozza{position:absolute;z-index:1;left:50%;bottom:-24%;width:180%;height:30%;transform:translateX(-50%);opacity:0;pointer-events:none;
  background:radial-gradient(50% 50% at 50% 50%,rgba(255,236,170,.95),rgba(255,236,170,0))}
.leg .alone{position:absolute;left:50%;top:0;width:96%;aspect-ratio:1;transform:translateX(-50%);opacity:0;pointer-events:none;border-radius:50%;
  background:radial-gradient(circle,rgba(255,232,160,.95),rgba(255,232,160,0) 70%)}
.leg.acceso .luce,.leg.acceso .pozza{opacity:1}.leg.acceso .alone{opacity:1;transform:translateX(-50%) scale(1.12)}
.leg .av{position:relative;z-index:2;width:74%;margin:0 auto;aspect-ratio:178/182}
.leg .av img{width:100%;height:100%;display:block}
.leg .tu{position:absolute;z-index:5;left:10%;top:6.1em;line-height:0}
.leg .tu span{display:inline-block;background:var(--o-scuro);color:var(--o-scuro-testo);font:800 12.5px/1 "Inter",system-ui,sans-serif;letter-spacing:.06em;padding:7px 14px;border-radius:99px;box-shadow:0 0 0 1px rgba(236,210,131,.6)}
.podio{position:relative;z-index:3;width:100%;height:6.82em;margin-top:-.9em}
.piano{position:absolute;left:0;top:0;width:100%;height:1.1em;border-radius:.55em .55em .2em .2em;
  background:linear-gradient(180deg,#ffffff 0%,#fbf7ea 45%,#ecdfb8 100%);box-shadow:0 0 0 .06em var(--o-filo-oro),0 .25em .45em rgba(62,55,42,.28)}
.piano:after{content:"";position:absolute;left:8%;right:8%;top:.14em;height:.12em;border-radius:.1em;background:linear-gradient(90deg,transparent,rgba(189,147,26,.7),transparent)}
