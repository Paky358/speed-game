<title>Serata Giochi</title>
<style>
/* =========================================================
   Serata Giochi — aspetto comune a TUTTI i giochi.
   Colori, caratteri e bottoni stanno qui, una volta sola.
   ========================================================= */

:root{
  --sfondo:      #141326;
  --sfondo-2:    #1e1c3a;
  --carta:       #272451;
  --carta-2:     #322e63;
  --testo:       #f3f1ff;
  --testo-tenue: #b3aede;
  --accento:     #ffca3a;
  --accento-scuro:#e0a90a;
  --verde:       #37d47e;
  --rosso:       #ff5d6c;
  --ombra:       0 6px 18px rgba(0,0,0,.35);
  --raggio:      18px;
  --tocco:       52px; /* altezza minima comoda per un dito */
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html,body{ margin:0; padding:0; }

body{
  font-family:var(--font);
  background:var(--sfondo);
  color:var(--testo);
  min-height:100vh;
  min-height:100dvh;
  -webkit-font-smoothing:antialiased;
}

#app{
  max-width:560px;
  margin:0 auto;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
}

/* ---- Schermata: intestazione + contenuto scorrevole + piede ---- */
.schermata{
  display:flex;
  flex-direction:column;
  flex:1;
  min-height:100vh;
  min-height:100dvh;
  padding:
    calc(16px + env(safe-area-inset-top))
    16px
    calc(16px + env(safe-area-inset-bottom));
  animation:entra .25s ease;
}
@keyframes entra{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }

.testa{ display:flex; align-items:center; gap:12px; margin-bottom:14px; }
.testa h1{ font-size:1.35rem; margin:0; line-height:1.1; }
.testa .sotto{ color:var(--testo-tenue); font-size:.95rem; margin:2px 0 0; }
.contenuto{ flex:1; }
.piede{ margin-top:14px; display:flex; flex-direction:column; gap:10px; }

/* ---- Bottoni (uguali ovunque) ---- */
.btn{
  appearance:none; border:0; cursor:pointer;
  font-family:inherit; font-size:1.05rem; font-weight:700;
  min-height:var(--tocco); padding:14px 18px;
  border-radius:var(--raggio);
  background:var(--carta-2); color:var(--testo);
  box-shadow:var(--ombra);
  transition:transform .06s ease, filter .15s ease;
  width:100%;
  display:flex; align-items:center; justify-content:center; gap:10px;
}
.btn:active{ transform:scale(.97); }
.btn-primario{ background:var(--accento); color:#241f00; }
.btn-verde{ background:var(--verde); color:#04321c; }
.btn-rosso{ background:var(--rosso); color:#3a0009; }
.btn-fantasma{ background:transparent; box-shadow:none; color:var(--testo-tenue); font-weight:600; }
.btn:disabled{ opacity:.45; }
.btn-piccolo{ font-size:.95rem; min-height:44px; padding:10px 14px; width:auto; }

/* ---- Home: elenco dei giochi ---- */
.griglia-giochi{ display:grid; grid-template-columns:1fr; gap:14px; }
.tessera{
  display:flex; align-items:center; gap:16px; text-align:left;
  background:var(--carta); border-radius:var(--raggio);
  padding:16px; box-shadow:var(--ombra); cursor:pointer; border:0; color:inherit;
  width:100%; transition:transform .06s ease;
}
.tessera:active{ transform:scale(.98); }
.tessera .icona{ font-size:2.4rem; line-height:1; }
.tessera .info h2{ margin:0 0 3px; font-size:1.15rem; }
.tessera .info p{ margin:0; color:var(--testo-tenue); font-size:.92rem; }
.tessera .info .meta{ margin-top:6px; font-size:.8rem; color:var(--accento); font-weight:700; }
.tessera.presto{ opacity:.5; cursor:default; }

/* ---- Setup giocatori ---- */
.giocatore-riga{ display:flex; gap:10px; align-items:center; margin-bottom:10px; }
.giocatore-riga input{
  flex:1; font-family:inherit; font-size:1.05rem;
  padding:12px 14px; border-radius:14px; border:2px solid transparent;
  background:var(--carta); color:var(--testo); min-height:var(--tocco);
}
.giocatore-riga input:focus{ outline:none; border-color:var(--accento); }
.togli{ background:var(--carta); color:var(--rosso); border:0; border-radius:14px;
  width:var(--tocco); height:var(--tocco); font-size:1.4rem; cursor:pointer; flex:0 0 auto; }

.stepper{ display:flex; align-items:center; gap:14px; background:var(--carta);
  border-radius:14px; padding:8px 14px; }
.stepper button{ width:44px; height:44px; border-radius:12px; border:0; cursor:pointer;
  background:var(--carta-2); color:var(--testo); font-size:1.4rem; font-weight:800; }
.stepper .valore{ font-size:1.3rem; font-weight:800; min-width:2ch; text-align:center; }

.etichetta{ font-size:.9rem; color:var(--testo-tenue); font-weight:700;
  text-transform:uppercase; letter-spacing:.04em; margin:18px 0 8px; }

/* ---- Passaggio del telefono ---- */
.passa{ text-align:center; display:flex; flex-direction:column; align-items:center;
  justify-content:center; flex:1; gap:8px; }
.passa .grande{ font-size:1.7rem; font-weight:800; }
.passa .emoji{ font-size:4rem; }

/* ---- Tabellone finale ---- */
.classifica{ list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:10px; }
.classifica li{ display:flex; align-items:center; gap:14px; background:var(--carta);
  border-radius:var(--raggio); padding:14px 16px; box-shadow:var(--ombra); }
.classifica .pos{ font-size:1.5rem; font-weight:800; width:1.6em; text-align:center; }
.classifica .nome{ flex:1; font-size:1.1rem; font-weight:700; }
.classifica .punti{ color:var(--testo-tenue); font-weight:700; }
.classifica li.vincitore{ background:linear-gradient(135deg,var(--accento),var(--accento-scuro)); color:#241f00; }
.classifica li.vincitore .punti{ color:#3a3000; }

/* ---- Novità (diario aggiornamenti) ---- */
.pallino{ width:10px; height:10px; border-radius:50%; background:var(--rosso);
  display:inline-block; margin-left:2px; box-shadow:0 0 0 3px rgba(255,93,108,.25); }
.novita-card{ background:var(--carta); border-radius:var(--raggio); padding:16px;
  box-shadow:var(--ombra); margin-bottom:14px; }
.novita-data{ font-size:.8rem; font-weight:700; color:var(--accento);
  text-transform:uppercase; letter-spacing:.04em; }
.novita-titolo{ margin:4px 0 10px; font-size:1.2rem; }
.novita-punti{ margin:0; padding-left:1.1em; }
.novita-punti li{ margin-bottom:7px; line-height:1.4; color:var(--testo); }

/* ---- Categorie (scelta dell'host) ---- */
.cat-griglia{ display:flex; flex-wrap:wrap; gap:10px; }
.cat-chip{ display:flex; align-items:center; gap:8px; font-family:inherit; font-size:1rem;
  font-weight:700; cursor:pointer; padding:12px 14px; min-height:var(--tocco);
  border-radius:14px; background:var(--carta); color:var(--testo-tenue);
  border:2px solid transparent; transition:all .12s ease; }
.cat-chip .ci{ font-size:1.2rem; }
.cat-chip .spunta{ opacity:0; font-weight:900; color:var(--verde); }
.cat-chip.attiva{ color:var(--testo); border-color:var(--accento); background:var(--carta-2); }
.cat-chip.attiva .spunta{ opacity:1; }

/* ---- Scelta della modalità (un telefono / ognuno il suo) ---- */
.modo-griglia{ display:flex; flex-direction:column; gap:10px; }
.modo-chip{ display:flex; align-items:center; gap:14px; text-align:left; width:100%;
  font-family:inherit; cursor:pointer; padding:14px 16px; min-height:var(--tocco);
  border-radius:14px; background:var(--carta); color:var(--testo-tenue);
  border:2px solid transparent; transition:all .12s ease; }
.modo-chip .mi{ font-size:1.8rem; }
.modo-chip .mt{ font-size:1.05rem; font-weight:800; }
.modo-chip .ms{ font-size:.85rem; }
.modo-chip.attiva{ color:var(--testo); border-color:var(--accento); background:var(--carta-2); }

/* ---- Stanza online ---- */
.codice-stanza{ font-size:2.6rem; font-weight:900; letter-spacing:.15em; text-align:center;
  background:linear-gradient(135deg,var(--accento),var(--accento-scuro)); color:#241f00;
  border-radius:var(--raggio); padding:14px; box-shadow:var(--ombra); }
.lobby-giocatore{ background:var(--carta); border-radius:12px; padding:12px 14px;
  margin-bottom:8px; font-size:1.05rem; font-weight:700; }

/* ---- Campo del link da condividere ---- */
.link-campo{ width:100%; font-family:inherit; font-size:.95rem; margin-top:10px;
  padding:12px 14px; border-radius:14px; border:2px solid var(--accento);
  background:var(--carta); color:var(--testo); min-height:var(--tocco); }
.link-avviso{ margin-top:8px; font-size:.9rem; color:var(--testo-tenue); line-height:1.4; }

/* ---- Utility ---- */
.centro{ text-align:center; }
.tenue{ color:var(--testo-tenue); }
.spazio{ height:10px; }
</style>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script>
/* =========================================================
   MOTORE COMUNE — "SG"
   Tutto ciò che ogni gioco condivide sta qui, scritto una
   volta sola: le schermate comuni (home, giocatori, regole,
   tabellone finale), la lista dei giocatori, il passaggio
   del telefono e il giro di partita (comincia / fine / rigioca).

   Un gioco si "innesta" chiamando SG.registra({...}).
   Vedi docs/COME-SI-AGGIUNGE-UN-GIOCO.md
   ========================================================= */
(function () {
  "use strict";

  var giochi = [];            // giochi registrati
  var app;                    // contenitore radice (#app)
  var linkParams = {};        // impostazioni arrivate da un link condiviso

  // Legge le impostazioni scritte nel link (dopo il #), es.:
  //   #gioco=timeline&cat=storia,calcio&carte=5
  function leggiParametriLink() {
    var out = {};
    var h = (location.hash || "").replace(/^#/, "");
    if (!h) return out;
    h.split("&").forEach(function (p) {
      var i = p.indexOf("=");
      if (i < 0) return;
      var k = decodeURIComponent(p.slice(0, i));
      var v = decodeURIComponent(p.slice(i + 1));
      out[k] = v;
    });
    if (out.cat) out.cat = out.cat.split(",").filter(Boolean);
    if (out.carte) out.carte = parseInt(out.carte, 10);
    return out;
  }

  // ------- piccoli aiuti per costruire l'interfaccia -------
  function el(tag, attrs, figli) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === "class") e.className = attrs[k];
      else if (k === "html") e.innerHTML = attrs[k];
      else if (k === "text") e.textContent = attrs[k];
      else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    if (figli) figli.forEach(function (f) {
      if (f == null) return;
      e.appendChild(typeof f === "string" ? document.createTextNode(f) : f);
    });
    return e;
  }
  function svuota(n){ while (n.firstChild) n.removeChild(n.firstChild); }
  function mischia(a){ // Fisher-Yates
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  // Costruisce lo scheletro di una schermata: testa + contenuto + piede
  function schermata(opts) {
    opts = opts || {};
    var testa = el("div", { class: "testa" });
    if (opts.indietro) {
      testa.appendChild(el("button", {
        class: "btn btn-fantasma btn-piccolo", text: "‹", "aria-label": "Indietro",
        onclick: opts.indietro
      }));
    }
    var titoli = el("div");
    if (opts.icona) testa.insertBefore(el("span", { text: opts.icona, style: "font-size:1.8rem" }), null);
    if (opts.titolo) titoli.appendChild(el("h1", { text: opts.titolo }));
    if (opts.sotto) titoli.appendChild(el("p", { class: "sotto", text: opts.sotto }));
    testa.appendChild(titoli);

    var contenuto = el("div", { class: "contenuto" });
    var piede = el("div", { class: "piede" });
    var s = el("div", { class: "schermata" }, [testa, contenuto, piede]);
    s._contenuto = contenuto; s._piede = piede;
    return s;
  }

  function mostra(schermo) {
    svuota(app);
    app.appendChild(schermo);
    window.scrollTo(0, 0);
  }

  // =========================================================
  //  SCHERMATE COMUNI
  // =========================================================

  function schermataHome() {
    var s = schermata({ titolo: "Serata Giochi", sotto: "Scegli un gioco e passa il telefono" });
    var griglia = el("div", { class: "griglia-giochi" });

    giochi.forEach(function (g) {
      griglia.appendChild(el("button", {
        class: "tessera", onclick: function () { schermataGiocatori(g); }
      }, [
        el("span", { class: "icona", text: g.icona || "🎲" }),
        el("div", { class: "info" }, [
          el("h2", { text: g.nome }),
          el("p", { text: g.descrizione || "" }),
          el("div", { class: "meta", text: rangeGiocatori(g) })
        ])
      ]));
    });

    // Segnaposto: fa capire che ne arriveranno altri (senza prometterli)
    griglia.appendChild(el("div", { class: "tessera presto" }, [
      el("span", { class: "icona", text: "➕" }),
      el("div", { class: "info" }, [
        el("h2", { text: "Altri giochi in arrivo" }),
        el("p", { text: "Uno alla volta, fatto bene." })
      ])
    ]));

    s._contenuto.appendChild(griglia);

    // Tasto "Entra in una stanza" (per chi ha ricevuto un codice a voce)
    s._piede.appendChild(el("button", {
      class: "btn btn-fantasma", html: "🔗 Entra in una stanza (con un codice)",
      onclick: function () {
        var c = window.prompt("Scrivi il codice della stanza:");
        if (!c) return;
        c = c.trim().toUpperCase();
        if (c) { location.hash = "gioco=timeline&stanza=" + encodeURIComponent(c); location.reload(); }
      }
    }));

    // Tasto "Novità" (con pallino rosso se c'è qualcosa di non ancora visto)
    var novita = window.SG_NOVITA || [];
    if (novita.length) {
      var btn = el("button", { class: "btn btn-fantasma", onclick: schermataNovita });
      btn.appendChild(el("span", { text: "🆕 Novità" }));
      if (!novitaTutteViste()) btn.appendChild(el("span", { class: "pallino" }));
      s._piede.appendChild(btn);
    }

    mostra(s);
  }

  // ---- Novità (il diario di cosa viene aggiunto) ----
  var CHIAVE_NOVITA = "sg_novita_vista";
  function ultimaVersioneNovita() {
    var n = window.SG_NOVITA || [];
    return n.length ? n[0].v : 0;
  }
  function novitaTutteViste() {
    try { return Number(localStorage.getItem(CHIAVE_NOVITA)) >= ultimaVersioneNovita(); }
    catch (e) { return false; }
  }
  function segnaNovitaViste() {
    try { localStorage.setItem(CHIAVE_NOVITA, String(ultimaVersioneNovita())); } catch (e) {}
  }
  function schermataNovita() {
    var s = schermata({ icona: "🆕", titolo: "Novità", sotto: "Cosa è stato aggiunto", indietro: schermataHome });
    (window.SG_NOVITA || []).forEach(function (n) {
      var punti = el("ul", { class: "novita-punti" });
      (n.descrizione || []).forEach(function (r) { punti.appendChild(el("li", { text: r })); });
      s._contenuto.appendChild(el("div", { class: "novita-card" }, [
        el("div", { class: "novita-data", text: n.data }),
        el("h2", { class: "novita-titolo", text: n.titolo }),
        punti
      ]));
    });
    s._piede.appendChild(el("button", { class: "btn btn-primario", text: "Ho capito", onclick: schermataHome }));
    segnaNovitaViste(); // aperto = visto
    mostra(s);
  }

  function rangeGiocatori(g) {
    var min = g.giocatoriMin || 2, max = g.giocatoriMax || 8;
    return "👥 " + (min === max ? min : min + "–" + max) + " giocatori";
  }

  // ---- Scelta dei giocatori ----
  function schermataGiocatori(g) {
    var min = g.giocatoriMin || 2;
    var max = g.giocatoriMax || 8;
    var nomi = ["", ""]; // due righe di partenza
    while (nomi.length < min) nomi.push("");

    var s = schermata({
      icona: g.icona, titolo: g.nome, sotto: "Chi gioca?",
      indietro: schermataHome
    });

    var lista = el("div");
    function ridisegna() {
      svuota(lista);
      nomi.forEach(function (n, i) {
        var input = el("input", {
          type: "text", value: n, placeholder: "Giocatore " + (i + 1),
          maxlength: "16",
          oninput: function (ev) { nomi[i] = ev.target.value; }
        });
        var riga = el("div", { class: "giocatore-riga" }, [input]);
        if (nomi.length > min) {
          riga.appendChild(el("button", {
            class: "togli", text: "×", "aria-label": "Togli",
            onclick: function () { nomi.splice(i, 1); ridisegna(); }
          }));
        }
        lista.appendChild(riga);
      });
    }
    ridisegna();

    var aggiungi = el("button", {
      class: "btn btn-fantasma", html: "＋ Aggiungi giocatore",
      onclick: function () {
        if (nomi.length >= max) return;
        nomi.push(""); ridisegna();
        if (nomi.length >= max) aggiungi.disabled = true;
      }
    });

    s._contenuto.appendChild(lista);
    s._contenuto.appendChild(aggiungi);

    // Impostazioni specifiche del gioco (facoltative)
    var impostazioni = {};
    if (typeof g.impostazioni === "function") {
      var box = el("div");
      g.impostazioni(box, impostazioni, { el: el });
      s._contenuto.appendChild(box);
    }

    s._piede.appendChild(el("button", {
      class: "btn btn-fantasma", text: "Come si gioca",
      onclick: function () { schermataRegole(g, function () { schermataGiocatori(g); }); }
    }));
    s._piede.appendChild(el("button", {
      class: "btn btn-primario", text: "Comincia ▶",
      onclick: function () {
        var puliti = nomi.map(function (n, i) {
          return (n || "").trim() || ("Giocatore " + (i + 1));
        });
        if (puliti.length < min) return;
        avviaPartita(g, puliti, impostazioni);
      }
    }));

    mostra(s);
  }

  // ---- Regole ----
  function schermataRegole(g, indietro) {
    var s = schermata({ icona: g.icona, titolo: "Come si gioca", sotto: g.nome, indietro: indietro });
    var righe = g.regole || ["(regole non ancora scritte)"];
    var box = el("div");
    righe.forEach(function (r) {
      box.appendChild(el("p", { class: "", html: r, style: "font-size:1.05rem; line-height:1.5; margin:0 0 14px" }));
    });
    s._contenuto.appendChild(box);
    s._piede.appendChild(el("button", { class: "btn btn-primario", text: "Ho capito", onclick: indietro }));
    mostra(s);
  }

  // ---- Passaggio del telefono (interstiziale tra un turno e l'altro) ----
  function passaIlTelefono(nomeProssimo, quando) {
    var s = schermata({});
    var box = el("div", { class: "passa" }, [
      el("div", { class: "emoji", text: "🤝" }),
      el("p", { class: "tenue", text: "Passa il telefono a" }),
      el("div", { class: "grande", text: nomeProssimo })
    ]);
    s._contenuto.appendChild(box);
    s._piede.appendChild(el("button", { class: "btn btn-primario", text: "Sono " + nomeProssimo + " ▶", onclick: quando }));
    mostra(s);
  }

  // ---- Tabellone finale (uguale per tutti i giochi) ----
  // classifica: array ordinato dal 1° all'ultimo, ognuno { nome, punti (facolt.) }
  function schermataFine(g, classifica, giocatori, impostazioni) {
    var s = schermata({ icona: "🏆", titolo: "Fine partita", sotto: g.nome });
    var ol = el("ol", { class: "classifica" });
    var medaglie = ["🥇", "🥈", "🥉"];
    classifica.forEach(function (r, i) {
      ol.appendChild(el("li", { class: i === 0 ? "vincitore" : "" }, [
        el("span", { class: "pos", text: medaglie[i] || (i + 1) + "°" }),
        el("span", { class: "nome", text: r.nome }),
        r.punti != null ? el("span", { class: "punti", text: r.punti }) : null
      ]));
    });
    s._contenuto.appendChild(ol);

    s._piede.appendChild(el("button", {
      class: "btn btn-primario", text: "↻ Rigioca",
      onclick: function () { avviaPartita(g, giocatori, impostazioni); }
    }));
    s._piede.appendChild(el("button", {
      class: "btn btn-fantasma", text: "🏠 Torna ai giochi",
      onclick: schermataHome
    }));
    mostra(s);
  }

  // =========================================================
  //  GIRO DI PARTITA
  //  Consegna al gioco un "tavolo" con tutto ciò che gli serve,
  //  senza fargli sapere come sono fatte le schermate comuni.
  // =========================================================
  function avviaPartita(g, giocatori, impostazioni) {
    var contenitore = el("div");
    var schermo = el("div");
    schermo.appendChild(contenitore);

    var tavolo = {
      giocatori: giocatori.slice(),
      impostazioni: impostazioni || {},
      linkParams: linkParams,
      radice: contenitore,

      // aiuti riusabili (così i giochi non reinventano le stesse cose)
      el: el,
      svuota: svuota,
      mischia: mischia,
      schermata: schermata,
      mostra: function (s) { mostra(s); },

/* =========================================================
   COLLEGAMENTO TRA TELEFONI — "SGNet"
   Fa parlare i telefoni tra loro per la modalità
   "ognuno dal suo telefono", senza server né account:
   usa PeerJS (collegamento diretto tra browser).

   Un telefono "ospita" la stanza (è il cervello della
   partita); gli altri "entrano" con il codice della stanza.
   Se PeerJS non è disponibile (o il collegamento è bloccato),
   SGNet.disponibile() è false e il gioco resta comunque
   giocabile con un telefono solo.
   ========================================================= */
(function () {
  "use strict";

  // Prefisso per non confondersi con altre app sullo stesso servizio pubblico
  var PREFISso = "seratagiochi-v1-";
  var ALFABETO = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // niente lettere/numeri ambigui

  function codiceACaso(n) {
    var s = "";
    for (var i = 0; i < (n || 4); i++) s += ALFABETO[Math.floor(Math.random() * ALFABETO.length)];
    return s;
  }

  window.SGNet = {
    disponibile: function () { return typeof Peer !== "undefined"; },

    // L'host apre una stanza. cb: { onCodice, onArrivo(id), onAddio(id), onMsg(id,msg), onErrore(e) }
    ospita: function (cb) {
      if (!this.disponibile()) { cb.onErrore && cb.onErrore({ type: "no-peerjs" }); return null; }
      var conns = {};
      var peer, tentativi = 0;

      function prova() {
        var codice = codiceACaso(4);
        peer = new Peer(PREFISso + codice, { debug: 1 });
        peer.on("open", function () { cb.onCodice && cb.onCodice(codice); });
        peer.on("connection", function (conn) {
          conn.on("open", function () {
            conns[conn.peer] = conn;
            cb.onArrivo && cb.onArrivo(conn.peer);
            conn.on("data", function (d) { cb.onMsg && cb.onMsg(conn.peer, d); });
            conn.on("close", function () { delete conns[conn.peer]; cb.onAddio && cb.onAddio(conn.peer); });
          });
        });
        peer.on("error", function (e) {
          if (e && e.type === "unavailable-id" && tentativi < 5) { tentativi++; try { peer.destroy(); } catch (x) {} prova(); return; }
          cb.onErrore && cb.onErrore(e);
        });
      }
      prova();

      return {
        invia: function (msg) { for (var k in conns) { try { conns[k].send(msg); } catch (e) {} } },
        inviaA: function (id, msg) { if (conns[id]) { try { conns[id].send(msg); } catch (e) {} } },
        chiudi: function () { try { peer.destroy(); } catch (e) {} }
      };
    },

    // Un ospite entra nella stanza. cb: { onAperto, onMsg(msg), onChiuso, onErrore(e) }
    entra: function (codice, cb) {
      if (!this.disponibile()) { cb.onErrore && cb.onErrore({ type: "no-peerjs" }); return null; }
      var peer = new Peer(undefined, { debug: 1 });
      var conn, mioId;
      peer.on("open", function (id) {
        mioId = id;
        conn = peer.connect(PREFISso + codice.toUpperCase(), { reliable: true });
        conn.on("open", function () {
          cb.onAperto && cb.onAperto(mioId); // passa il PROPRIO id all'ospite
          conn.on("data", function (d) { cb.onMsg && cb.onMsg(d); });
          conn.on("close", function () { cb.onChiuso && cb.onChiuso(); });
        });
        conn.on("error", function (e) { cb.onErrore && cb.onErrore(e); });
      });
      peer.on("error", function (e) { cb.onErrore && cb.onErrore(e); });

      return {
        invia: function (msg) { try { conn && conn.send(msg); } catch (e) {} },
        chiudi: function () { try { peer.destroy(); } catch (e) {} }
      };
    }
  };
})();

    var s = t.schermata({});
    s._contenuto.appendChild(el("div", { class: "tl-esito" }, [
      el("div", { class: "faccia", text: giusto ? "✅" : "❌" }),
      el("div", { class: "verdetto " + (giusto ? "giusto" : "sbagliato"),
        text: giusto ? "Esatto!" : "Non ci siamo" }),
      el("div", { class: "annone", text: annoTesto(carta.anno) }),
      el("div", { class: "titoletto", text: carta.titolo }),
      carta.fatto ? el("div", { class: "fatto", text: carta.fatto }) : null
    ]));

    if (vinto) {
      s._piede.appendChild(el("button", {
        class: "btn btn-verde", text: "🏆 " + g.nome + " ha finito le carte!",
        onclick: function () { fineVittoria(t, stato); }
      }));
      t.mostra(s);
      return;
    }

    // prossimo giocatore
    stato.turno += 1;
    var prossimo = giocatoreDiTurno(stato).nome;
    var soloUno = stato.giocatori.length === 1;
    s._piede.appendChild(el("button", {
      class: "btn btn-primario",
      text: soloUno ? "Continua ▶" : "Passa a " + prossimo + " ▶",
      onclick: function () {
        if (soloUno) iniziaTurno(t, stato);
        else t.passaA(prossimo, function () { iniziaTurno(t, stato); });
      }
    }));
    t.mostra(s);
  }

  // --- Fine ---
  function classificaDa(stato) {
    return stato.giocatori.slice().sort(function (a, b) {
      return a.restano - b.restano;
    }).map(function (g) {
      return { nome: g.nome, punti: g.restano === 0 ? "finito!" : g.restano + " da piazzare" };
    });
  }

  function fineVittoria(t, stato) { t.fine(classificaDa(stato)); }

  function finePerMazzo(t, stato) {
    // finite le carte del mazzo: vince chi ne ha piazzate di più (meno restano)
    t.fine(classificaDa(stato));
  }

  function confermaUscita() {
    return window.confirm("Uscire dalla partita in corso?");
  }

  function annoTesto(a) {
    return a < 0 ? Math.abs(a) + " a.C." : String(a);
  }

  // =========================================================
  //  MODALITÀ "OGNUNO DAL SUO TELEFONO"
  //  Un telefono ospita (tiene la partita); gli altri entrano
  //  con il codice. Tutti vedono la stessa partita, aggiornata
  //  da sola a ogni mossa.
  // =========================================================

  function indexById(stato, id) {
    for (var i = 0; i < stato.giocatori.length; i++) if (stato.giocatori[i].id === id) return i;
    return -1;
  }
  function trovaGiocatore(vm, id) {
    for (var i = 0; i < vm.giocatori.length; i++) if (vm.giocatori[i].id === id) return vm.giocatori[i];
    return null;
  }
  function vmDa(stato) {
    var g = stato.giocatori;
    var idx = g.length ? (stato.turno % g.length) : 0;
    return {
      fase: stato.fase, codice: stato.codice,
      giocatori: g.map(function (x) { return { id: x.id, nome: x.nome, restano: x.restano }; }),
      turnoId: g.length ? g[idx].id : null,
      turnoNome: g.length ? g[idx].nome : "",
      linea: stato.linea.map(function (e) { return { anno: e.anno, titolo: e.titolo }; }),
      carta: stato.carta ? { titolo: stato.carta.titolo } : null,
      esito: stato.esito || null,
      classifica: stato.classifica || null
    };
  }

  // ---- L'HOST apre la stanza ----
  function hostCrea(t) {
    if (!(window.SGNet && SGNet.disponibile())) return schermataNoNet(t);
    var carte = (t.impostazioni && t.impostazioni.carte) || 5;
    var hostNome = (t.giocatori && t.giocatori[0]) ? t.giocatori[0] : "Host";
    var stato = {
      mazzo: mischiaArr(pescaDati(t.impostazioni)), linea: [], turno: 0, carta: null,
      esito: null, classifica: null, fase: "lobby", iniziata: false, carte: carte,
      codice: "…", vittoria: null,
      giocatori: [{ id: "host", nome: hostNome, restano: carte }]
    };

    var rete = SGNet.ospita({
      onCodice: function (codice) { stato.codice = codice; broadcastEdisegna(); },
      onAddio: function (id) {
        var i = indexById(stato, id);
        if (i < 0) return;
        stato.giocatori.splice(i, 1);
        if (stato.turno >= stato.giocatori.length && stato.giocatori.length) stato.turno = stato.turno % stato.giocatori.length;
        if (stato.iniziata && stato.giocatori.length === 0) { rete.chiudi(); return t.esci(); }
        broadcastEdisegna();
      },
      onMsg: function (id, msg) {
        if (!msg || !msg.t) return;
        if (msg.t === "join") {
          if (!stato.iniziata && indexById(stato, id) < 0)
            stato.giocatori.push({ id: id, nome: String(msg.nome || "Amico").slice(0, 16), restano: stato.carte });
          broadcastEdisegna();
        } else if (msg.t === "place") { piazza(id, msg.gap); }
        else if (msg.t === "avanti") { avanti(id); }
      },
      onErrore: function (e) { schermataNoNet(t, e); }
    });

    function invia() { rete.invia({ t: "vm", vm: vmDa(stato) }); }
    function broadcastEdisegna() { invia(); disegna(); }

    function comincia() {
      if (stato.iniziata || stato.giocatori.length < 1) return;
      stato.iniziata = true;
      stato.linea = [ stato.mazzo.pop() ]; ordina(stato.linea);
      stato.carta = stato.mazzo.pop(); stato.esito = null; stato.fase = "turno";
      broadcastEdisegna();
    }
    function piazza(playerId, gap) {
      if (stato.fase !== "turno") return;
      var g = stato.giocatori[stato.turno % stato.giocatori.length];
      if (!g || g.id !== playerId) return;
      var carta = stato.carta, linea = stato.linea, Y = carta.anno;
      var ok = ((gap === 0) || (linea[gap - 1].anno <= Y)) && ((gap === linea.length) || (Y <= linea[gap].anno));
      if (ok) { linea.push(carta); ordina(linea); g.restano -= 1; }
      stato.esito = { giusto: ok, anno: carta.anno, titolo: carta.titolo, fatto: carta.fatto || "", nome: g.nome };
      stato.vittoria = (ok && g.restano === 0) ? g.id : null;
      stato.fase = "esito";
      broadcastEdisegna();
    }
    function avanti(playerId) {
      if (stato.fase !== "esito") return;
      var g = stato.giocatori[stato.turno % stato.giocatori.length];
      if (!g || g.id !== playerId) return; // solo chi ha appena giocato fa avanzare
      if (stato.vittoria) return finisci();
      stato.turno += 1;
      if (stato.mazzo.length === 0) return finisci();
      stato.carta = stato.mazzo.pop(); stato.esito = null; stato.fase = "turno";
      broadcastEdisegna();
    }
    function finisci() {
      stato.fase = "fine";
      stato.classifica = stato.giocatori.slice().sort(function (a, b) { return a.restano - b.restano; })
        .map(function (g) { return { nome: g.nome, punti: g.restano === 0 ? "finito!" : g.restano + " da piazzare" }; });
      broadcastEdisegna();
    }

    var cb = {
      myId: "host", sonoHost: true,
      onGap: function (g) { piazza("host", g); },
      onAvanti: function () { avanti("host"); },
      onComincia: comincia,
      onEsci: function () { rete.chiudi(); t.esci(); }
    };
    function disegna() { disegnaVM(t, vmDa(stato), cb); }
    disegna();
  }

  // ---- Un OSPITE entra con il codice ----
  function ospiteEntra(t, codice) {
    if (!(window.SGNet && SGNet.disponibile())) return schermataNoNet(t);
    var el = t.el;
    var S = { myId: null, vm: null, rete: null, nome: "" };
    var cb = {
      myId: null, sonoHost: false,
      onGap: function (g) { S.rete && S.rete.invia({ t: "place", gap: g }); },
      onAvanti: function () { S.rete && S.rete.invia({ t: "avanti" }); },
      onEsci: function () { if (S.rete) S.rete.chiudi(); t.esci(); }
    };
    function disegna() { if (S.vm) { cb.myId = S.myId; disegnaVM(t, S.vm, cb); } }

    schermaNome();
    function schermaNome() {
      var s = t.schermata({ icona: "🔗", titolo: "Entra nella partita", sotto: "Stanza " + codice.toUpperCase(), indietro: t.esci });
      var input = el("input", { type: "text", placeholder: "Il tuo nome", maxlength: "16", class: "link-campo" });
      input.style.borderColor = "var(--accento)";
      var msg = el("div", { class: "link-avviso" });
      s._contenuto.appendChild(input);
      s._contenuto.appendChild(msg);
      s._piede.appendChild(el("button", { class: "btn btn-primario", text: "Entra ▶", onclick: function () {
        S.nome = (input.value || "Amico").trim() || "Amico";
        msg.textContent = "Collegamento in corso…";
        collega();
      }}));
      t.mostra(s);
    }
    function collega() {
      S.rete = SGNet.entra(codice, {
        onAperto: function (mioId) { S.myId = mioId; S.rete.invia({ t: "join", nome: S.nome }); },
        onMsg: function (m) { if (m && m.t === "vm") { S.vm = m.vm; disegna(); } },
        onChiuso: function () { schermaErrore("Collegamento perso. L'host potrebbe aver chiuso la partita."); },
        onErrore: function (e) { schermaErrore(codiceErrore(e)); }
      });
    }
    function schermaErrore(txt) {
      var s = t.schermata({ icona: "⚠️", titolo: "Ops" });
      s._contenuto.appendChild(el("p", { text: txt, style: "font-size:1.05rem;line-height:1.5" }));
      s._piede.appendChild(el("button", { class: "btn btn-primario", text: "🏠 Torna all'inizio", onclick: t.esci }));
      t.mostra(s);
    }
  }

  // ---- Disegno condiviso (host e ospiti disegnano dalla stessa "foto") ----
  function disegnaVM(t, vm, cb) {
    var el = t.el;
    if (vm.fase === "lobby") return disegnaLobby(t, vm, cb);
    if (vm.fase === "fine") return disegnaFineOnline(t, vm, cb);

    var mioTurno = vm.turnoId && cb.myId && vm.turnoId === cb.myId;
    var io = trovaGiocatore(vm, cb.myId);
    var s = t.schermata({
      titolo: mioTurno ? "Tocca a te!" : ("Tocca a " + vm.turnoNome),
      sotto: "Stanza " + (vm.codice || ""), icona: "🔗",
      indietro: function () { if (window.confirm("Uscire dalla partita?")) cb.onEsci(); }
    });
    s._contenuto.appendChild(el("p", { class: "tl-restano",
      text: io ? ("Ti restano " + io.restano + (io.restano === 1 ? " carta" : " carte")) : "Stai guardando la partita" }));

    if (vm.fase === "turno") {
      s._contenuto.appendChild(el("div", { class: "tl-carta-mano" }, [
        el("div", { class: "occhiello", text: mioTurno ? "Dove va?" : ("Sta giocando " + vm.turnoNome) }),
        el("div", { class: "titolo", text: vm.carta ? vm.carta.titolo : "" })
      ]));
      var linea = el("div", { class: "tl-linea" });
      if (mioTurno) linea.appendChild(gapBtn(el, cb, 0));
      vm.linea.forEach(function (ev, i) {
        linea.appendChild(el("div", { class: "tl-evento" }, [
          el("span", { class: "anno", text: annoTesto(ev.anno) }),
          el("span", { class: "et", text: ev.titolo })
        ]));
        if (mioTurno) linea.appendChild(gapBtn(el, cb, i + 1));
        else linea.appendChild(el("div", { style: "height:8px" }));
      });
      s._contenuto.appendChild(linea);
      if (!mioTurno) s._contenuto.appendChild(el("p", { class: "link-avviso centro", text: "La linea si aggiorna da sola. Aspetta il tuo turno." }));
    } else if (vm.fase === "esito") {
      var es = vm.esito || {};
      s._contenuto.appendChild(el("div", { class: "tl-esito" }, [
        el("div", { class: "faccia", text: es.giusto ? "✅" : "❌" }),
        el("div", { class: "verdetto " + (es.giusto ? "giusto" : "sbagliato"),
          text: (es.nome ? es.nome + ": " : "") + (es.giusto ? "esatto!" : "sbagliato") }),
        el("div", { class: "annone", text: annoTesto(es.anno) }),
        el("div", { class: "titoletto", text: es.titolo }),
        es.fatto ? el("div", { class: "fatto", text: es.fatto }) : null
      ]));
      if (mioTurno) s._piede.appendChild(el("button", { class: "btn btn-primario", text: "Avanti ▶", onclick: cb.onAvanti }));
      else s._piede.appendChild(el("p", { class: "link-avviso centro", text: "In attesa di " + vm.turnoNome + "…" }));
    }
    t.mostra(s);
  }

  function gapBtn(el, cb, indice) {
    return el("button", { class: "tl-gap", html: "⤵ &nbsp;metti qui", onclick: function () { cb.onGap(indice); } });
  }

  function disegnaLobby(t, vm, cb) {
    var el = t.el;
    var s = t.schermata({ icona: "🔗", titolo: "Sala d'attesa",
      sotto: cb.sonoHost ? "Invita gli amici" : "Aspetta l'inizio", indietro: cb.onEsci });
    s._contenuto.appendChild(el("div", { class: "etichetta", text: "Codice della stanza" }));
    s._contenuto.appendChild(el("div", { class: "codice-stanza", text: (vm.codice || "…").toUpperCase() }));
    if (cb.sonoHost && vm.codice && vm.codice !== "…") {
      var link = SG.creaLink({ gioco: "timeline", stanza: vm.codice });
      var campo = el("input", { class: "link-campo", type: "text", readonly: "readonly", value: link });
      s._contenuto.appendChild(el("button", { class: "btn btn-fantasma", html: "🔗 Copia il link da mandare",
        onclick: function () { campo.focus(); campo.select(); try { navigator.clipboard.writeText(link); } catch (e) {} } }));
      s._contenuto.appendChild(campo);
    }
    s._contenuto.appendChild(el("div", { class: "etichetta", text: "Chi c'è (" + vm.giocatori.length + ")" }));
    var lista = el("div");
    vm.giocatori.forEach(function (g) {
      lista.appendChild(el("div", { class: "lobby-giocatore", text: "🙂 " + g.nome + (g.id === cb.myId ? " (tu)" : "") }));
    });
    s._contenuto.appendChild(lista);
    if (cb.sonoHost) {
      s._piede.appendChild(el("button", { class: "btn btn-primario",
        text: vm.giocatori.length < 2 ? "Comincia (meglio in 2 o più)" : "Comincia ▶", onclick: cb.onComincia }));
    } else {
      s._piede.appendChild(el("p", { class: "link-avviso centro", text: "In attesa che l'host cominci…" }));
    }
    t.mostra(s);
  }

  function disegnaFineOnline(t, vm, cb) {
    var el = t.el;
    var s = t.schermata({ icona: "🏆", titolo: "Fine partita", sotto: "Stanza " + (vm.codice || "") });
    var ol = el("ol", { class: "classifica" });
    var med = ["🥇", "🥈", "🥉"];
    (vm.classifica || []).forEach(function (r, i) {
      ol.appendChild(el("li", { class: i === 0 ? "vincitore" : "" }, [
        el("span", { class: "pos", text: med[i] || (i + 1) + "°" }),
        el("span", { class: "nome", text: r.nome }),
        r.punti != null ? el("span", { class: "punti", text: r.punti }) : null
      ]));
    });
    s._contenuto.appendChild(ol);
    s._piede.appendChild(el("button", { class: "btn btn-primario", text: "🏠 Torna all'inizio", onclick: cb.onEsci }));
    t.mostra(s);
  }

  function schermataNoNet(t) {
    var s = t.schermata({ icona: "🔗", titolo: "Serve il sito pubblicato", indietro: t.esci });
    s._contenuto.appendChild(t.el("p", { style: "font-size:1.05rem;line-height:1.5",
      text: "La modalità \"ognuno dal suo telefono\" funziona quando il gioco è aperto dal sito pubblicato online. Da un file locale o da un'anteprima non è disponibile: intanto puoi usare \"Un telefono solo\"." }));
    s._piede.appendChild(t.el("button", { class: "btn btn-primario", text: "Ok", onclick: t.esci }));
    t.mostra(s);
  }

  function codiceErrore(e) {
    var ty = e && e.type;
    if (ty === "peer-unavailable") return "Stanza non trovata. Controlla il codice: forse l'host non l'ha ancora aperta.";
    if (ty === "no-peerjs") return "Il collegamento tra telefoni non è disponibile qui.";
    if (ty === "network" || ty === "server-error" || ty === "socket-error") return "Problema di rete. Riprova tra poco.";
    return "Non riesco a collegarmi. Riprova.";
  }

  SG.registra(gioco);
})();

SG.avviaApp();
</script>
