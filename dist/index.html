<!doctype html>
<meta charset="utf-8">

<title>Speed Game</title>
<style>
/* =========================================================
   Speed Game — aspetto comune a TUTTI i giochi.
   Colori, caratteri e bottoni stanno qui, una volta sola.
   ========================================================= */

:root{
  --sfondo:      #141326;
  --sfondo-2:    #1e1c3a;
  --carta:       #272451;
  --carta-2:     #322e63;
  --testo:       #f3f1ff;
  --testo-tenue: #b3aede;
  --accento:     #ffca3a;
  --accento-scuro:#e0a90a;
  --verde:       #37d47e;
  --rosso:       #ff5d6c;
  --ombra:       0 6px 18px rgba(0,0,0,.35);
  --raggio:      18px;
  --tocco:       52px; /* altezza minima comoda per un dito */
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html,body{ margin:0; padding:0; }

body{
  font-family:var(--font);
  background:var(--sfondo);
  color:var(--testo);
  min-height:100vh;
  min-height:100dvh;
  -webkit-font-smoothing:antialiased;
}

#app{
  max-width:560px;
  margin:0 auto;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
}

/* ---- Schermata: intestazione + contenuto scorrevole + piede ---- */
.schermata{
  display:flex;
  flex-direction:column;
  flex:1;
  min-height:100vh;
  min-height:100dvh;
  padding:
    calc(16px + env(safe-area-inset-top))
    16px
    calc(16px + env(safe-area-inset-bottom));
  animation:entra .25s ease;
}
@keyframes entra{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }

.testa{ display:flex; align-items:center; gap:12px; margin-bottom:14px; }
.testa h1{ font-size:1.35rem; margin:0; line-height:1.1; }
.testa .sotto{ color:var(--testo-tenue); font-size:.95rem; margin:2px 0 0; }
.contenuto{ flex:1; }
.piede{ margin-top:14px; display:flex; flex-direction:column; gap:10px; }

/* ---- Bottoni (uguali ovunque) ---- */
.btn{
  appearance:none; border:0; cursor:pointer;
  font-family:inherit; font-size:1.05rem; font-weight:700;
  min-height:var(--tocco); padding:14px 18px;
  border-radius:var(--raggio);
  background:var(--carta-2); color:var(--testo);
  box-shadow:var(--ombra);
  transition:transform .06s ease, filter .15s ease;
  width:100%;
  display:flex; align-items:center; justify-content:center; gap:10px;
}
.btn:active{ transform:scale(.97); }
.btn-primario{ background:var(--accento); color:#241f00; }
.btn-verde{ background:var(--verde); color:#04321c; }
.btn-rosso{ background:var(--rosso); color:#3a0009; }
.btn-fantasma{ background:transparent; box-shadow:none; color:var(--testo-tenue); font-weight:600; }
.btn:disabled{ opacity:.45; }
.btn-piccolo{ font-size:.95rem; min-height:44px; padding:10px 14px; width:auto; }

/* ---- Home: elenco dei giochi ---- */
.griglia-giochi{ display:grid; grid-template-columns:1fr; gap:14px; }
.tessera{
  display:flex; align-items:center; gap:16px; text-align:left;
  background:var(--carta); border-radius:var(--raggio);
  padding:16px; box-shadow:var(--ombra); cursor:pointer; border:0; color:inherit;
  width:100%; transition:transform .06s ease;
}
.tessera:active{ transform:scale(.98); }
.tessera .icona{ font-size:2.4rem; line-height:1; }
.tessera .info h2{ margin:0 0 3px; font-size:1.15rem; }
.tessera .info p{ margin:0; color:var(--testo-tenue); font-size:.92rem; }
.tessera .info .meta{ margin-top:6px; font-size:.8rem; color:var(--accento); font-weight:700; }
.tessera.presto{ opacity:.5; cursor:default; }

/* ---- Setup giocatori ---- */
.giocatore-riga{ display:flex; gap:10px; align-items:center; margin-bottom:10px; }
.giocatore-riga input{
  flex:1; font-family:inherit; font-size:1.05rem;
  padding:12px 14px; border-radius:14px; border:2px solid transparent;
  background:var(--carta); color:var(--testo); min-height:var(--tocco);
}
.giocatore-riga input:focus{ outline:none; border-color:var(--accento); }
.togli{ background:var(--carta); color:var(--rosso); border:0; border-radius:14px;
  width:var(--tocco); height:var(--tocco); font-size:1.4rem; cursor:pointer; flex:0 0 auto; }

.stepper{ display:flex; align-items:center; gap:14px; background:var(--carta);
  border-radius:14px; padding:8px 14px; }
.stepper button{ width:44px; height:44px; border-radius:12px; border:0; cursor:pointer;
  background:var(--carta-2); color:var(--testo); font-size:1.4rem; font-weight:800; }
.stepper .valore{ font-size:1.3rem; font-weight:800; min-width:2ch; text-align:center; }

.etichetta{ font-size:.9rem; color:var(--testo-tenue); font-weight:700;
  text-transform:uppercase; letter-spacing:.04em; margin:18px 0 8px; }

/* ---- Passaggio del telefono ---- */
.passa{ text-align:center; display:flex; flex-direction:column; align-items:center;
  justify-content:center; flex:1; gap:8px; }
.passa .grande{ font-size:1.7rem; font-weight:800; }
.passa .emoji{ font-size:4rem; }

/* ---- Tabellone finale ---- */
.classifica{ list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:10px; }
.classifica li{ display:flex; align-items:center; gap:14px; background:var(--carta);
  border-radius:var(--raggio); padding:14px 16px; box-shadow:var(--ombra); }
.classifica .pos{ font-size:1.5rem; font-weight:800; width:1.6em; text-align:center; }
.classifica .nome{ flex:1; font-size:1.1rem; font-weight:700; }
.classifica .punti{ color:var(--testo-tenue); font-weight:700; }
.classifica li.vincitore{ background:linear-gradient(135deg,var(--accento),var(--accento-scuro)); color:#241f00; }
.classifica li.vincitore .punti{ color:#3a3000; }

/* ---- Novità (diario aggiornamenti) ---- */
.pallino{ width:10px; height:10px; border-radius:50%; background:var(--rosso);
  display:inline-block; margin-left:2px; box-shadow:0 0 0 3px rgba(255,93,108,.25); }
.novita-card{ background:var(--carta); border-radius:var(--raggio); padding:16px;
  box-shadow:var(--ombra); margin-bottom:14px; }
.novita-data{ font-size:.8rem; font-weight:700; color:var(--accento);
  text-transform:uppercase; letter-spacing:.04em; }
.novita-titolo{ margin:4px 0 10px; font-size:1.2rem; }
.novita-punti{ margin:0; padding-left:1.1em; }
.novita-punti li{ margin-bottom:7px; line-height:1.4; color:var(--testo); }

/* ---- Categorie (scelta dell'host) ---- */
.cat-griglia{ display:flex; flex-wrap:wrap; gap:10px; }
.cat-chip{ display:flex; align-items:center; gap:8px; font-family:inherit; font-size:1rem;
  font-weight:700; cursor:pointer; padding:12px 14px; min-height:var(--tocco);
  border-radius:14px; background:var(--carta); color:var(--testo-tenue);
  border:2px solid transparent; transition:all .12s ease; }
.cat-chip .ci{ font-size:1.2rem; }
.cat-chip .spunta{ opacity:0; font-weight:900; color:var(--verde); }
.cat-chip.attiva{ color:var(--testo); border-color:var(--accento); background:var(--carta-2); }
.cat-chip.attiva .spunta{ opacity:1; }

/* ---- Scelta della modalità (un telefono / ognuno il suo) ---- */
.modo-griglia{ display:flex; flex-direction:column; gap:10px; }
.modo-chip{ display:flex; align-items:center; gap:14px; text-align:left; width:100%;
  font-family:inherit; cursor:pointer; padding:14px 16px; min-height:var(--tocco);
  border-radius:14px; background:var(--carta); color:var(--testo-tenue);
  border:2px solid transparent; transition:all .12s ease; }
.modo-chip .mi{ font-size:1.8rem; }
.modo-chip .mt{ font-size:1.05rem; font-weight:800; }
.modo-chip .ms{ font-size:.85rem; }
.modo-chip.attiva{ color:var(--testo); border-color:var(--accento); background:var(--carta-2); }

/* ---- Stanza online ---- */
.codice-stanza{ font-size:2.6rem; font-weight:900; letter-spacing:.15em; text-align:center;
  background:linear-gradient(135deg,var(--accento),var(--accento-scuro)); color:#241f00;
  border-radius:var(--raggio); padding:14px; box-shadow:var(--ombra); }
.lobby-giocatore{ background:var(--carta); border-radius:12px; padding:12px 14px;
  margin-bottom:8px; font-size:1.05rem; font-weight:700; }

/* ---- Campo del link da condividere ---- */
.link-campo{ width:100%; font-family:inherit; font-size:.95rem; margin-top:10px;
  padding:12px 14px; border-radius:14px; border:2px solid var(--accento);
  background:var(--carta); color:var(--testo); min-height:var(--tocco); }
.link-avviso{ margin-top:8px; font-size:.9rem; color:var(--testo-tenue); line-height:1.4; }

/* ---- Utility ---- */
.centro{ text-align:center; }
.tenue{ color:var(--testo-tenue); }
.spazio{ height:10px; }

/* =========================================================
   Ritocchi grafici + ottimizzazione mobile
   (Le regole qui sotto rifiniscono quelle sopra.)
   ========================================================= */
:root{ --raggio:20px; --ombra:0 8px 24px rgba(0,0,0,.28); }

html{ -webkit-text-size-adjust:100%; }
body{ overflow-x:hidden;
  background:radial-gradient(1200px 680px at 50% -10%, #2a2650, var(--sfondo)) no-repeat, var(--sfondo); }
#app{ max-width:600px; }
.schermata{ padding-left:max(16px, env(safe-area-inset-left)); padding-right:max(16px, env(safe-area-inset-right)); }
img{ max-width:100%; }

/* Intestazione: titolo deciso, con un filo di gradiente sul primo (home) */
.testa h1{ font-size:1.55rem; font-weight:900; letter-spacing:-.02em; }
.testa .sotto{ font-size:1rem; }

/* Bottoni: più morbidi, con profondità */
.btn{ border-radius:16px; transition:transform .06s ease, filter .15s ease, box-shadow .15s ease; }
.btn-primario{ background:linear-gradient(135deg, #ffd75a, var(--accento-scuro)); color:#241f00;
  box-shadow:0 8px 22px rgba(224,169,10,.38); }
.btn-verde{ background:linear-gradient(135deg, #4fe895, #1faf60); color:#04321c; box-shadow:0 8px 22px rgba(31,175,96,.32); }
.btn-rosso{ background:linear-gradient(135deg, #ff7a86, #e83c4c); color:#fff; box-shadow:0 8px 22px rgba(232,60,76,.32); }
.btn:active{ transform:scale(.97); }
@media (hover:hover){ .btn:hover{ filter:brightness(1.06); } .tessera:hover{ transform:translateY(-2px); } }

/* Home: icona in un riquadro, freccia a destra */
.tessera{ position:relative; align-items:center; padding:14px; border:1px solid rgba(255,255,255,.05); }
.tessera .info{ flex:1; min-width:0; }
.tessera .info h2{ font-size:1.2rem; font-weight:800; }
.tessera .icona{ width:58px; height:58px; display:flex; align-items:center; justify-content:center;
  border-radius:16px; background:linear-gradient(150deg, var(--carta-2), #201d44); font-size:2.1rem; flex:0 0 auto;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06); }
.tessera:not(.presto)::after{ content:"›"; margin-left:auto; padding-left:8px;
  font-size:2rem; line-height:1; color:var(--accento); opacity:.7; }

/* Campi e stepper più morbidi */
.giocatore-riga input, .link-campo{ border-radius:16px; }
.giocatore-riga input{ font-size:1.05rem; }
.stepper{ border-radius:16px; }

/* Vincitore in classifica: bagliore dorato */
.classifica li.vincitore{ box-shadow:0 0 0 2px rgba(255,202,58,.6), var(--ombra); }
.classifica .nome{ font-weight:800; }

.etichetta{ margin-top:22px; }

/* ---- Riga di tasti piccoli in home (Novità · Proposte · Bug) ---- */
.home-azioni{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
.azione{ display:flex; align-items:center; gap:6px; font-family:inherit; font-size:.95rem; font-weight:700;
  cursor:pointer; border:0; border-radius:14px; padding:12px 14px; min-height:46px;
  background:var(--carta); color:var(--testo-tenue); transition:all .12s ease; }
.azione:active{ transform:scale(.97); }
@media (hover:hover){ .azione:hover{ color:var(--testo); background:var(--carta-2); } }

/* ---- Profilo ---- */
.profilo-chip{ display:inline-flex; align-items:center; gap:8px; margin-top:14px; font-family:inherit;
  font-size:.98rem; font-weight:700; cursor:pointer; border:0; border-radius:99px; padding:8px 14px;
  background:var(--carta); color:var(--testo); }
.profilo-chip .modifica{ font-size:.82rem; color:var(--accento); font-weight:800; }
.profilo-riga{ display:flex; align-items:center; gap:14px; width:100%; text-align:left; cursor:pointer;
  border:0; font-family:inherit; background:var(--carta); color:inherit; border-radius:16px;
  padding:14px; margin-bottom:10px; box-shadow:var(--ombra); }
.profilo-riga .av{ font-size:2rem; width:48px; height:48px; flex:0 0 auto; display:flex; align-items:center;
  justify-content:center; border-radius:14px; background:linear-gradient(150deg,var(--carta-2),#201d44); }
.profilo-riga .nm{ flex:1; font-size:1.15rem; font-weight:800; }
.profilo-riga .frecc{ font-size:1.8rem; color:var(--accento); opacity:.7; }
.faccine{ display:flex; flex-wrap:wrap; gap:8px; }
.faccina{ font-size:1.7rem; line-height:1; cursor:pointer; border:2px solid transparent; border-radius:14px;
  background:var(--carta); padding:8px 10px; min-width:52px; min-height:52px; }
.faccina.attiva{ border-color:var(--accento); background:var(--carta-2); }

/* ---- La sala ---- */
.sala-riga{ display:flex; gap:10px; align-items:center; margin-bottom:10px; }
.sala-riga .av{ font-size:1.6rem; width:var(--tocco); height:var(--tocco); flex:0 0 auto; cursor:pointer;
  border:0; border-radius:14px; background:var(--carta-2); }
.sala-riga input{ flex:1; font-family:inherit; font-size:1.05rem; padding:12px 14px; border-radius:16px;
  border:2px solid transparent; background:var(--carta); color:var(--testo); min-height:var(--tocco); }
.sala-riga input:focus{ outline:none; border-color:var(--accento); }
.sala-sommario{ display:flex; align-items:center; gap:10px; width:100%; text-align:left; cursor:pointer;
  border:0; font-family:inherit; background:var(--carta); color:var(--testo-tenue); border-radius:14px;
  padding:12px 14px; margin-bottom:6px; font-size:.95rem; }
.sala-sommario .chi{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sala-sommario .modifica{ color:var(--accento); font-weight:800; flex:0 0 auto; }

/* ---- Moduli (proposte / segnalazioni) ---- */
.modulo-nota{ font-size:1rem; line-height:1.45; color:var(--testo-tenue); margin:0 0 14px; }
.modulo-testo{ width:100%; font-family:inherit; font-size:1.02rem; line-height:1.4; margin-top:10px;
  padding:14px; border-radius:16px; border:2px solid var(--carta-2); background:var(--carta);
  color:var(--testo); resize:vertical; min-height:140px; }
.modulo-testo:focus{ outline:none; border-color:var(--accento); }

/* ---- Home: logo + titolo + giochi come un gruppo unico centrato ----
   Riquadri COMPATTI (niente boxoni vuoti), testo grande, centrato. */
.home .testa{ display:none; }
.home .contenuto{ flex:1 1 auto; display:flex; flex-direction:column; justify-content:center; gap:22px; }
.home-hero{ text-align:center; }
.home-logo{ font-size:3rem; line-height:1; filter:drop-shadow(0 6px 16px rgba(0,0,0,.4)); }
.home-titolo{ margin:8px 0 0; font-size:2.6rem; line-height:1.02; letter-spacing:-.02em;
  background:linear-gradient(135deg,#ffe58a,var(--accento) 55%,#ff9d3a);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent; }
.home-sotto{ margin:8px 0 0; font-size:1.1rem; color:var(--testo-tenue); }
.home .griglia-giochi{ display:flex; flex-direction:column; gap:14px; }
.home .tessera{ padding:16px; }
.home .tessera .icona{ width:60px; height:60px; font-size:2.1rem; }
.home .tessera .info h2{ font-size:1.3rem; }
.home .tessera .info p{ font-size:1.02rem; line-height:1.3; }
.home .tessera .info .meta{ font-size:.95rem; margin-top:6px; }
.home .tessera:not(.presto)::after{ font-size:2rem; }
.home .piede{ margin-top:18px; }
</style>

<script>
/* =========================================================
   MOTORE COMUNE — "SG"
   Tutto ciò che ogni gioco condivide sta qui, scritto una
   volta sola: le schermate comuni (home, giocatori, regole,
   tabellone finale), la lista dei giocatori, il passaggio
   del telefono e il giro di partita (comincia / fine / rigioca).

   Un gioco si "innesta" chiamando SG.registra({...}).
   Vedi docs/COME-SI-AGGIUNGE-UN-GIOCO.md
   ========================================================= */
(function () {
  "use strict";

  var giochi = [];            // giochi registrati
  var app;                    // contenitore radice (#app)
  var linkParams = {};        // impostazioni arrivate da un link condiviso

  // Legge le impostazioni scritte nel link (dopo il #), es.:
  //   #gioco=timeline&cat=storia,calcio&carte=5
  function leggiParametriLink() {
    var out = {};
    var h = (location.hash || "").replace(/^#/, "");
    if (!h) return out;
    h.split("&").forEach(function (p) {
      var i = p.indexOf("=");
      if (i < 0) return;
      var k = decodeURIComponent(p.slice(0, i));
      var v = decodeURIComponent(p.slice(i + 1));
      out[k] = v;
    });
    if (out.cat) out.cat = out.cat.split(",").filter(Boolean);
    if (out.carte) out.carte = parseInt(out.carte, 10);
    return out;
  }

  // ------- piccoli aiuti per costruire l'interfaccia -------
  function el(tag, attrs, figli) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (attrs[k] == null) continue;           // attributo non impostato: si salta
      if (k === "class") e.className = attrs[k];
      else if (k === "html") e.innerHTML = attrs[k];
      else if (k === "text") e.textContent = attrs[k];
      else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    if (figli) figli.forEach(function (f) {
      if (f == null) return;
      e.appendChild(typeof f === "string" ? document.createTextNode(f) : f);
    });
    return e;
  }
  function svuota(n){ while (n.firstChild) n.removeChild(n.firstChild); }
  function mischia(a){ // Fisher-Yates
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  // Costruisce lo scheletro di una schermata: testa + contenuto + piede
  function schermata(opts) {
    opts = opts || {};
    var testa = el("div", { class: "testa" });
    if (opts.indietro) {
      testa.appendChild(el("button", {
        class: "btn btn-fantasma btn-piccolo", text: "‹", "aria-label": "Indietro",
        onclick: opts.indietro
      }));
    }
    var titoli = el("div");
    if (opts.icona) testa.insertBefore(el("span", { text: opts.icona, style: "font-size:1.8rem" }), null);
    if (opts.titolo) titoli.appendChild(el("h1", { text: opts.titolo }));
    if (opts.sotto) titoli.appendChild(el("p", { class: "sotto", text: opts.sotto }));
    testa.appendChild(titoli);

    var contenuto = el("div", { class: "contenuto" });
    var piede = el("div", { class: "piede" });
    var s = el("div", { class: "schermata" }, [testa, contenuto, piede]);
    s._contenuto = contenuto; s._piede = piede;
    return s;
  }

  function mostra(schermo) {
    svuota(app);
    app.appendChild(schermo);
    window.scrollTo(0, 0);
  }

  // =========================================================
  //  SCHERMATE COMUNI
  // =========================================================

  // una tessera-gioco, usata sia in home sia in "cambia gioco"
  function tesseraGioco(g, onclick) {
    return el("button", { class: "tessera", onclick: onclick }, [
      el("span", { class: "icona", text: g.icona || "🎲" }),
      el("div", { class: "info" }, [
        el("h2", { text: g.nome }),
        el("p", { text: g.descrizione || "" }),
        el("div", { class: "meta", text: rangeGiocatori(g) })
      ])
    ]);
  }

  // Entra in una stanza avendo solo il codice: scopre da solo QUALE gioco
  // si sta giocando, così apre quello giusto (non sempre la Linea del tempo).
  function entraConCodice() {
    var c = window.prompt("Scrivi il codice della stanza:");
    if (!c) return;
    c = c.trim().toUpperCase();
    if (!c) return;
    if (!(window.SGNet && SGNet.disponibile())) {
      window.alert("Il collegamento non è disponibile qui. Apre solo dal sito pubblicato online.");
      return;
    }
    var s = schermata({ icona: "🔗", titolo: "Entro nella stanza…", sotto: "Codice " + c });
    s._contenuto.appendChild(el("p", { class: "modulo-nota", text: "Cerco la partita in corso… un attimo." }));
    mostra(s);
    SGNet.scopriGioco(c, function (gid) {
      var g = gid && giochi.filter(function (x) { return x.id === gid; })[0];
      if (!g) {
        svuota(s._contenuto); svuota(s._piede);
        s._contenuto.appendChild(el("p", { class: "link-avviso",
          text: "Non trovo una partita con questo codice. Controlla di averlo scritto giusto, oppure apri il link che ti ha mandato chi organizza." }));
        s._piede.appendChild(el("button", { class: "btn btn-primario", text: "↩︎ Torna alla home", onclick: schermataHome }));
        mostra(s);
        return;
      }
      location.hash = "gioco=" + g.id + "&stanza=" + encodeURIComponent(c);
      location.reload();
    });
  }

  function schermataHome() {
    var s = schermata({});
    s.className += " home";
    var io = profiloAttivo();
    s._contenuto.appendChild(el("div", { class: "home-hero" }, [
      el("div", { class: "home-logo", text: "🎉" }),
      el("h1", { class: "home-titolo", text: "Speed Game" }),
      el("p", { class: "home-sotto", text: "Scegli un gioco e passa il telefono" }),
      el("button", { class: "profilo-chip", onclick: function () { schermataAccesso(schermataHome); } },
        io ? [el("span", { text: io.emoji }), el("span", { text: io.nome }), el("span", { class: "modifica", text: "cambia" })]
           : [el("span", { text: "👤" }), el("span", { text: "Crea il tuo profilo" })])
    ]));
    var griglia = el("div", { class: "griglia-giochi" });

    giochi.forEach(function (g) {
      griglia.appendChild(tesseraGioco(g, function () { apriGioco(g); }));

    // Segnaposto: fa capire che ne arriveranno altri (senza prometterli)
    griglia.appendChild(el("div", { class: "tessera presto" }, [

      el("div", { class: "info" }, [
        el("h2", { text: "Altri giochi in arrivo" }),
        el("p", { text: "Uno alla volta, fatto bene." })
      ])
    ]));

    // Riga di tasti piccoli: Novità · Proposte · Bug
    var azioni = el("div", { class: "home-azioni" });

    if (novita.length) {
      var bN = el("button", { class: "azione", onclick: schermataNovita });
      bN.appendChild(el("span", { text: "🆕 Novità" }));
      if (!novitaTutteViste()) bN.appendChild(el("span", { class: "pallino" }));
      azioni.appendChild(bN);
    }
    azioni.appendChild(el("button", { class: "azione", text: "💡 Proposte", onclick: schermataProposte }));
    azioni.appendChild(el("button", { class: "azione", text: "🐞 Bug", onclick: schermataBug }));
    s._piede.appendChild(azioni);

    // Torneo: più giochi di fila con gli stessi giocatori, punti che si sommano
    s._piede.appendChild(el("button", {
      class: "btn btn-primario", html: torneo ? "🏆 Riprendi il torneo" : "🏆 Torneo (più giochi di fila)",
      onclick: apriTorneo
    }));

    // Tasto "Entra in una stanza" (per chi ha ricevuto un codice a voce)
    s._piede.appendChild(el("button", {
      class: "btn btn-fantasma", html: "🔗 Entra in una stanza (con un codice)",
      onclick: entraConCodice
    }));

    mostra(s);
  }

  // ---- Novità (il diario di cosa viene aggiunto) ----
  var CHIAVE_NOVITA = "sg_novita_vista";
  function ultimaVersioneNovita() {
    var n = window.SG_NOVITA || [];
    return n.length ? n[0].v : 0;
  }
  function novitaTutteViste() {
    try { return Number(localStorage.getItem(CHIAVE_NOVITA)) >= ultimaVersioneNovita(); }
    catch (e) { return false; }
  }
  function segnaNovitaViste() {
    try { localStorage.setItem(CHIAVE_NOVITA, String(ultimaVersioneNovita())); } catch (e) {}
  }
  function schermataNovita() {
    var s = schermata({ icona: "🆕", titolo: "Novità", sotto: "Cosa è stato aggiunto", indietro: schermataHome });
    (window.SG_NOVITA || []).forEach(function (n) {
      var punti = el("ul", { class: "novita-punti" });
      (n.descrizione || []).forEach(function (r) { punti.appendChild(el("li", { text: r })); });
      s._contenuto.appendChild(el("div", { class: "novita-card" }, [
        el("div", { class: "novita-data", text: n.data }),
        el("h2", { class: "novita-titolo", text: n.titolo }),
        punti
      ]));
    });
    s._piede.appendChild(el("button", { class: "btn btn-primario", text: "Ho capito", onclick: schermataHome }));
    segnaNovitaViste(); // aperto = visto
    mostra(s);
  }

  // ---- Proposte e segnalazioni ----
  // I messaggi vengono spediti al sito (moduli di Netlify) e finiscono
  // nell'area riservata del proprietario: li può leggere solo lui.
  function inviaModulo(nomeModulo, dati) {
    var pezzi = ["form-name=" + encodeURIComponent(nomeModulo)];
    for (var k in dati) pezzi.push(encodeURIComponent(k) + "=" + encodeURIComponent(dati[k] == null ? "" : dati[k]));
    return fetch("/", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: pezzi.join("&")
    }).then(function (r) { if (!r.ok) throw new Error("invio non riuscito"); return true; });
  }

  function schermataModulo(opts) {
    var s = schermata({ icona: opts.icona, titolo: opts.titolo, sotto: opts.sotto, indietro: schermataHome });
    s._contenuto.appendChild(el("p", { class: "modulo-nota", text: opts.nota }));
    var nome = el("input", { class: "link-campo", type: "text", placeholder: "Il tuo nome (facoltativo)", maxlength: "24" });
    var testo = el("textarea", { class: "modulo-testo", placeholder: opts.placeholder, rows: "6" });
    var avviso = el("div", { class: "link-avviso" });
    s._contenuto.appendChild(nome);
    s._contenuto.appendChild(testo);
    s._contenuto.appendChild(avviso);
    var invia = el("button", { class: "btn btn-primario", text: opts.bottone, onclick: function () {
      var msg = (testo.value || "").trim();
      if (msg.length < 3) { avviso.textContent = "Scrivi prima il messaggio."; return; }
      invia.disabled = true; avviso.textContent = "Invio in corso…";
      var dati = { nome: (nome.value || "").trim() || "Anonimo", messaggio: msg };
      if (opts.contesto) dati.contesto = opts.contesto();
      inviaModulo(opts.modulo, dati).then(function () { grazie(opts.grazie); })
        .catch(function () {
          invia.disabled = false;
          avviso.textContent = "Non sono riuscito a inviare (succede se il gioco non è aperto dal sito pubblicato). Copia il testo e mandalo a chi gestisce il gioco.";
          testo.focus(); testo.select();
        });
    }});
    s._piede.appendChild(invia);
    mostra(s);
  }

  function grazie(testo) {
    var s = schermata({});
    s._contenuto.appendChild(el("div", { class: "passa" }, [
      el("div", { class: "emoji", text: "🙏" }),
      el("div", { class: "grande", text: "Grazie!" }),
      el("p", { class: "tenue centro", text: testo })
    ]));
    s._piede.appendChild(el("button", { class: "btn btn-primario", text: "🏠 Torna ai giochi", onclick: schermataHome }));
    mostra(s);
  }

  function schermataProposte() {
    schermataModulo({
      modulo: "proposte", icona: "💡", titolo: "Proposte", sotto: "Hai un'idea? Scrivila qui",
      nota: "Un gioco nuovo, una carta da aggiungere, una regola da cambiare… scrivi pure. La legge soltanto chi gestisce il gioco.",
      placeholder: "La mia idea è…", bottone: "Invia la proposta",
      grazie: "La tua proposta è arrivata. Se è buona, la vedrai comparire nel gioco!"
    });
  }

  function schermataBug() {
    schermataModulo({
      modulo: "bug", icona: "🐞", titolo: "Segnala un problema", sotto: "Qualcosa non funziona?",
      nota: "Racconta cosa stavi facendo e cosa è andato storto. Più sei preciso, più in fretta lo sistemiamo.",
      placeholder: "Stavo giocando a… e invece di… è successo…",
      bottone: "Invia la segnalazione",
      grazie: "Segnalazione ricevuta: ci aiuta a sistemare il gioco.",
      contesto: function () {
        var v = (window.SG_NOVITA && window.SG_NOVITA[0] && window.SG_NOVITA[0].v) || "?";
        return "versione " + v + " · schermo " + window.innerWidth + "x" + window.innerHeight + " · " + navigator.userAgent;
      }
    });
  }

  function rangeGiocatori(g) {
    var min = g.giocatoriMin || 2, max = g.giocatoriMax || 8;
    return "👥 " + (min === max ? min : min + "–" + max) + " giocatori";
  }

  // ---- Scelta dei giocatori ----
  // =========================================================
  //  PROFILO  (crea / accedi) — resta su questo telefono
  // =========================================================
  var K_PROFILI = "sg_profili", K_ATTIVO = "sg_profilo_attivo";
  var FACCINE = ["😀","😎","🤠","🥳","🤩","😈","🤖","👻","👽","🐱","🐶","🦊","🐼","🦁","🐸","🐧","🍕","🍔","⚽","🎸","🚀","🌟","🦄","🐢"];

  function leggiL(k, def) { try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? def : v; } catch (e) { return def; } }
  function scriviL(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function profili() { var p = leggiL(K_PROFILI, []); return (p instanceof Array) ? p : []; }
  function profiloAttivo() {
    var id = leggiL(K_ATTIVO, null);
    return profili().filter(function (p) { return p.id === id; })[0] || null;
  }
  function salvaProfilo(p) {
    var lista = profili().filter(function (x) { return x.id !== p.id; });
    lista.unshift(p);
    if (lista.length > 12) lista = lista.slice(0, 12);
    scriviL(K_PROFILI, lista); scriviL(K_ATTIVO, p.id);
  }

  function schermataAccesso(dopo) {
    var lista = profili();
    var s = schermata({ icona: "👤", titolo: "Il tuo profilo", sotto: "Crea il tuo oppure accedi", indietro: schermataHome });
    s._contenuto.appendChild(el("p", { class: "modulo-nota",
      text: "Il profilo serve solo a non riscrivere ogni volta nome e faccina. Resta su questo telefono: non c'è nessuna password." }));
    if (lista.length) {
      s._contenuto.appendChild(el("div", { class: "etichetta", text: "Profili su questo telefono" }));
      lista.slice(0, 4).forEach(function (p) {
        s._contenuto.appendChild(el("button", { class: "profilo-riga", onclick: function () { scriviL(K_ATTIVO, p.id); dopo(); } }, [
          el("span", { class: "av", text: p.emoji }),
          el("span", { class: "nm", text: p.nome }),
          el("span", { class: "frecc", text: "›" })
        ]));
      });
    }
    s._piede.appendChild(el("button", { class: "btn btn-primario", text: "➕ Crea profilo", onclick: function () { schermataCreaProfilo(dopo, null); } }));
    var bAcc = el("button", { class: "btn btn-fantasma", text: "👤 Accedi con un profilo salvato", onclick: function () { schermataScegliProfilo(dopo); } });
    if (!lista.length) bAcc.disabled = true;
    s._piede.appendChild(bAcc);
    mostra(s);
  }

  function schermataScegliProfilo(dopo) {
    var s = schermata({ icona: "👤", titolo: "Accedi", sotto: "Scegli il tuo profilo", indietro: function () { schermataAccesso(dopo); } });
    profili().forEach(function (p) {
      s._contenuto.appendChild(el("button", { class: "profilo-riga", onclick: function () { scriviL(K_ATTIVO, p.id); dopo(); } }, [
        el("span", { class: "av", text: p.emoji }),
        el("span", { class: "nm", text: p.nome }),
        el("span", { class: "frecc", text: "›" })
      ]));
    });
    mostra(s);
  }

  function schermataCreaProfilo(dopo, esistente) {
    var scelta = { emoji: (esistente && esistente.emoji) || FACCINE[0] };
    var s = schermata({ icona: "👤", titolo: esistente ? "Modifica profilo" : "Crea profilo",
      indietro: function () { schermataAccesso(dopo); } });
    var nome = el("input", { class: "link-campo", type: "text", maxlength: "16",
      placeholder: "Come ti chiami?", value: (esistente && esistente.nome) || "" });
    s._contenuto.appendChild(nome);
    s._contenuto.appendChild(el("div", { class: "etichetta", text: "Scegli la faccina" }));
    var griglia = el("div", { class: "faccine" });
    FACCINE.forEach(function (e) {
      griglia.appendChild(el("button", { class: "faccina" + (e === scelta.emoji ? " attiva" : ""), text: e,
        onclick: function () {
          scelta.emoji = e;
          [].forEach.call(griglia.children, function (c) { c.className = "faccina" + (c.textContent === e ? " attiva" : ""); });
        } }));
    });
    s._contenuto.appendChild(griglia);
    var avviso = el("div", { class: "link-avviso" });
    s._contenuto.appendChild(avviso);
    s._piede.appendChild(el("button", { class: "btn btn-primario", text: "Salva ▶", onclick: function () {
      var n = (nome.value || "").trim();
      if (n.length < 2) { avviso.textContent = "Scrivi il tuo nome."; return; }
      salvaProfilo({ id: (esistente && esistente.id) || ("p" + Date.now() + Math.floor(Math.random() * 999)), nome: n, emoji: scelta.emoji });
      dopo();
    }}));
    mostra(s);
  }

  // =========================================================
  //  LA SALA — il gruppo resta tra una partita e l'altra
  // =========================================================
  var gruppo = [];                 // [{nome, emoji}]
  var ultimaPartita = null;        // {gioco, impostazioni}

  function nomiGruppo() { return gruppo.map(function (p, i) { return (p.nome || "").trim() || ("Giocatore " + (i + 1)); }); }

  function schermataSala(g, opts) {
    var torn = !!(opts && opts.torneo);
    var min = g ? (g.giocatoriMin || 2) : 2;
    var max = g ? (g.giocatoriMax || 10) : 10;
    if (!gruppo.length) {
      var io = profiloAttivo();
      if (io) gruppo.push({ nome: io.nome, emoji: io.emoji });
    }
    var s = schermata({ icona: torn ? "🏆" : "🎉", titolo: torn ? "Torneo" : "La sala",
      sotto: torn ? "Chi partecipa al torneo" : (g ? ("Si gioca a " + g.nome) : "Chi partecipa"),
      indietro: schermataHome });

    var conta = el("p", { class: "modulo-nota" });
    var lista = el("div");
    var avanti = el("button", { class: "btn btn-primario", text: torn ? "Comincia il torneo ▶" : "Avanti ▶", onclick: function () {
      if (gruppo.length < (torn ? min : 1)) return;
      if (torn) return iniziaTorneo();
      if (g) schermataPreGioco(g); else schermataScegliGioco();
    }});

    function ridisegna() {
      svuota(lista);
      gruppo.forEach(function (p, i) {
        lista.appendChild(el("div", { class: "sala-riga" }, [
          el("button", { class: "av", text: p.emoji || "🙂", "aria-label": "Cambia faccina",
            onclick: function () { p.emoji = FACCINE[(FACCINE.indexOf(p.emoji) + 1) % FACCINE.length]; ridisegna(); } }),
          el("input", { type: "text", value: p.nome, maxlength: "16", placeholder: "Giocatore " + (i + 1),
            oninput: function (ev) { p.nome = ev.target.value; } }),
          el("button", { class: "togli", text: "×", "aria-label": "Togli", onclick: function () { gruppo.splice(i, 1); ridisegna(); } })
        ]));
      });
      conta.textContent = gruppo.length + (gruppo.length === 1 ? " partecipante" : " partecipanti")
        + (gruppo.length < min ? " · ne servono almeno " + min : "");
      if (gruppo.length < (torn ? min : 1)) avanti.disabled = true; else avanti.removeAttribute("disabled");
    }

    s._contenuto.appendChild(conta);
    s._contenuto.appendChild(lista);
    s._contenuto.appendChild(el("button", { class: "btn btn-fantasma", html: "＋ Aggiungi giocatore",
      onclick: function () { if (gruppo.length < max) { gruppo.push({ nome: "", emoji: FACCINE[gruppo.length % FACCINE.length] }); ridisegna(); } } }));

    // aggiunta rapida dai profili salvati sul telefono
    var salvati = profili().filter(function (p) {
      return !gruppo.some(function (x) { return (x.nome || "").toLowerCase() === p.nome.toLowerCase(); });
    });
    if (salvati.length) {
      s._contenuto.appendChild(el("div", { class: "etichetta", text: "Aggiungi al volo" }));
      var rapidi = el("div", { class: "home-azioni", style: "justify-content:flex-start" });
      salvati.forEach(function (p) {
        rapidi.appendChild(el("button", { class: "azione", text: p.emoji + " " + p.nome, onclick: function () {
          if (gruppo.length < max) { gruppo.push({ nome: p.nome, emoji: p.emoji }); schermataSala(g, opts); }
        }}));
      });
      s._contenuto.appendChild(rapidi);
    }

    ridisegna();
    s._piede.appendChild(avanti);
    mostra(s);
  }

  function schermataPreGioco(g, opts) {
    var torn = !!(opts && opts.torneo);
    var s = schermata({ icona: g.icona, titolo: g.nome, sotto: torn ? ("Torneo · " + nomeDifficolta(pesoGioco(g))) : "Impostazioni della partita",
      indietro: function () { if (torn) schermataTorneoHub(); else schermataSala(g); } });
    s._contenuto.appendChild(el(torn ? "div" : "button", { class: "sala-sommario",
      onclick: torn ? null : function () { schermataSala(g); } }, [
      el("span", { class: "chi", text: "👥 " + nomiGruppo().join(", ") }),
      torn ? null : el("span", { class: "modifica", text: "modifica" })
    ]));
    var impostazioni = {};
    if (typeof g.impostazioni === "function") {
      var box = el("div");
      g.impostazioni(box, impostazioni, { el: el, torneo: torn });
      s._contenuto.appendChild(box);
    }
    s._piede.appendChild(el("button", { class: "btn btn-fantasma", text: "Come si gioca",
      onclick: function () { schermataRegole(g, function () { schermataPreGioco(g, opts); }); } }));
    s._piede.appendChild(el("button", { class: "btn btn-primario", text: "Comincia ▶", onclick: function () {
      // online: l'host apre la stanza da solo, gli altri entrano via rete → niente vincolo di minimo qui
      if (!(impostazioni && impostazioni.modo === "online") && gruppo.length < (g.giocatoriMin || 2)) return schermataSala(g, opts);
      ultimaPartita = { gioco: g, impostazioni: impostazioni };
      avviaPartita(g, nomiGruppo(), impostazioni, opts);
    }}));
    mostra(s);
  }

  function schermataScegliGioco() {
    var s = schermata({ icona: "🎮", titolo: "Cambia gioco", sotto: "Stessi partecipanti",
      indietro: function () { schermataSala(null); } });
    var griglia = el("div", { class: "griglia-giochi" });
    giochi.forEach(function (g) { griglia.appendChild(tesseraGioco(g, function () { schermataPreGioco(g); })); });
    s._contenuto.appendChild(griglia);
    mostra(s);
  }

  // porta d'ingresso a un gioco dalla home: profilo → sala → impostazioni
  function apriGioco(g) {
    if (!profiloAttivo()) return schermataAccesso(function () { schermataSala(g); });
    if (gruppo.length >= (g.giocatoriMin || 2)) return schermataPreGioco(g);
    schermataSala(g);
  }

  // ---- Regole ----
  function schermataRegole(g, indietro) {
    var s = schermata({ icona: g.icona, titolo: "Come si gioca", sotto: g.nome, indietro: indietro });
    var righe = g.regole || ["(regole non ancora scritte)"];
    var box = el("div");
    righe.forEach(function (r) {
      box.appendChild(el("p", { class: "", html: r, style: "font-size:1.05rem; line-height:1.5; margin:0 0 14px" }));
    });
    s._contenuto.appendChild(box);
    s._piede.appendChild(el("button", { class: "btn btn-primario", text: "Ho capito", onclick: indietro }));
    mostra(s);
  }

  // ---- Passaggio del telefono (interstiziale tra un turno e l'altro) ----
  function passaIlTelefono(nomeProssimo, quando) {
    var s = schermata({});
    var box = el("div", { class: "passa" }, [
      el("div", { class: "emoji", text: "🤝" }),
      el("p", { class: "tenue", text: "Passa il telefono a" }),
      el("div", { class: "grande", text: nomeProssimo })
    ]);
    s._contenuto.appendChild(box);
    s._piede.appendChild(el("button", { class: "btn btn-primario", text: "Sono " + nomeProssimo + " ▶", onclick: quando }));
    mostra(s);
  }

  // ---- Tabellone finale (uguale per tutti i giochi) ----
  // classifica: array ordinato dal 1° all'ultimo, ognuno { nome, punti (facolt.) }
  function schermataFine(g, classifica, giocatori, impostazioni) {
    var s = schermata({ icona: "🏆", titolo: "Fine partita", sotto: g.nome });
    var ol = el("ol", { class: "classifica" });
    var medaglie = ["🥇", "🥈", "🥉"];
    classifica.forEach(function (r, i) {
      ol.appendChild(el("li", { class: i === 0 ? "vincitore" : "" }, [
        el("span", { class: "pos", text: medaglie[i] || (i + 1) + "°" }),
        el("span", { class: "nome", text: r.nome }),
        r.punti != null ? el("span", { class: "punti", text: r.punti }) : null
      ]));
    });
    s._contenuto.appendChild(ol);

    // Dalla fine partita si resta nella stessa sala: rigioca, cambia gioco o modifica il gruppo

  // =========================================================
  //  TORNEO — più partite di fila con gli stessi giocatori.
  //  Ogni gioco dichiara una "difficolta" (1 facile, 2 media,
  //  3 difficile): più è difficile, più vale vincerlo. A ogni
  //  partita si assegnano punti dal 1° al 10° posto.
  // =========================================================
  var torneo = null; // { giocatori:[nomi], emoji:{}, punti:{nome:n}, storia:[], n }
  var CURVA_TORNEO = [100, 78, 62, 50, 40, 32, 25, 19, 14, 10]; // % del 1° posto, per posizione 1..10

  function pesoGioco(g) { var d = g && g.difficolta; return (d === 1 || d === 3) ? d : 2; }
  function nomeDifficolta(d) { return d === 3 ? "Difficile" : d === 1 ? "Facile" : "Media"; }

  function puntiDaClassifica(g, classifica) {
    var peso = pesoGioco(g);
    return classifica.map(function (r, i) {
      var perc = i < CURVA_TORNEO.length ? CURVA_TORNEO[i] : 6;
      return { nome: r.nome, punti: Math.round(perc * peso) };
    });
  }

  function classificaTorneo() {
    return torneo.giocatori.map(function (n) { return { nome: n, punti: torneo.punti[n] || 0 }; })
      .sort(function (a, b) { return b.punti - a.punti; });
  }

  function podio(cl, evidenziaPrimo) {
    var ol = el("ol", { class: "classifica" });
    var medaglie = ["🥇", "🥈", "🥉"];
    cl.forEach(function (r, i) {
      ol.appendChild(el("li", { class: (i === 0 && evidenziaPrimo) ? "vincitore" : "" }, [
        el("span", { class: "pos", text: medaglie[i] || (i + 1) + "°" }),
        el("span", { class: "nome", text: (torneo && torneo.emoji[r.nome] ? torneo.emoji[r.nome] + " " : "") + r.nome }),
        el("span", { class: "punti", text: r.punti })
      ]));
    });
    return ol;
  }

  function apriTorneo() {
    if (torneo) return schermataTorneoHub();
    if (!profiloAttivo()) return schermataAccesso(function () { schermataSala(null, { torneo: true }); });
    schermataSala(null, { torneo: true });
  }

  function iniziaTorneo() {
    var nomi = nomiGruppo();
    torneo = { giocatori: nomi, emoji: {}, punti: {}, storia: [], n: 0 };
    gruppo.forEach(function (p, i) { torneo.emoji[nomi[i]] = p.emoji || "🙂"; });
    nomi.forEach(function (n) { torneo.punti[n] = 0; });
    schermataTorneoHub();
  }

  function schermataTorneoHub() {
    var s = schermata({ icona: "🏆", titolo: "Torneo", indietro: schermataHome,
      sotto: torneo.n === 0 ? "Nessuna partita ancora" : (torneo.n + (torneo.n === 1 ? " partita giocata" : " partite giocate")) });
    s._contenuto.appendChild(podio(classificaTorneo(), torneo.n > 0));
    s._piede.appendChild(el("button", { class: "btn btn-primario",
      text: torneo.n === 0 ? "▶ Gioca la prima partita" : "▶ Gioca un'altra partita", onclick: torneoScegliGioco }));
    var azioni = el("div", { class: "home-azioni" });
    if (torneo.n > 0) azioni.appendChild(el("button", { class: "azione", text: "🏁 Chiudi e premia", onclick: schermataTorneoFine }));
    azioni.appendChild(el("button", { class: "azione", text: "🏠 Home", onclick: schermataHome }));
    s._piede.appendChild(azioni);
    mostra(s);
  }

  function torneoScegliGioco() {
    var s = schermata({ icona: "🎮", titolo: "Quale gioco?", sotto: "Più è difficile, più punti vale",
      indietro: schermataTorneoHub });
    var griglia = el("div", { class: "griglia-giochi" });
    giochi.forEach(function (g) { griglia.appendChild(tesseraGioco(g, function () { schermataPreGioco(g, { torneo: true }); })); });
    s._contenuto.appendChild(griglia);
    mostra(s);
  }

  function torneoRisultato(g, classifica) {
    var assegnati = puntiDaClassifica(g, classifica);
    assegnati.forEach(function (r) { torneo.punti[r.nome] = (torneo.punti[r.nome] || 0) + r.punti; });
    torneo.n += 1;
    torneo.storia.push({ gioco: g.nome, assegnati: assegnati });

    var s = schermata({ icona: g.icona, titolo: "Punti di questa partita", sotto: g.nome + " · " + nomeDifficolta(pesoGioco(g)) });
    var ol = el("ol", { class: "classifica" });
    var medaglie = ["🥇", "🥈", "🥉"];
    assegnati.forEach(function (r, i) {
      ol.appendChild(el("li", { class: i === 0 ? "vincitore" : "" }, [
        el("span", { class: "pos", text: medaglie[i] || (i + 1) + "°" }),
        el("span", { class: "nome", text: r.nome }),
        el("span", { class: "punti", text: "+" + r.punti })
      ]));
    });
    s._contenuto.appendChild(ol);
    s._piede.appendChild(el("button", { class: "btn btn-primario", text: "🏆 Classifica del torneo", onclick: schermataTorneoHub }));
    mostra(s);
  }

  function schermataTorneoFine() {
    var s = schermata({ icona: "🏆", titolo: "Torneo finito!", sotto: torneo.n + (torneo.n === 1 ? " partita" : " partite") });
    s._contenuto.appendChild(podio(classificaTorneo(), true));
    s._piede.appendChild(el("button", { class: "btn btn-primario", text: "↻ Nuovo torneo (stessi giocatori)",
      onclick: function () { torneo.punti = {}; torneo.storia = []; torneo.n = 0; torneo.giocatori.forEach(function (n) { torneo.punti[n] = 0; }); schermataTorneoHub(); } }));
    var azioni = el("div", { class: "home-azioni" });
    azioni.appendChild(el("button", { class: "azione", text: "🏠 Home", onclick: function () { torneo = null; schermataHome(); } }));
    s._piede.appendChild(azioni);
    mostra(s);
  }

  // =========================================================
  //  GIRO DI PARTITA
  //  Consegna al gioco un "tavolo" con tutto ciò che gli serve,
  //  senza fargli sapere come sono fatte le schermate comuni.
  // =========================================================
  function avviaPartita(g, giocatori, impostazioni, opts) {
    var contenitore = el("div");
    var schermo = el("div");
    schermo.appendChild(contenitore);

    var tavolo = {
      giocatori: giocatori.slice(),
      impostazioni: impostazioni || {},
      linkParams: linkParams,
      radice: contenitore,

      // aiuti riusabili (così i giochi non reinventano le stesse cose)
      el: el,
      svuota: svuota,
      mischia: mischia,
      schermata: schermata,
      mostra: function (s) { mostra(s); },

      // passaggio del telefono, poi esegue "quando"
      passaA: function (nome, quando) { passaIlTelefono(nome, quando); },

      // il gioco chiama questa quando è finito
      fine: function (classifica) {
        if (opts && opts.torneo && torneo) return torneoRisultato(g, classifica);
        schermataFine(g, classifica, giocatori, impostazioni);
      },

      // uscite comuni
      esci: schermataHome
    };

    g.avvia(tavolo);
  }

  // =========================================================
  //  API PUBBLICA
  // =========================================================
  window.SG = {
    registra: function (gioco) { giochi.push(gioco); },
    avviaApp: function () {
      app = document.getElementById("app");
      linkParams = leggiParametriLink();
      var g = linkParams.gioco && giochi.filter(function (x) { return x.id === linkParams.gioco; })[0];
      // Con un codice stanza si entra come OSPITE; altrimenti si apre la preparazione
      if (g && linkParams.stanza) avviaPartita(g, [], {});
      else if (g) apriGioco(g);
      else schermataHome();
    },
    // la sala: i giochi possono rimandarci dalla loro schermata finale
    cambiaGioco: function () { schermataScegliGioco(); },
    sala: function () { schermataSala(null); },
    // impostazioni arrivate da un link (le legge il gioco per i valori di partenza)
    parametriLink: function () { return linkParams; },
    // costruisce un link condivisibile con le impostazioni scelte dall'host
    creaLink: function (params) {
      var base = location.origin + location.pathname;
      var pezzi = [];
      for (var k in params) {
        var v = params[k];
        if (v == null || v === "") continue;
        if (Array.isArray(v)) v = v.join(",");
        // chiavi e valori qui sono già sicuri (lettere, numeri, virgole): niente codifica illeggibile
        pezzi.push(k + "=" + v);
      }
      return base + (pezzi.length ? "#" + pezzi.join("&") : "");
    },
    // esposti perché comodi anche fuori
    _util: { el: el, svuota: svuota, mischia: mischia }
  };
})();

/* =========================================================
   COLLEGAMENTO TRA TELEFONI — "SGNet"
   Fa parlare i telefoni tra loro per la modalità
   "ognuno dal suo telefono", senza server né account.

   I messaggi passano da un "ufficio postale" pubblico e
   gratuito (un broker MQTT): ogni telefono si collega a
   quello, quindi funziona su qualsiasi rete (niente
   collegamento diretto che sul cellulare spesso fallisce).

   Un telefono "ospita" la stanza (è il cervello della
   partita); gli altri "entrano" con il codice.
   ========================================================= */
(function () {
  "use strict";

  var BROKER = "wss://broker.hivemq.com:8884/mqtt";
  var BASE = "seratagiochi/v1/";
  var ALFABETO = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // niente caratteri ambigui

  function codiceACaso(n) {
    var s = "";
    for (var i = 0; i < (n || 4); i++) s += ALFABETO[Math.floor(Math.random() * ALFABETO.length)];
    return s;
  }
  function topics(codice) {
    codice = String(codice).toUpperCase();
    return { stato: BASE + codice + "/stato", azioni: BASE + codice + "/azioni" };
  }

  window.SGNet = {
    disponibile: function () { return typeof mqtt !== "undefined"; },

    // L'host apre una stanza. cb: { onCodice, onConnesso, onAddio(id), onMsg(id,msg), onErrore(e) }
    ospita: function (giocoId, cb) {
      if (!this.disponibile()) { cb.onErrore && cb.onErrore({ type: "no-mqtt" }); return null; }
      var codice = codiceACaso(4);
      var T = topics(codice);
      var META = BASE + codice + "/meta";
      // Il codice si conosce SUBITO (non dipende dal collegamento): mostralo subito,
      // così la stanza dà sempre il codice anche se la rete è lenta a collegarsi.
      // (un tick dopo, così chi ci chiama ha già ricevuto l'oggetto "rete")
      setTimeout(function () { cb.onCodice && cb.onCodice(codice); }, 0);
      var client = mqtt.connect(BROKER, {
        clean: true, reconnectPeriod: 2000,
        // Se l'host sparisce all'improvviso, avvisa gli altri
        will: { topic: T.stato, payload: JSON.stringify({ t: "__hostgone" }), retain: false }
      });
      client.on("connect", function () {
        // quando è davvero collegato la stanza è "pronta": lo comunichiamo al gioco
        client.subscribe(T.azioni, function () { cb.onConnesso && cb.onConnesso(); });
        // annuncia QUALE gioco è questa stanza, così chi entra col codice apre quello giusto
        try { client.publish(META, JSON.stringify({ g: giocoId || "" }), { retain: true }); } catch (e) {}
      });
      client.on("message", function (_t, payload) {
        var m; try { m = JSON.parse(payload.toString()); } catch (e) { return; }
        if (!m) return;
        if (m.data && m.data.t === "__leave") { cb.onAddio && cb.onAddio(m.from); return; }
        cb.onMsg && cb.onMsg(m.from, m.data);
      });
      client.on("error", function (e) { cb.onErrore && cb.onErrore({ type: "mqtt", message: e && e.message }); });

      return {
        // la partita (vm) viene mandata a tutti e "trattenuta" (retain) così
        // chi entra dopo riceve subito lo stato attuale
        invia: function (msg) { try { if (client.connected) client.publish(T.stato, JSON.stringify(msg), { retain: true }); } catch (e) {} },
        inviaA: function (id, msg) { this.invia(msg); },
        chiudi: function () {
          try {
            client.publish(T.stato, JSON.stringify({ t: "__hostgone" }), { retain: false });
            client.publish(T.stato, "", { retain: true }); // pulisce lo stato trattenuto
            client.publish(META, "", { retain: true });    // pulisce l'annuncio del gioco
            client.end();
          } catch (e) {}
        }
      };
    },

    // Un ospite entra con il codice. cb: { onAperto(id), onMsg(msg), onChiuso, onErrore(e) }
    entra: function (codice, cb) {
      if (!this.disponibile()) { cb.onErrore && cb.onErrore({ type: "no-mqtt" }); return null; }
      var myId = "g" + Math.random().toString(36).slice(2, 9);
      var T = topics(codice);
      var client = mqtt.connect(BROKER, {
        clean: true, reconnectPeriod: 2000,
        will: { topic: T.azioni, payload: JSON.stringify({ from: myId, data: { t: "__leave" } }), retain: false }
      });
      var aperto = false;
      client.on("connect", function () {
        client.subscribe(T.stato, function () { if (!aperto) { aperto = true; cb.onAperto && cb.onAperto(myId); } });
      });
      client.on("message", function (_t, payload) {
        var m; try { m = JSON.parse(payload.toString()); } catch (e) { return; }
        if (!m || m === "") return;
        if (m.t === "__hostgone") { cb.onChiuso && cb.onChiuso(); return; }
        cb.onMsg && cb.onMsg(m);
      });
      client.on("error", function (e) { cb.onErrore && cb.onErrore({ type: "mqtt", message: e && e.message }); });

      return {
        invia: function (msg) { try { if (client.connected) client.publish(T.azioni, JSON.stringify({ from: myId, data: msg }), { retain: false }); } catch (e) {} },
        chiudi: function () {
          try { client.publish(T.azioni, JSON.stringify({ from: myId, data: { t: "__leave" } }), { retain: false }); client.end(); } catch (e) {}
        }
      };
    },

    // Scopre QUALE gioco si sta giocando in una stanza, dal solo codice.
    // Così chi entra digitando il codice apre il gioco giusto e non un altro.
    // cb riceve l'id del gioco (stringa) oppure null se non lo trova.
    scopriGioco: function (codice, cb) {
      if (!this.disponibile()) { cb(null); return; }
      var META = BASE + String(codice).toUpperCase() + "/meta";
      var client = mqtt.connect(BROKER, { clean: true, reconnectPeriod: 0 });
      var fatto = false;
      function fine(g) { if (fatto) return; fatto = true; try { client.end(true); } catch (e) {} cb(g || null); }
      client.on("connect", function () { client.subscribe(META); });
      client.on("message", function (_t, payload) {
        var m; try { m = JSON.parse(payload.toString()); } catch (e) {}
        fine(m && m.g);
      });
      client.on("error", function () { fine(null); });
      setTimeout(function () { fine(null); }, 10000);
    }
  };
})();

    fr.forEach(function (f, i) {
      var o = c.createOscillator(), g = c.createGain();
      o.type = tipo || "sine"; o.frequency.value = f;
      var s = t0 + i * (dur * 0.6);
      g.gain.setValueAtTime(0.0001, s);
      g.gain.exponentialRampToValueAtTime(0.22, s + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, s + dur);
      o.connect(g); g.connect(c.destination); o.start(s); o.stop(s + dur);
    });
  }
  function vibra(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
  var FX = {
    rilancio: function () { beep([740], 0.09, "square"); vibra(25); },
    aggiudicato: function () { beep([660, 880, 1180], 0.16, "triangle"); vibra([70, 50, 90]); },
    round: function () { beep([520, 780], 0.14, "sine"); vibra(60); },
    fine: function () { beep([660, 880, 1046, 1318], 0.2, "triangle"); vibra([120, 60, 120, 60, 200]); }
  };

  function mischia(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var x = a[i]; a[i] = a[j]; a[j] = x; } return a; }

  // --- memoria delle carte già uscite ---
  // Ricorda le ultime carte apparse (su questo telefono) e preferisce
  // quelle mai viste: così due o tre partite di fila non si somigliano.
  var CHIAVE_VISTI = "sg_asta_visti_";
  var MEMORIA = 90;
  function elencoVisti(id) {
    try { var v = JSON.parse(localStorage.getItem(CHIAVE_VISTI + id) || "[]"); return (v instanceof Array) ? v : []; }
    catch (e) { return []; }
  }
  function segnaVisti(id, nomi) {
    try {
      var v = elencoVisti(id).concat(nomi);
      if (v.length > MEMORIA) v = v.slice(v.length - MEMORIA);
      localStorage.setItem(CHIAVE_VISTI + id, JSON.stringify(v));
    } catch (e) {}
  }

  // Prende N carte dal round tenendo RARI i pezzi migliori:
  // circa un terzo di fascia A, un terzo di C e il resto B.
  // Con 4 giocatori esce 1 carta A, 2 B e 1 C: mai quattro pezzi top.
  function carteDelRound(r, n, temaId) {
    var visti = elencoVisti(temaId);
    // prima le carte mai viste, poi le altre
    function perFreschezza(lista) {
      var nuove = [], viste = [];
      (lista || []).forEach(function (c) { (visti.indexOf(c.nome) < 0 ? nuove : viste).push(c); });
      return mischia(nuove).concat(mischia(viste));
    }
    var pool = { A: perFreschezza(r.A), B: perFreschezza(r.B), C: perFreschezza(r.C) };
    var quota = { A: Math.max(1, Math.floor(n / 3)), C: Math.max(1, Math.floor(n / 3)) };
    quota.B = n - quota.A - quota.C;
    if (quota.B < 0) { quota.B = 0; quota.A = Math.min(quota.A, n); quota.C = n - quota.A; }

    var scelte = [];
    ["A", "B", "C"].forEach(function (t) {
      for (var i = 0; i < quota[t] && pool[t].length; i++) {
        var c = pool[t].shift();
        scelte.push({ nome: c.nome, emoji: c.emoji, tier: t });
      }
    });
    // se una fascia è finita, si completa con le altre (prima B, poi C, poi A)
    var giro = 0;
    while (scelte.length < n && giro < 60) {
      var t2 = ["B", "C", "A"][giro % 3];
      if (pool[t2].length) { var c2 = pool[t2].shift(); scelte.push({ nome: c2.nome, emoji: c2.emoji, tier: t2 }); }
      giro++;
    }
    segnaVisti(temaId, scelte.map(function (c) { return c.nome; }));
    return mischia(scelte);
  }

  function barraTimer(el, ms, onFine) {
    var wrap = el("div", { class: "as-timer" });
    var fill = el("div", { class: "as-timer-fill" });
    wrap.appendChild(fill);
    requestAnimationFrame(function () { fill.style.transition = "width " + ms + "ms linear"; fill.style.width = "0%"; });
    var to = setTimeout(onFine, ms);
    wrap._stop = function () { clearTimeout(to); };
    return wrap;
  }

  // Quanto può puntare al massimo: deve tenere 1 credito per ogni round futuro

  function disegnaAsta(t, st) {
    var el = t.el, a = st.asta;

  // ---- votazione a stelle: si passa il telefono a ogni giocatore ----
  function votazione(t, st, votante) {

  function schermoVoto(t, st, votante) {

      if (i === votante) return;
      var box = nodoKit(el, g, st);
      var riga = el("div", { class: "as-stelle" });
      var bottoni = [];
      for (var n = 1; n <= 5; n++) {
        (function (val) {
          var b = el("button", { text: "⭐", "aria-label": val + " stelle", onclick: function () {
            voti[i] = val;
            bottoni.forEach(function (bb, k) { bb.className = (k < val) ? "on" : ""; });
            var mancano = st.giocatori.filter(function (_, j) { return j !== votante && !voti[j]; }).length;
            if (mancano === 0) avanti.removeAttribute("disabled");
          } });
          bottoni.push(b); riga.appendChild(b);
        })(n);
      }
      box.appendChild(riga);
      s._contenuto.appendChild(box);
    });

    s._piede.appendChild(avanti);
    t.mostra(s);
  }

  function nomeBreve(n) { return n.length > 12 ? n.slice(0, 12) + "…" : n; }

  function finePartita(t, st) {
    FX.fine();
    var classifica = st.giocatori.slice().sort(function (a, b) { return b.stelle - a.stelle; })
      .map(function (g) { return { nome: g.nome, punti: g.stelle + " ⭐" }; });
    t.fine(classifica);
  }


  // =========================================================
  //  MODALITÀ ONLINE — "ognuno dal suo telefono"
  //  Un telefono ospita la stanza e tiene l'unica copia vera
  //  della partita: calcola tutto e manda agli altri una "foto".
  //  Gli ospiti disegnano e rimandano solo le proprie mosse.
  // =========================================================

  function futuri(st) { return (TOT_ROUND - 1) - st.roundIdx; }
  function maxPuntataG(st, g) { return g.crediti - futuri(st); }
  function perId(st, id) { for (var i = 0; i < st.giocatori.length; i++) if (st.giocatori[i].id === id) return st.giocatori[i]; return null; }
  function nomeDi(st, id) { var g = perId(st, id); return g ? g.nome : ""; }

  function vmAsta(st) {
    var r = st.tema.round[st.roundIdx] || {};
    var sceglie = st.senzaCarta.length ? st.senzaCarta[st.chooserPtr % st.senzaCarta.length] : null;
    return {
      fase: st.fase, codice: st.codice,
      temaNome: st.tema.nome, temaIcona: st.tema.icona,
      roundIdx: st.roundIdx, roundNome: r.nome, roundIcona: r.icona, totRound: TOT_ROUND,
      giocatori: st.giocatori.map(function (g) {
        return { id: g.id, nome: g.nome, crediti: g.crediti, haCarta: st.senzaCarta.indexOf(g.id) < 0, kit: g.kit.slice() };
      }),
      tavolo: st.tavolo.map(function (c) { return { nome: c.nome, emoji: c.emoji, tier: c.tier }; }),
      sceglieId: sceglie, sceglieNome: sceglie ? nomeDi(st, sceglie) : "",
      asta: st.asta ? {
        carta: st.asta.carta, offerta: st.asta.offerta,
        leaderId: st.asta.leader, leaderNome: nomeDi(st, st.asta.leader),
        passati: Object.keys(st.asta.passati), scadenza: st.scadenza || null
      } : null,
      esito: st.esito || null,
      hannoVotato: Object.keys(st.voti || {}),
      classifica: st.classifica || null
    };
  }

  // ---------- L'HOST ----------
  function hostAsta(t, tema, crediti) {
    if (!(window.SGNet && SGNet.disponibile())) return senzaRete(t);
    var st = {
      tema: tema, crediti: crediti, roundIdx: 0, chooserPtr: 0,
      tavolo: [], senzaCarta: [], asta: null, esito: null, classifica: null,
      fase: "lobby", iniziata: false, codice: "…", scadenza: null, _to: null, voti: {},
      giocatori: [{ id: "host", nome: (t.giocatori && t.giocatori[0]) || "Host", crediti: crediti, kit: [], stelle: 0 }]
    };
    function stopTo() { if (st._to) { clearTimeout(st._to); st._to = null; } }

    var rete = SGNet.ospita("asta", {
      onCodice: function (c) { st.codice = c; bd(); },
      onConnesso: function () { st.pronta = true; bd(); },
      onAddio: function (id) {
        if (!perId(st, id)) return;
        st.giocatori = st.giocatori.filter(function (x) { return x.id !== id; });
        st.senzaCarta = st.senzaCarta.filter(function (x) { return x !== id; });
        delete st.voti[id];
        if (st.asta) delete st.asta.passati[id];
        if (st.iniziata && st.giocatori.length === 0) { stopTo(); rete.chiudi(); return t.esci(); }
        if (st.fase === "asta") { if (st.asta && st.asta.leader === id) return chiudi(); if (verificaPassati()) return; }
        if (st.fase === "voto") { verificaVoti(); return; }
        if (st.fase === "scelta" && st.senzaCarta.length === 0) return prossima();
        bd();
      },
      onMsg: function (id, m) {
        if (!m || !m.t) return;
        if (m.t === "join") {
          if (!st.iniziata && !perId(st, id) && st.giocatori.length < MAX_GIOCATORI)
            st.giocatori.push({ id: id, nome: String(m.nome || "Amico").slice(0, 16), crediti: st.crediti, kit: [], stelle: 0 });
          bd();
        }
        else if (m.t === "scegli") scegli(id, m.idx);
        else if (m.t === "rilancia") rilanciaO(id);
        else if (m.t === "passa") passaO(id);
        else if (m.t === "voto") voto(id, m.voti);
      },
      onErrore: function (e) { senzaRete(t, e); }
    });

    function invia() { rete.invia({ t: "vm", vm: vmAsta(st) }); }
    function bd() { invia(); disegna(); }

    function comincia() {
      if (st.iniziata || st.giocatori.length < 2) return;
      st.iniziata = true; st.roundIdx = 0; nuovoRound();
    }
    function nuovoRound() {
      stopTo();
      var r = st.tema.round[st.roundIdx];
      st.tavolo = carteDelRound(r, st.giocatori.length, st.tema.id);
      st.senzaCarta = st.giocatori.map(function (g) { return g.id; });
      st.chooserPtr = st.roundIdx;
      st.asta = null; st.esito = null; st.scadenza = null;
      st.fase = "round";
      FX.round(); bd();
    }
    function prossima() {
      stopTo();
      if (st.senzaCarta.length === 0) return fineRoundO();
      if (st.senzaCarta.length === 1 && st.tavolo.length === 1) {
        var g = perId(st, st.senzaCarta[0]), carta = st.tavolo[0];
        g.crediti -= 1; g.kit.push(carta);
        st.tavolo = []; st.senzaCarta = [];
        st.esito = { chiId: g.id, chiNome: g.nome, carta: carta, prezzo: 1, automatica: true };
        st.asta = null; st.scadenza = null; st.fase = "esito";
        FX.aggiudicato(); return bd();
      }
      st.fase = "scelta"; st.asta = null; st.esito = null; st.scadenza = null; bd();
    }
    function scegli(id, idx) {
      if (st.fase !== "scelta" || !st.senzaCarta.length) return;
      var sceglie = st.senzaCarta[st.chooserPtr % st.senzaCarta.length];
      if (id !== sceglie) return;
      if (idx == null || idx < 0 || idx >= st.tavolo.length) return;
      st.asta = { carta: st.tavolo[idx], idx: idx, offerta: 1, leader: id, passati: {} };
      st.fase = "asta";
      riparti();
    }
    function riparti() {
      stopTo();
      st.scadenza = Date.now() + SECONDI * 1000;
      st._to = setTimeout(function () { chiudi(); }, SECONDI * 1000);
      bd();
    }
    function rilanciaO(id) {
      if (st.fase !== "asta" || !st.asta) return;
      var g = perId(st, id); if (!g) return;
      if (st.senzaCarta.indexOf(id) < 0) return;
      if (maxPuntataG(st, g) < st.asta.offerta + 1) return;
      st.asta.offerta += 1; st.asta.leader = id;
      delete st.asta.passati[id];
      FX.rilancio();
      riparti();
    }
    function passaO(id) {
      if (st.fase !== "asta" || !st.asta) return;
      if (st.senzaCarta.indexOf(id) < 0) return;
      if (st.asta.leader === id) return;
      st.asta.passati[id] = true;
      if (!verificaPassati()) bd();
    }
    function verificaPassati() {
      if (!st.asta) return false;
      var restano = st.senzaCarta.filter(function (x) { return !st.asta.passati[x]; });
      if (restano.length <= 1) { chiudi(); return true; }
      return false;
    }
    function chiudi() {
      if (st.fase !== "asta" || !st.asta) return;
      stopTo();
      var a = st.asta, g = perId(st, a.leader);
      if (!g) { st.asta = null; return prossima(); }
      g.crediti -= a.offerta; g.kit.push(a.carta);
      st.tavolo.splice(a.idx, 1);
      st.senzaCarta = st.senzaCarta.filter(function (x) { return x !== a.leader; });
      st.chooserPtr++;
      st.esito = { chiId: g.id, chiNome: g.nome, carta: a.carta, prezzo: a.offerta, automatica: false };
      st.asta = null; st.scadenza = null; st.fase = "esito";
      FX.aggiudicato(); bd();
    }
    function avanti() {
      if (st.fase === "esito" || st.fase === "round") return prossima();
      if (st.fase === "kit") { st.fase = "voto"; st.voti = {}; return bd(); }
    }
    function fineRoundO() {
      st.roundIdx++;
      if (st.roundIdx < TOT_ROUND) return nuovoRound();
      st.fase = "kit"; bd();
    }
    function voto(id, voti) {
      if (st.fase !== "voto") return;
      if (!perId(st, id) || st.voti[id]) return;
      st.voti[id] = voti || {};
      bd(); verificaVoti();
    }
    function verificaVoti() {
      if (st.fase !== "voto") return;
      var tutti = st.giocatori.every(function (g) { return st.voti[g.id]; });
      if (!tutti) return;
      st.giocatori.forEach(function (g) { g.stelle = 0; });
      Object.keys(st.voti).forEach(function (chi) {
        var v = st.voti[chi] || {};
        Object.keys(v).forEach(function (target) {
          var g = perId(st, target);
          if (g && target !== chi) g.stelle += Math.max(1, Math.min(5, parseInt(v[target], 10) || 0));
        });
      });
      st.classifica = st.giocatori.slice().sort(function (a, b) { return b.stelle - a.stelle; })
        .map(function (g) { return { nome: g.nome, punti: g.stelle + " ⭐" }; });
      st.fase = "fine"; FX.fine(); bd();
    }

    var cb = {
      myId: "host", sonoHost: true,
      onComincia: comincia,
      onScegli: function (i) { scegli("host", i); },
      onRilancia: function () { rilanciaO("host"); },
      onPassa: function () { passaO("host"); },
      onAvanti: avanti,
      onVoto: function (v) { voto("host", v); },
      onEsci: function () { stopTo(); rete.chiudi(); t.esci(); }
    };
    function disegna() { disegnaAstaVM(t, vmAsta(st), cb); }
    disegna();
  }

  // ---------- UN OSPITE ----------
  function ospiteAsta(t, codice) {
    if (!(window.SGNet && SGNet.disponibile())) return senzaRete(t);
    var el = t.el, S = { myId: null, vm: null, rete: null, nome: "", msg: null };
    var cb = {
      myId: null, sonoHost: false,
      onScegli: function (i) { S.rete && S.rete.invia({ t: "scegli", idx: i }); },
      onRilancia: function () { S.rete && S.rete.invia({ t: "rilancia" }); },
      onPassa: function () { S.rete && S.rete.invia({ t: "passa" }); },
      onAvanti: function () {},
      onVoto: function (v) { S.rete && S.rete.invia({ t: "voto", voti: v }); },
      onEsci: function () { if (S.rete) S.rete.chiudi(); t.esci(); }
    };
    function disegna() { if (S.vm) { cb.myId = S.myId; disegnaAstaVM(t, S.vm, cb); } }

    schermaNome();
    function schermaNome() {
      var s = t.schermata({ icona: "🔨", titolo: "Entra all'asta", sotto: "Stanza " + codice.toUpperCase(), indietro: t.esci });
      var input = el("input", { type: "text", placeholder: "Il tuo nome", maxlength: "16", class: "link-campo" });
      S.msg = el("div", { class: "link-avviso" });
      s._contenuto.appendChild(input); s._contenuto.appendChild(S.msg);
      s._piede.appendChild(el("button", { class: "btn btn-primario", text: "Entra ▶", onclick: function () {
        ctx(); S.nome = (input.value || "Amico").trim() || "Amico";
        S.msg.textContent = "Collegamento in corso…"; collega();
      }}));
      t.mostra(s);
    }
    function collega() {
      S.rete = SGNet.entra(codice, {
        onAperto: function (id) { S.myId = id; S.rete.invia({ t: "join", nome: S.nome });
          setTimeout(function () { if (!S.vm && S.msg) S.msg.textContent = "Non trovo la partita. Controlla il codice, o l'host non ha ancora aperto la stanza…"; }, 8000); },
        onMsg: function (m) { if (m && m.t === "vm") { S.vm = m.vm; disegna(); } },
        onChiuso: function () { erroreSchermo(t, "Collegamento perso. L'host potrebbe aver chiuso la partita."); },
        onErrore: function () { erroreSchermo(t, "Problema di collegamento. Controlla la connessione e riprova."); }
      });
    }
  }

  function erroreSchermo(t, txt) {
    var s = t.schermata({ icona: "⚠️", titolo: "Ops" });
    s._contenuto.appendChild(t.el("p", { text: txt, style: "font-size:1.05rem;line-height:1.5" }));
    s._piede.appendChild(t.el("button", { class: "btn btn-primario", text: "🏠 Torna all'inizio", onclick: t.esci }));
    t.mostra(s);
  }
  function senzaRete(t) {
    var s = t.schermata({ icona: "🔗", titolo: "Serve il sito pubblicato", indietro: t.esci });
    s._contenuto.appendChild(t.el("p", { style: "font-size:1.05rem;line-height:1.5",
      text: "La modalità \"ognuno dal suo telefono\" funziona quando il gioco è aperto dal sito pubblicato online. Da un file locale non è disponibile: intanto usa \"Un telefono solo\"." }));
    s._piede.appendChild(t.el("button", { class: "btn btn-primario", text: "Ok", onclick: t.esci }));
    t.mostra(s);
  }

  // ---------- DISEGNO CONDIVISO (host e ospiti) ----------
  function barraRimasta(el, rimasti) {
    var wrap = el("div", { class: "as-timer" });
    var fill = el("div", { class: "as-timer-fill" });
    wrap.appendChild(fill);
    var frac = Math.max(0, Math.min(1, rimasti / (SECONDI * 1000)));
    fill.style.width = (frac * 100) + "%";
    if (rimasti > 0) requestAnimationFrame(function () { fill.style.transition = "width " + rimasti + "ms linear"; fill.style.width = "0%"; });
    return wrap;
  }
  function strisciaOnline(el, vm, myId) {
    var top = el("div", { class: "as-top" });
    vm.giocatori.forEach(function (g) {
      top.appendChild(el("div", { class: "as-pt" + (g.id === myId ? " attivo" : "") + (g.haCarta ? " fatto" : "") }, [
        el("div", { class: "n", text: g.nome }),
        el("div", { class: "c", text: g.crediti + "💰" })
      ]));
    });
    return top;
  }
  function testaRound(el, vm) {
    return el("div", { class: "as-round" }, [
      el("div", { class: "n", text: "Round " + (vm.roundIdx + 1) + " di " + vm.totRound }),
      el("div", { class: "t", text: (vm.roundIcona || "") + " " + (vm.roundNome || "") })
    ]);
  }
  function nodoKitVm(el, g) {
    var box = el("div", { class: "as-kit" });
    box.appendChild(el("h3", { text: g.nome + " · " + g.crediti + " 💰 avanzati" }));
    g.kit.forEach(function (c) {
      box.appendChild(el("div", { class: "riga" }, [
        el("span", { class: "em", text: c.emoji }),
        el("span", { style: "flex:1", text: c.nome }),
        el("span", { class: "tier tier-" + c.tier, text: c.tier })
      ]));
    });
    return box;
  }

  function disegnaAstaVM(t, vm, cb) {
    var el = t.el, myId = cb.myId;
    if (vm.fase === "lobby") return lobbyAsta(t, vm, cb);
    if (vm.fase === "fine") return schermataFineAsta(t, vm, cb);

    var s = t.schermata({ sotto: "Stanza " + (vm.codice || ""), icona: "🔨",
      titolo: titoloFaseAsta(vm, myId),
      indietro: function () { if (window.confirm("Uscire dalla partita?")) cb.onEsci(); } });

    if (vm.fase !== "kit" && vm.fase !== "voto") s._contenuto.appendChild(testaRound(el, vm));
    s._contenuto.appendChild(strisciaOnline(el, vm, myId));

    if (vm.fase === "round") {
      s._contenuto.appendChild(el("div", { style: "text-align:center;font-size:3.4rem;line-height:1;margin:10px 0", text: vm.roundIcona }));
      s._contenuto.appendChild(el("p", { class: "as-msg", text: "Sul tavolo " + vm.giocatori.length + " carte: ognuno se ne aggiudica una." }));
      if (cb.sonoHost) s._piede.appendChild(el("button", { class: "btn btn-primario", text: "Vedi le carte ▶", onclick: cb.onAvanti }));
      else s._piede.appendChild(el("p", { class: "as-msg", text: "In attesa che l'host cominci il round…" }));
    }

    else if (vm.fase === "scelta") {
      var mio = vm.sceglieId === myId;
      s._contenuto.appendChild(el("p", { class: "as-msg", style: "margin-bottom:10px",
        text: mio ? "🔨 Scegli tu la carta da mettere all'asta" : ("🔨 " + vm.sceglieNome + " sta scegliendo la carta") }));
      var g1 = el("div", { class: "as-griglia" });
      vm.tavolo.forEach(function (c, idx) {
        var nodo = el("button", { class: "as-carta", onclick: mio ? function () { cb.onScegli(idx); } : null }, [
          el("span", { class: "em", text: c.emoji }),
          el("span", { class: "nm", text: c.nome }),
          el("span", { class: "tier tier-" + c.tier, text: c.tier })
        ]);
        if (!mio) nodo.disabled = true;
        g1.appendChild(nodo);
      });
      s._contenuto.appendChild(g1);
    }

    else if (vm.fase === "asta") {
      var a = vm.asta;
      s._contenuto.appendChild(el("div", { class: "as-big" }, [
        el("div", { class: "em", text: a.carta.emoji }),
        el("div", { class: "nm", text: a.carta.nome }),
        el("div", { style: "margin-top:6px;font-weight:900;opacity:.75", text: "Fascia " + a.carta.tier })
      ]));
      s._contenuto.appendChild(el("div", { class: "as-offerta" }, [
        el("div", { class: "v", text: a.offerta + " 💰" }),
        el("div", { class: "chi", text: "offerta di " + a.leaderNome })
      ]));
      s._contenuto.appendChild(barraRimasta(el, (a.scadenza || 0) - Date.now()));

      var io = null;
      vm.giocatori.forEach(function (g) { if (g.id === myId) io = g; });
      var inGara = io && !io.haCarta;
      var hoPassato = a.passati.indexOf(myId) >= 0;
      var guido = a.leaderId === myId;
      var max = io ? io.crediti - ((vm.totRound - 1) - vm.roundIdx) : 0;
      if (inGara && !hoPassato) {
        var riga = el("div", { class: "tl-vota" });
        var bSu = el("button", { class: "btn btn-verde", text: "+1 → " + (a.offerta + 1), onclick: cb.onRilancia });
        if (max < a.offerta + 1) bSu.disabled = true;
        riga.appendChild(bSu);
        if (!guido) riga.appendChild(el("button", { class: "btn btn-rosso", text: "Passa", onclick: cb.onPassa }));
        s._piede.appendChild(riga);
        s._contenuto.appendChild(el("p", { class: "as-msg",
          text: guido ? "👑 Stai guidando l'offerta" : ("Hai " + io.crediti + " crediti · puoi arrivare a " + Math.max(0, max)) }));
      } else {
        s._contenuto.appendChild(el("p", { class: "as-msg",
          text: !io ? "Stai guardando la partita" : (io.haCarta ? "Hai già la tua carta di questo round" : "Hai passato: aspetti il risultato") }));
      }
    }

    else if (vm.fase === "esito") {
      var e2 = vm.esito || {};
      s._contenuto.appendChild(el("div", { style: "text-align:center;font-size:3rem;line-height:1;margin:6px 0", text: "🔨" }));
      s._contenuto.appendChild(el("div", { style: "text-align:center;font-size:1.4rem;font-weight:900", text: e2.chiNome + " si aggiudica" }));
      s._contenuto.appendChild(el("div", { class: "as-big", style: "margin-top:8px" }, [
        el("div", { class: "em", text: e2.carta.emoji }),
        el("div", { class: "nm", text: e2.carta.nome }),
        el("div", { style: "margin-top:6px;font-weight:900;opacity:.75", text: "Fascia " + e2.carta.tier })
      ]));
      s._contenuto.appendChild(el("div", { style: "text-align:center;font-size:1.3rem;font-weight:900;color:var(--accento);margin-top:8px",
        text: "per " + e2.prezzo + " 💰" }));
      if (e2.automatica) s._contenuto.appendChild(el("p", { class: "as-msg", text: "Ultima carta rimasta: assegnata automaticamente." }));
      if (cb.sonoHost) s._piede.appendChild(el("button", { class: "btn btn-primario", text: "Avanti ▶", onclick: cb.onAvanti }));
      else s._piede.appendChild(el("p", { class: "as-msg", text: "In attesa dell'host…" }));
    }

    else if (vm.fase === "kit") {
      vm.giocatori.forEach(function (g) { s._contenuto.appendChild(nodoKitVm(el, g)); });
      if (cb.sonoHost) s._piede.appendChild(el("button", { class: "btn btn-primario", text: "Si vota ⭐", onclick: cb.onAvanti }));
      else s._piede.appendChild(el("p", { class: "as-msg", text: "In attesa che l'host apra la votazione…" }));
    }

    else if (vm.fase === "voto") {
      var hoVotato = vm.hannoVotato.indexOf(myId) >= 0;
      var dentro = vm.giocatori.some(function (g) { return g.id === myId; });
      if (hoVotato || !dentro) {

      } else {

                if (mancano === 0) conferma.removeAttribute("disabled");
              }});
              bottoni.push(b); riga2.appendChild(b);
            })(n);
          }
          box.appendChild(riga2);
          s._contenuto.appendChild(box);
        });
        s._piede.appendChild(conferma);
      }
    }

    t.mostra(s);
  }

  function titoloFaseAsta(vm, myId) {

    var lista = el("div");

      s._piede.appendChild(b);
    } else s._piede.appendChild(el("p", { class: "as-msg", text: "In attesa che l'host cominci…" }));
    t.mostra(s);

  function schermataFineAsta(t, vm, cb) {

    var s = t.schermata({ icona: "🏆", titolo: "Classifica finale", sotto: "L'Asta · " + vm.temaNome });
    s._contenuto.appendChild(el("div", { class: "tl-coriandoli", text: "🎉🥳🎉" }));
    var ol = el("ol", { class: "classifica" });

    (vm.classifica || []).forEach(function (r, i) {
      var li = el("li", { class: i === 0 ? "vincitore" : "" }, [
        el("span", { class: "pos", text: med[i] || (i + 1) + "°" }),

      ]);
      li.style.animationDelay = (i * 0.12) + "s";

    });
