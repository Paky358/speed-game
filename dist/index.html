    s._piede.appendChild(el("button", { class: "btn btn-primario", text: "🏠 Torna all'inizio", onclick: cb.onEsci }));

  SG.registra(gioco);
})();

/* =========================================================
   GIOCO — "L'Impostore"
   Un telefono solo. Tutti ricevono la STESSA parola, tranne
   uno: l'impostore. Se l'host tiene acceso l'aiutino,
   l'impostore riceve una parola SIMILE ma diversa (dalla
   coppia in data/impostore-parole.js), per riuscire a
   bleffare; altrimenti è al buio.
   Il telefono si passa di mano: ognuno guarda il suo ruolo in
   segreto. Poi l'app dice chi inizia (a caso). Si parla a voce,
   a turno un indizio; infine si vota chi è l'impostore.
   ========================================================= */
(function () {
  "use strict";

  function scegli(a) { return a[Math.floor(Math.random() * a.length)]; }

  SG.registra({
    id: "impostore",
    nome: "L'Impostore",
    icona: "🕵️",
    descrizione: "Tutti hanno la stessa parola, tranne l'impostore. Scoprite chi bluffa prima che la faccia franca.",
    giocatoriMin: 3,
    giocatoriMax: 10,
    difficolta: 2,
    regole: [
      "Il telefono si passa di mano: ognuno guarda in segreto la <b>parola</b>. Uno di voi è l'<b>impostore</b>.",
      "Con l'aiutino acceso l'impostore riceve una parola <b>simile ma diversa</b>, per provare a mimetizzarsi; da spento è al buio.",
      "L'app dice <b>chi inizia</b>: a turno ognuno dice a voce una parola legata alla propria, senza essere troppo esplicito.",
      "Alla fine si <b>vota</b> chi è l'impostore. Se lo scoprite, punti a chi l'ha beccato; se la fa franca, punti all'impostore."
    ],

    impostazioni: function (box, dove, aiuti) {
      var el = aiuti.el;
      dove.suggerimento = true;
      box.appendChild(el("div", { class: "etichetta", text: "Aiutino all'impostore" }));
      var bSi, bNo;
      function scegliAiuto(v) {
        dove.suggerimento = v;
        bSi.className = "modo-chip" + (v ? " attiva" : "");
        bNo.className = "modo-chip" + (v ? "" : " attiva");
      }
      bSi = el("button", { class: "modo-chip attiva", onclick: function () { scegliAiuto(true); } }, [
        el("span", { class: "mi", text: "💡" }), el("div", {}, [
          el("div", { class: "mt", text: "Con parola simile" }), el("div", { class: "ms", text: "Vicina, ma diversa" })])]);
      bNo = el("button", { class: "modo-chip", onclick: function () { scegliAiuto(false); } }, [
        el("span", { class: "mi", text: "🙈" }), el("div", {}, [
          el("div", { class: "mt", text: "Al buio" }), el("div", { class: "ms", text: "Nessuna parola" })])]);
      box.appendChild(el("div", { class: "modo-griglia" }, [bSi, bNo]));
      box.appendChild(el("p", { class: "modulo-nota",
        text: "Chi inizia viene scelto a caso. L'impostore è sempre uno, sorteggiato tra tutti." }));
    },

    avvia: function (t) {
      var imp = t.impostazioni || {};
      var pool = window.SG_IMPOSTORE || [];
      if (!pool.length) return niente(t);
      var n = t.giocatori.length;
      var impostore = Math.floor(Math.random() * n);
      // chi inizia è a caso, ma l'impostore apre di rado (posizione più difficile):
      // se il sorteggio lo pesca, nel 60% dei casi passo la mano a un altro.
      // Così tocca a lui circa 1 volta su 10 (con 4 giocatori): raro ma capita.
      var iniziante = Math.floor(Math.random() * n);
      if (iniziante === impostore && n > 1 && Math.random() < 0.6) {
        do { iniziante = Math.floor(Math.random() * n); } while (iniziante === impostore);
      }
      var st = {
        g: t.giocatori.map(function (nm) { return { nome: nm, punti: 0, voto: null }; }),
        carta: scegli(pool),
        impostore: impostore,
        suggerimento: imp.suggerimento !== false,
        iniziante: iniziante
      };
      rivela(t, st, 0);
    }
  });

  function niente(t) {
    var s = t.schermata({ icona: "🕵️", titolo: "L'Impostore", indietro: t.esci });
    s._contenuto.appendChild(t.el("p", { text: "Mancano le parole del gioco." }));
    s._piede.appendChild(t.el("button", { class: "btn btn-primario", text: "Ok", onclick: t.esci }));
    t.mostra(s);
  }

  // ---- rivelazione segreta, uno alla volta ----
  function rivela(t, st, i) {
    if (i >= st.g.length) return siComincia(t, st);
    t.passaA(st.g[i].nome, function () { schermataRuolo(t, st, i); });
  }

  function schermataRuolo(t, st, i) {
    var el = t.el;
    var s = t.schermata({ icona: "🕵️", titolo: st.g[i].nome, sotto: "Solo tu puoi guardare" });
    var box = el("div", { style: "flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:12px" });
    s._contenuto.appendChild(box);

    var svelato = false;
    var tocca = el("button", { class: "btn btn-primario", style: "font-size:1.2rem;padding:22px",
      text: "👁️ Tocca per vedere il tuo ruolo" });
    var piede = el("button", { class: "btn btn-primario", text: "Ho capito, nascondi ▶", hidden: "hidden",
      onclick: function () { rivela(t, st, i + 1); } });

    tocca.addEventListener("click", function () {
      if (svelato) return; svelato = true;
      t.svuota(box);
      if (i === st.impostore) {
        box.appendChild(el("div", { style: "font-size:3.2rem", text: "🕵️" }));
        box.appendChild(el("div", { style: "font-size:1.5rem;font-weight:800;color:#ff6b6b", text: "Sei l'IMPOSTORE" }));
        if (st.suggerimento) {
          box.appendChild(el("p", { class: "tenue", text: "La tua parola (occhio: è simile ma diversa)" }));
          box.appendChild(el("div", { style: "font-size:2rem;font-weight:800", text: st.carta.impostore }));
        } else {
          box.appendChild(el("p", { class: "tenue", text: "Non hai una parola. Ascolta gli altri e bleffa!" }));
        }
      } else {
        box.appendChild(el("p", { class: "tenue", text: "La parola è" }));
        box.appendChild(el("div", { style: "font-size:2.4rem;font-weight:800", text: st.carta.reale }));
      }
      tocca.hidden = true; piede.hidden = false;
    });

    box.appendChild(tocca);
    s._piede.appendChild(piede);
    t.mostra(s);
  }

  function siComincia(t, st) {
    var el = t.el;
    var s = t.schermata({ icona: "🎬", titolo: "Si comincia!", sotto: "Tutti hanno visto il proprio ruolo" });
    s._contenuto.appendChild(el("div", { style: "text-align:center;margin:14px 0" }, [
      el("p", { class: "tenue", text: "Inizia" }),
      el("div", { style: "font-size:2.2rem;font-weight:800", text: st.g[st.iniziante].nome }),
      el("p", { class: "modulo-nota", style: "margin-top:16px",
        text: "A turno dite a voce UNA parola legata alla vostra — senza essere troppo espliciti. Poi discutete chi è l'impostore." })
    ]));
    s._piede.appendChild(el("button", { class: "btn btn-primario", text: "Andiamo a votare ▶", onclick: function () { vota(t, st, 0); } }));
    t.mostra(s);
  }

  // ---- votazione: ognuno indica in segreto chi crede sia l'impostore ----
  function vota(t, st, i) {
    if (i >= st.g.length) return esito(t, st);
    t.passaA(st.g[i].nome, function () { schermataVoto(t, st, i); });
  }

  function schermataVoto(t, st, i) {
    var el = t.el;
    var s = t.schermata({ icona: "🗳️", titolo: st.g[i].nome + ", chi è l'impostore?", sotto: "Vota in segreto" });
    var g = el("div", { style: "display:flex;flex-direction:column;gap:8px" });
    st.g.forEach(function (gg, k) {
      if (k === i) return;
      g.appendChild(el("button", { class: "btn btn-fantasma", style: "font-size:1.1rem;padding:14px", text: gg.nome,
        onclick: function () { st.g[i].voto = k; vota(t, st, i + 1); } }));
    });
    s._contenuto.appendChild(g);
    t.mostra(s);
  }

  // ---- esito + punti ----
  function esito(t, st) {
    var el = t.el;
    var conte = st.g.map(function () { return 0; });
    st.g.forEach(function (gg) { if (gg.voto != null) conte[gg.voto]++; });
    var max = Math.max.apply(null, conte);
    var piuVotati = [];
    conte.forEach(function (n, k) { if (n === max && max > 0) piuVotati.push(k); });
    var scoperto = (piuVotati.length === 1 && piuVotati[0] === st.impostore);

    st.g.forEach(function (gg, k) {
      if (k === st.impostore) { gg.punti += scoperto ? 0 : 3; }
      else if (gg.voto === st.impostore) { gg.punti += 2; }
    });

    var s = t.schermata({ icona: scoperto ? "✅" : "🕵️",
      titolo: scoperto ? "Impostore scoperto!" : "L'impostore l'ha fatta franca!" });
    s._contenuto.appendChild(el("div", { style: "text-align:center;margin:8px 0 14px" }, [
      el("p", { class: "tenue", text: "L'impostore era" }),
      el("div", { style: "font-size:1.8rem;font-weight:800", text: "🕵️ " + st.g[st.impostore].nome }),
      el("p", { class: "tenue", style: "margin-top:10px", text: "La parola era" }),
      el("div", { style: "font-size:1.8rem;font-weight:800", text: st.carta.reale }),
      st.suggerimento ? el("p", { class: "tenue", style: "margin-top:8px", text: "(l'impostore aveva: " + st.carta.impostore + ")" }) : null
    ]));
    var lista = el("div");
    st.g.forEach(function (gg) {
      if (gg.voto == null) return;
      lista.appendChild(el("div", { style: "display:flex;justify-content:space-between;padding:6px 10px;border-radius:10px;margin-bottom:5px;background:rgba(255,255,255,.05)" }, [
        el("span", { text: gg.nome + " → " + st.g[gg.voto].nome }),
        el("span", { text: gg.voto === st.impostore ? "✅" : "❌" })
      ]));
    });
    s._contenuto.appendChild(lista);

    s._piede.appendChild(el("button", { class: "btn btn-primario", text: "Vedi la classifica 🏆", onclick: function () {
      var classifica = st.g.slice().sort(function (a, b) { return b.punti - a.punti; })
        .map(function (x) { return { nome: x.nome, punti: x.punti }; });
      t.fine(classifica);
    } }));
    t.mostra(s);
  }
})();

/* =========================================================
   GIOCO — "Nomi, Cose e Città"
   Un telefono solo. Ogni giro esce UNA lettera uguale per
   tutti: a turno ciascuno riempie le categorie con parole
   che iniziano con quella lettera. Poi il gruppo VOTA parola
   per parola: se più della metà dà l'ok vale 10 punti, 5 se
   due hanno scritto la stessa parola, 0 se bocciata o vuota.
   Le categorie stanno in data/ncc-categorie.js; qui il gioco
   aggiunge quelle scritte dai giocatori (salvate sul telefono).
   ========================================================= */
(function () {
  "use strict";

  var LETTERE = "ABCDEFGILMNOPRSTV".split(""); // lettere comode in italiano
  var K_PERSO = "sg_ncc_perso";
  var PUNTI_OK = 10;      // parola valida e unica
  var PUNTI_DOPPIA = 5;   // parola valida ma scritta anche da un altro

  function catPerso() { try { return JSON.parse(localStorage.getItem(K_PERSO)) || []; } catch (e) { return []; } }
  function salvaPerso(a) { try { localStorage.setItem(K_PERSO, JSON.stringify(a)); } catch (e) {} }

  function letteraACaso(escludi) {
    var l;
    do { l = LETTERE[Math.floor(Math.random() * LETTERE.length)]; } while (l === escludi && LETTERE.length > 1);
    return l;
  }
  function norm(s) { return (s || "").trim().toLowerCase(); }

  SG.registra({
    id: "nomicose",
    nome: "Nomi, Cose e Città",
    icona: "✍️",
    descrizione: "Esce una lettera, riempi le categorie con parole che iniziano così, poi votate insieme quali valgono.",
    giocatoriMin: 2,
    giocatoriMax: 10,
    difficolta: 2,   // Media — quanto vale vincerlo nel torneo
    regole: [
      "Ogni giro esce una <b>lettera</b> uguale per tutti: a turno ciascuno riempie le categorie con parole che iniziano con quella lettera.",
      "Poi si <b>vota</b>: per ogni parola gli altri dicono se vale. Ognuno ha il suo tasto e può cambiare idea cliccando di nuovo.",
      "Se <b>più della metà</b> approva la parola vale <b>10 punti</b>; se due hanno scritto la <b>stessa</b> parola valgono <b>5</b> a testa; se è bocciata o vuota, <b>0</b>.",
      "Si gioca un certo numero di giri: alla fine vince chi ha totalizzato più punti."
    ],

    impostazioni: function (box, dove, aiuti) {
      var el = aiuti.el;
      var dati = window.SG_NCC_CATEGORIE || { normali: [], black: [] };
      var scelte = dati.normali.slice(0, 5);
      dove.categorie = scelte;
      dove.secondi = 60;
      dove.round = 2;

      function isScelta(c) { return scelte.indexOf(c) >= 0; }
      function toggle(c, chip) {
        var i = scelte.indexOf(c);
        if (i >= 0) scelte.splice(i, 1); else scelte.push(c);
        chip.className = "cat-chip" + (isScelta(c) ? " attiva" : "");
        aggiornaConta();
      }
      function chipDi(c) {
        var chip = el("button", { class: "cat-chip" + (isScelta(c) ? " attiva" : ""), onclick: function () { toggle(c, chip); } }, [
          el("span", { class: "ci", text: c.emoji }),
          el("span", { text: c.testo }),
          el("span", { class: "spunta", text: "✓" })
        ]);
        return chip;
      }

      var conta = el("p", { class: "modulo-nota" });
      function aggiornaConta() {
        conta.textContent = scelte.length + (scelte.length === 1 ? " categoria scelta" : " categorie scelte")
          + (scelte.length < 3 ? " · scegline almeno 3" : "");
      }

      box.appendChild(el("div", { class: "etichetta", text: "Categorie" }));
      var gN = el("div", { class: "cat-griglia" });
      dati.normali.forEach(function (c) { gN.appendChild(chipDi(c)); });
      box.appendChild(gN);

      if (dati.black && dati.black.length) {
        box.appendChild(el("div", { class: "etichetta", text: "😈 Black humor" }));
        var gB = el("div", { class: "cat-griglia" });
        dati.black.forEach(function (c) { gB.appendChild(chipDi(c)); });
        box.appendChild(gB);
      }

      box.appendChild(el("div", { class: "etichetta", text: "✏️ Le tue categorie" }));
      var gP = el("div", { class: "cat-griglia" });
      box.appendChild(gP);
      function disegnaPerso() {
        while (gP.firstChild) gP.removeChild(gP.firstChild);
        catPerso().forEach(function (c) {
          var riga = el("div", { style: "display:flex;gap:6px;align-items:stretch" });
          riga.appendChild(chipDi(c));
          riga.appendChild(el("button", { class: "togli", text: "×", "aria-label": "Elimina", onclick: function () {
            salvaPerso(catPerso().filter(function (x) { return x.testo !== c.testo; }));
            var i = scelte.indexOf(c); if (i >= 0) scelte.splice(i, 1);
            disegnaPerso(); aggiornaConta();
          } }));
          gP.appendChild(riga);
        });
      }
      catPerso().forEach(function (c) { if (scelte.indexOf(c) < 0) scelte.push(c); });
      disegnaPerso();

      var campo = el("input", { class: "link-campo", type: "text", maxlength: "28", placeholder: "Es. Un supereroe, Una scusa…" });
      var aggiungi = el("button", { class: "btn btn-fantasma", text: "＋ Aggiungi la categoria", onclick: function () {
        var testo = (campo.value || "").trim();
        if (testo.length < 2) return;
        var nuova = { emoji: "✏️", testo: testo };
        var lista = catPerso(); lista.push(nuova); salvaPerso(lista);
        scelte.push(nuova); campo.value = "";
        disegnaPerso(); aggiornaConta();
      } });
      box.appendChild(campo);
      box.appendChild(aggiungi);

      box.appendChild(el("div", { class: "etichetta", text: "Tempo per turno" }));
      var bt = {};
      function scegliSec(v) { dove.secondi = v; [60, 90, 120].forEach(function (x) { bt[x].className = "modo-chip" + (v === x ? " attiva" : ""); }); }
      var gT = el("div", { class: "modo-griglia" });
      [60, 90, 120].forEach(function (v) {
        bt[v] = el("button", { class: "modo-chip" + (v === 60 ? " attiva" : ""), onclick: function () { scegliSec(v); } }, [
          el("div", {}, [ el("div", { class: "mt", text: v + " sec" }) ]) ]);
        gT.appendChild(bt[v]);

    st.textContent = "@keyframes sgScalaPulse{0%,100%{box-shadow:0 0 8px 3px rgba(105,219,124,.55)}50%{box-shadow:0 0 18px 8px rgba(105,219,124,.95)}}.sg-scelto{animation:sgScalaPulse 1s ease-in-out infinite}";
    document.head.appendChild(st);
  }
  function bipScala() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      var ctx = bipScala._c || (bipScala._c = new AC());
      if (ctx.state === "suspended") ctx.resume();
      var o = ctx.createOscillator(), g = ctx.createGain(), n = ctx.currentTime;
      o.type = "triangle"; o.frequency.setValueAtTime(880, n); o.frequency.exponentialRampToValueAtTime(1320, n + 0.08);
      g.gain.setValueAtTime(0.0001, n); g.gain.exponentialRampToValueAtTime(0.25, n + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, n + 0.2);
      o.connect(g); g.connect(ctx.destination); o.start(n); o.stop(n + 0.22);
    } catch (e) {}
  }
  // fa il "bip" solo per chi ha appena scelto (una volta per giocatore, per round)
  function beepNuove(vm) {
    if (beepStato.round !== vm.nRound) { beepStato.round = vm.nRound; beepStato.ids = {}; }
    vm.posti.forEach(function (p) { if (p.chosen && !beepStato.ids[p.id]) { beepStato.ids[p.id] = true; bipScala(); } });
  }

  function postiPubblici(st) {
    return st.posti.map(function (p) { return { id: p.id, nome: p.nome, colore: p.colore, passi: p.passi, bot: p.bot, chosen: p.scelta != null }; });
  }
  function vmScala(st) {
    var vm = { fase: st.fase, codice: st.codice, pronta: st.pronta, nRound: st.nRound, traguardo: TRAGUARDO,
      posti: postiPubblici(st), deadline: st.deadline || 0,
      scelte: null, avanza: null, prev: null, vincitore: st.vincitore };
    if (st.fase === "rivela") { vm.scelte = st.scelte; vm.avanza = st.avanza; vm.prev = st.prev; }
    return vm;
  }
  function vincitoreDi(st) {
    var top = st.posti.slice().sort(function (a, b) { return b.passi - a.passi; })[0];
    return top ? top.nome : "";
  }

  function hostScala(t) {
    if (!(window.SGNet && SGNet.disponibile())) return senzaReteScala(t);
    var st = {
      fase: "lobby", codice: "…", pronta: false, nRound: 0, iniziata: false, vincitore: null,
      posti: [{ id: "host", nome: (t.giocatori && t.giocatori[0]) || "Host", colore: COLORI[0], bot: false, passi: 0, scelta: null }],
      deadline: 0, timer: null
    };
    var rete = SGNet.ospita("scalinata", {
      onCodice: function (c) { st.codice = c; bd(); },
      onConnesso: function () { st.pronta = true; bd(); },
      onAddio: function (id) {
        if (st.fase !== "lobby") return; // a partita iniziata i posti restano
        st.posti = st.posti.filter(function (p) { return p.id !== id; });
        st.posti.forEach(function (p, i) { p.colore = COLORI[i]; });
        bd();
      },
      onMsg: function (id, m) {
        if (!m || !m.t) return;
        if (m.t === "join") {
          if (st.fase === "lobby" && !st.posti.some(function (p) { return p.id === id; }) && st.posti.length < 4)
            st.posti.push({ id: id, nome: String(m.nome || "Amico").slice(0, 16), colore: COLORI[st.posti.length], bot: false, passi: 0, scelta: null });

    function invia() { rete.invia({ t: "vm", vm: vmScala(st) }); }
    function bd() { invia(); disegna(); }

    function comincia() {
      if (st.iniziata || st.fase !== "lobby") return;
      var b = 0;
      while (st.posti.length < 4) { st.posti.push({ id: "bot" + b, nome: NOMI_BOT[b] || ("Bot " + (b + 1)), colore: COLORI[st.posti.length], bot: true, passi: 0, scelta: null }); b++; }
      st.iniziata = true; st.vincitore = null;
      st.posti.forEach(function (p) { p.passi = 0; });
      nuovaScelta();
    }
    function nuovaScelta() {
      st.nRound += 1; st.fase = "scelta"; st.vincitore = null;
      st.posti.forEach(function (p) { p.scelta = null; });
      st.deadline = Date.now() + SECONDI * 1000;
      bd();
      st.posti.forEach(function (p) {
        if (p.bot) setTimeout(function () { registraScelta(p.id, SCELTE[Math.floor(Math.random() * 3)]); }, 700 + Math.floor(Math.random() * 2200));
      });
      if (st.timer) clearTimeout(st.timer);
      st.timer = setTimeout(chiudiScelte, SECONDI * 1000 + 250);
    }
    function registraScelta(id, n) {
      if (st.fase !== "scelta" || SCELTE.indexOf(n) < 0) return;
      var p = null; st.posti.forEach(function (x) { if (x.id === id) p = x; });
      if (!p || p.scelta != null) return;
      p.scelta = n; bd();
      if (st.posti.every(function (x) { return x.scelta != null; })) { if (st.timer) clearTimeout(st.timer); chiudiScelte(); }
    }
    function chiudiScelte() {
      if (st.fase !== "scelta") return;
      if (st.timer) { clearTimeout(st.timer); st.timer = null; }
      st.posti.forEach(function (p) { if (p.scelta == null) p.scelta = SCELTE[Math.floor(Math.random() * 3)]; });
      var scelte = st.posti.map(function (p) { return p.scelta; });
      var conta = {}; scelte.forEach(function (n) { conta[n] = (conta[n] || 0) + 1; });
      st.prev = st.posti.map(function (p) { return p.passi; });
      st.avanza = st.posti.map(function (p, i) { return conta[scelte[i]] === 1; });
      st.scelte = scelte;
      st.posti.forEach(function (p, i) { if (st.avanza[i]) p.passi = Math.min(TRAGUARDO, p.passi + scelte[i]); });
      st.fase = "rivela"; bd();
    }
    function prossimo() {
      if (st.fase !== "rivela") return;
      if (st.posti.some(function (p) { return p.passi >= TRAGUARDO; })) { st.fase = "fine"; st.vincitore = vincitoreDi(st); bd(); }
      else nuovaScelta();
    }
    function nuova() {
      if (st.timer) { clearTimeout(st.timer); st.timer = null; }
      st.iniziata = false; st.fase = "lobby"; st.nRound = 0; st.vincitore = null;
      st.posti = st.posti.filter(function (p) { return !p.bot; });
      st.posti.forEach(function (p, i) { p.passi = 0; p.scelta = null; p.colore = COLORI[i]; });
      bd();
    }
    var cb = {
      sonoHost: true, myId: "host",
      onScegli: function (n) { registraScelta("host", n); },
      onComincia: comincia, onProssimo: prossimo, onNuova: nuova,
      onEsci: function () { if (st.timer) clearTimeout(st.timer); rete.chiudi(); t.esci(); }
    };

  }

  function ospiteScala(t, codice) {
    if (!(window.SGNet && SGNet.disponibile())) return senzaReteScala(t);
    var el = t.el, S = { myId: null, vm: null, rete: null, nome: "", msg: null };
    var cb = {
      sonoHost: false, myId: null,
      onScegli: function (n) { S.rete && S.rete.invia({ t: "scegli", n: n }); },

    };
    function disegna() { if (S.vm) { cb.myId = S.myId; disegnaScalaVM(t, S.vm, cb); } }
    schermaNome();
    function schermaNome() {
      var s = t.schermata({ icona: "🪜", titolo: "Entra nella Scalinata", sotto: "Stanza " + codice.toUpperCase(), indietro: t.esci });
      var input = el("input", { type: "text", placeholder: "Il tuo nome", maxlength: "16", class: "link-campo" });
      S.msg = el("div", { class: "link-avviso" });
      s._contenuto.appendChild(input); s._contenuto.appendChild(S.msg);
      s._piede.appendChild(el("button", { class: "btn btn-primario", text: "Entra ▶", onclick: function () {
        S.nome = (input.value || "Amico").trim() || "Amico"; S.msg.textContent = "Collegamento in corso…"; collega();
      } }));

    function collega() {

          setTimeout(function () { if (!S.vm && S.msg) S.msg.textContent = "Non trovo la partita. Controlla il codice, o l'host non ha ancora aperto la stanza…"; }, 8000); },
        onMsg: function (m) { if (m && m.t === "vm") { S.vm = m.vm; disegna(); } },
        onChiuso: function () { erroreScala(t, "Collegamento perso. L'host potrebbe aver chiuso la partita."); },

      });
    }
  }

  function erroreScala(t, txt) {
    var s = t.schermata({ icona: "⚠️", titolo: "Ops" });
    s._contenuto.appendChild(t.el("p", { text: txt, style: "font-size:1.05rem;line-height:1.5" }));
    s._piede.appendChild(t.el("button", { class: "btn btn-primario", text: "🏠 Torna all'inizio", onclick: t.esci }));

  function rigaGiocatoreScala(el, p, sonoIo) {

      el("span", { style: "width:16px;height:16px;border-radius:50%;background:" + p.colore }),
      el("span", { style: "flex:1", text: (p.bot ? "🤖 " : "") + p.nome + (sonoIo ? " (tu)" : "") }),

  function disegnaScalaVM(t, vm, cb) {

      var s = t.schermata({ icona: "🪜", titolo: "La Scalinata · Lobby", sotto: "Ognuno dal suo telefono",

      if (cb.sonoHost) {
        s._contenuto.appendChild(el("div", { class: "etichetta", text: "Codice della stanza" }));
        s._contenuto.appendChild(el("div", { class: "codice-stanza", text: (vm.codice || "…").toUpperCase() }));

          s._contenuto.appendChild(el("button", { class: "btn btn-fantasma", html: "🔗 Copia il link da mandare",
            onclick: function () { campo.focus(); campo.select(); try { navigator.clipboard.writeText(link); } catch (e) {} } }));
          s._contenuto.appendChild(campo);

          text: vm.pronta ? "🟢 Stanza pronta — manda il codice agli amici" : "🟡 Sto aprendo la stanza… (attendi il verde)" }));
      }

      var liberi = 4 - vm.posti.length;
      for (var bi = 0; bi < liberi; bi++) {
        s._contenuto.appendChild(el("div", { style: "display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;margin-bottom:6px;background:rgba(255,255,255,.03);opacity:.6" }, [
          el("span", { style: "width:16px;height:16px;border-radius:50%;background:" + COLORI[vm.posti.length + bi] }),

    if (vm.fase === "fine") {

      if (cb.sonoHost) {

        var av = el("button", { class: "btn btn-primario", text: finito ? "Vedi il podio 🏆" : "Prossimo round ▶", onclick: cb.onProssimo });

    // ---- scelta ----
    // Aggiornamento IN-PLACE: se stiamo già mostrando la scelta di questo round,
    // non ridisegniamo nulla (niente sfarfallio): illuminiamo solo il pallino di
    // chi ha appena scelto, facciamo il bip e togliamo i miei tasti se ho scelto.
    if (scenaScelta && scenaScelta.round === vm.nRound && document.body.contains(scenaScelta.root)) {
      beepNuove(vm);
      vm.posti.forEach(function (p, i) { var d = scenaScelta.dots[i]; if (d) d.className = p.chosen ? "sg-scelto" : ""; });
      if (mio && mio.chosen && scenaScelta.btnWrap && scenaScelta.btnWrap.parentNode) {
        scenaScelta.btnWrap.parentNode.removeChild(scenaScelta.btnWrap);
        scenaScelta.btnWrap = null;
        if (scenaScelta.attesa) scenaScelta.attesa.hidden = false;
      }
      return;
    }

    // costruzione della schermata (una volta per round)
    beepNuove(vm);
    var s = t.schermata({ icona: "🪜", titolo: "Round " + vm.nRound, sotto: "Verso il gradino " + vm.traguardo,
      indietro: function () { if (window.confirm("Uscire dalla partita?")) cb.onEsci(); } });
    var outDots = [];
    s._contenuto.appendChild(disegnaScala(t, gioc, null, null, null, outDots));
    vm.posti.forEach(function (p, i) { if (p.chosen && outDots[i]) outDots[i].className = "sg-scelto"; });

    var timerBox = el("div", { style: "text-align:center;font-size:1.9rem;font-weight:800;margin:6px 0 2px" });
    function tick() { timerBox.textContent = Math.max(0, Math.ceil((vm.deadline - Date.now()) / 1000)); }
    tick();
    var itv = setInterval(function () { if (!document.body.contains(timerBox)) return clearInterval(itv); tick(); }, 300);
    s._contenuto.appendChild(timerBox);

    var attesa = el("p", { class: "modulo-nota", style: "text-align:center", text: "Hai scelto! Il tuo pallino è acceso, aspetta gli altri…", hidden: "hidden" });
    var btnWrap = null;
    if (mio && !mio.bot && !mio.chosen) {

      SCELTE.forEach(function (n) {
        btnWrap.appendChild(el("button", { style: "flex:1;max-width:130px;padding:22px 0;border-radius:18px;border:0;cursor:pointer;color:#08210f;font-weight:800;background:" + coloreScelta(n) + ";box-shadow:0 4px 10px rgba(0,0,0,.3)", onclick: function () { cb.onScegli(n); } }, [
          el("div", { style: "font-size:2.4rem;line-height:1", text: String(n) }),
          el("div", { style: "font-size:.8rem;font-weight:700;opacity:.8", text: n === 1 ? "gradino" : "gradini" })
        ]));
      });
      s._contenuto.appendChild(btnWrap);
    } else if (mio && mio.chosen) {
      attesa.hidden = false;
    }
    s._contenuto.appendChild(attesa);

    scenaScelta = { round: vm.nRound, root: s._contenuto, dots: outDots, btnWrap: btnWrap, attesa: attesa };
    t.mostra(s);
  }

  function finePartita(t, st) {
    var classifica = st.g.slice()
      .sort(function (a, b) { return b.passi - a.passi; })
      .map(function (g) { return { nome: g.nome, punti: g.passi + "🪜" }; });
    t.fine(classifica);
  }
})();

/* =========================================================
   GIOCO — "Sì... però"
   Un telefono solo. A ogni round uno dei giocatori fa da
   GIUDICE (a rotazione) e gli altri si dividono in due
   SQUADRE che si sfidano. Bastano 3 giocatori (giudice + 1 vs 1).
   La sequenza delle fasi è configurabile dall'host:
     - CLASSICA (default): Paradiso (2 Bonus su di sé) → Schianto
       (2 Malus agli avversari) → Rinforzo (un altro Bonus su di sé)
       → Ghigliottina (2 Malus agli avversari).
     - PERSONALIZZATA: l'host compone le fasi (tipo, quante, bersaglio).
   La mano si ricarica sempre fino a 7 Bonus e 7 Malus.
   I punti sono personali: chi è nella squadra vincente prende +1.
   Carte in data/sipero-carte.js.

(function () {
  "use strict";

  var MAX_MANO = 7;

    { tipo: "bonus", n: 2, bers: "se" },
    { tipo: "malus", n: 2, bers: "avv" },
    { tipo: "bonus", n: 1, bers: "se" },
    { tipo: "malus", n: 2, bers: "avv" }
  ];

  function altra(k) { return k === 0 ? 1 : 0; }
  function taglia(s) { return s.length > 34 ? s.slice(0, 32) + "…" : s; }
  function descriviFase(f) {
    return (f.tipo === "bonus" ? "Bonus" : "Malus") + " ×" + f.n + " " + (f.bers === "se" ? "su di sé" : "agli avversari");
  }
  function ricarica(t, manoArr, mazzo, max) {
    var m = t.mischia(mazzo);
    for (var i = 0; i < m.length && manoArr.length < max; i++) if (manoArr.indexOf(m[i]) < 0) manoArr.push(m[i]);
    return manoArr;
  }

  SG.registra({
    id: "sipero",
    nome: "Sì... però",
    icona: "🤨",
    descrizione: "Due squadre costruiscono lo scenario di vita migliore e si sabotano a colpi di Malus. Il giudice decide chi vince.",
    giocatoriMin: 3,
    giocatoriMax: 10,
    difficolta: 2,
    regole: [
      "A ogni round uno di voi fa da <b>giudice</b> (a rotazione) e gli altri si dividono in <b>due squadre</b>. Bastano 3 giocatori.",
      "Nella modalità classica: <b>Paradiso</b> (2 Bonus su di sé), <b>Schianto</b> (2 Malus agli avversari), <b>Rinforzo</b> (un altro Bonus su di sé), <b>Ghigliottina</b> (2 Malus finali). L'host può anche <b>comporre le fasi a piacere</b>.",
      "Poi ogni squadra convince a voce il giudice che il suo scenario, per quanto devastato, è il migliore da vivere. Nessun limite di tempo.",
      "Il giudice sceglie la squadra vincente: chi ne fa parte prende un punto. Dopo tutti i round, vince chi ha più punti."
    ],

    impostazioni: function (box, dove, aiuti) {
      var el = aiuti.el;
      dove.modo = "telefono";
      dove.modalita = "classica";

      }
      function chipRow(label, valori, get, set) {
        pannello.appendChild(el("div", { class: "etichetta", style: "margin:6px 0 4px", text: label }));
        var row = el("div", { class: "modo-griglia" });

          } }, [el("div", {}, [el("div", { class: "mt", text: v.txt })])]);

      }
      chipRow("Tipo di carta", [{ val: "bonus", txt: "Bonus" }, { val: "malus", txt: "Malus" }], function () { return nuovo.tipo; }, function (v) { nuovo.tipo = v; });
      chipRow("Quante carte", [{ val: 1, txt: "1" }, { val: 2, txt: "2" }, { val: 3, txt: "3" }], function () { return nuovo.n; }, function (v) { nuovo.n = v; });
      chipRow("Bersaglio", [{ val: "se", txt: "Su di sé" }, { val: "avv", txt: "Avversari" }], function () { return nuovo.bers; }, function (v) { nuovo.bers = v; });
      pannello.appendChild(el("button", { class: "btn btn-fantasma", style: "margin-top:8px", text: "＋ Aggiungi questa fase", onclick: function () {
        dove.sequenza.push({ tipo: nuovo.tipo, n: nuovo.n, bers: nuovo.bers }); ridisegnaFasi();

      boxRegole.appendChild(el("div", { class: "etichetta", text: "Quanti round" }));
      var br = {};
      function scegliR(v) { dove.round = v; [4, 6, 8].forEach(function (x) { br[x].className = "modo-chip" + (v === x ? " attiva" : ""); }); }
      var gr = el("div", { class: "modo-griglia" });
      [4, 6, 8].forEach(function (v) {
        br[v] = el("button", { class: "modo-chip" + (v === 6 ? " attiva" : ""), onclick: function () { scegliR(v); } }, [el("div", {}, [el("div", { class: "mt", text: v + " round" })])]);
        gr.appendChild(br[v]);
      });

      boxRegole.appendChild(el("p", { class: "modulo-nota", text: "A ogni round uno fa da giudice (a rotazione) e gli altri si dividono in due squadre. Da 3 giocatori in su." }));

    },

    avvia: function (t) {
      var dati = window.SG_SIPERO || { bonus: [], malus: [] };
      if (dati.bonus.length < 2 || dati.malus.length < 2) return niente(t);
      var imp = t.impostazioni || {};
      var seq = (imp.modalita === "custom" && imp.sequenza && imp.sequenza.length) ? imp.sequenza : CLASSICA;
      if (t.linkParams && t.linkParams.stanza) return ospiteSipero(t, t.linkParams.stanza);
      if (imp.modo === "online") return hostSipero(t, seq);
      var punti = {}; t.giocatori.forEach(function (n) { punti[n] = 0; });
      var st = {
        giocatori: t.giocatori.slice(), punti: punti,
        bonus: dati.bonus, malus: dati.malus, sequenza: seq,
        round: 0, totale: imp.round || 6
      };
      iniziaRound(t, st);
    }
  });

  function niente(t) {
    var s = t.schermata({ icona: "🤨", titolo: "Sì... però", indietro: t.esci });
    s._contenuto.appendChild(t.el("p", { text: "Mancano le carte del gioco." }));
    s._piede.appendChild(t.el("button", { class: "btn btn-primario", text: "Ok", onclick: t.esci }));
    t.mostra(s);
  }

  function iniziaRound(t, st) {
    st.round += 1;
    if (st.round > st.totale) return finePartita(t, st);
    var n = st.giocatori.length;
    var gi = (st.round - 1) % n;
    st.giudice = st.giocatori[gi];
    var altri = [];
    for (var d = 1; d < n; d++) altri.push(st.giocatori[(gi + d) % n]);
    var h = Math.ceil(altri.length / 2);
    st.squadre = [
      { nome: "Squadra 1", membri: altri.slice(0, h) },
      { nome: "Squadra 2", membri: altri.slice(h) }
    ];
    st.scen = [{ bonus: [], malusRic: [], cerotto: null }, { bonus: [], malusRic: [], cerotto: null }];
    st.mani = [
      { bonus: ricarica(t, [], st.bonus, MAX_MANO), malus: ricarica(t, [], st.malus, MAX_MANO) },
      { bonus: ricarica(t, [], st.bonus, MAX_MANO), malus: ricarica(t, [], st.malus, MAX_MANO) }
    ];
    st.steps = [];
    st.sequenza.forEach(function (f) { st.steps.push({ sq: 0, f: f }); st.steps.push({ sq: 1, f: f }); });
    st.stepIdx = 0;

    var el = t.el;
    var s = t.schermata({ icona: "🥊", titolo: "Round " + st.round + " di " + st.totale, sotto: "Giudice: " + st.giudice });
    s._contenuto.appendChild(el("div", { style: "text-align:center;margin:12px 0" }, [
      el("div", { style: "font-size:1.15rem;font-weight:800", text: "🟥 " + membriTxt(st.squadre[0]) }),
      el("div", { style: "margin:6px 0", text: "contro" }),
      el("div", { style: "font-size:1.15rem;font-weight:800", text: "🟦 " + membriTxt(st.squadre[1]) }),
      el("p", { class: "modulo-nota", style: "margin-top:14px", text: "Passatevi il telefono a turno, senza far vedere le scelte all'altra squadra." })
    ]));
    s._piede.appendChild(el("button", { class: "btn btn-primario", text: "Via ▶", onclick: function () { prossimoStep(t, st); } }));
    t.mostra(s);
  }

  function membriTxt(sq) { return sq.nome + " (" + sq.membri.join(", ") + ")"; }

  function prossimoStep(t, st) {
    if (st.stepIdx >= st.steps.length) return rivelazione(t, st);
    var step = st.steps[st.stepIdx];
    t.passaA(membriTxt(st.squadre[step.sq]), function () { schermataFase(t, st, step); });
  }

  function schermataFase(t, st, step) {
    var f = step.f, sq = step.sq;
    var target = (f.bers === "se") ? sq : altra(sq);
    var manoTipo = st.mani[sq][f.tipo];
    var etichetta = (f.tipo === "bonus" ? "Bonus" : "Malus") + " ×" + f.n + " " + (f.bers === "se" ? "sul VOSTRO scenario" : "a " + st.squadre[altra(sq)].nome);
    scegliCarte(t, {
      titolo: st.squadre[sq].nome, sotto: etichetta, carte: manoTipo, quante: f.n, tipo: f.tipo
    }, function (scelte) {
      var dest = (f.tipo === "bonus") ? st.scen[target].bonus : st.scen[target].malusRic;
      scelte.forEach(function (c) { dest.push(c); });
      st.mani[sq][f.tipo] = manoTipo.filter(function (c) { return scelte.indexOf(c) < 0; });
      ricarica(t, st.mani[sq][f.tipo], f.tipo === "bonus" ? st.bonus : st.malus, MAX_MANO);
      st.stepIdx += 1; prossimoStep(t, st);
    });
  }

  function scegliCarte(t, opts, onOk) {
    var el = t.el;
    var s = t.schermata({ icona: "🃏", titolo: opts.titolo, sotto: opts.sotto });
    var sel = [];
    var conferma = el("button", { class: "btn btn-primario", text: "Conferma ▶", disabled: "disabled",
      onclick: function () { if (sel.length === opts.quante) onOk(sel.slice()); } });
    var lista = el("div", { style: "display:flex;flex-direction:column;gap:8px" });
    opts.carte.forEach(function (c) {
      var attiva = false;
      var b = el("button", { style: cardStyle(false, opts.tipo), html: c });
      b.addEventListener("click", function () {
        if (attiva) { attiva = false; sel = sel.filter(function (x) { return x !== c; }); }
        else { if (sel.length >= opts.quante) return; attiva = true; sel.push(c); }
        b.setAttribute("style", cardStyle(attiva, opts.tipo));
        if (sel.length === opts.quante) conferma.removeAttribute("disabled"); else conferma.setAttribute("disabled", "disabled");
      });
      lista.appendChild(b);
    });
    s._contenuto.appendChild(el("p", { class: "modulo-nota", text: "Seleziona " + opts.quante + (opts.quante === 1 ? " carta" : " carte") }));
    s._contenuto.appendChild(lista);
    s._piede.appendChild(conferma);
    t.mostra(s);
  }

  function cardStyle(attiva, tipo) {
    var base = "width:100%;text-align:left;padding:12px 14px;border-radius:12px;font-size:1rem;line-height:1.35;cursor:pointer;border:2px solid transparent;color:#fff;";
    var col = tipo === "malus" ? "rgba(255,80,80,.16)" : "rgba(80,220,120,.16)";
    var bord = tipo === "malus" ? "#ff6b6b" : "#2ecc71";
    return base + "background:" + col + ";" + (attiva ? "border-color:" + bord + ";font-weight:600;" : "");
  }

  function rivelazione(t, st) {
    var el = t.el;
    var s = t.schermata({ icona: "🎭", titolo: "Gli scenari", sotto: "Ora l'arringa, poi il giudice decide" });
    st.squadre.forEach(function (sq, k) {
      var box = el("div", { style: "margin-bottom:14px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.05)" });
      box.appendChild(el("div", { class: "etichetta", style: "margin:0 0 6px", text: (k === 0 ? "🟥 " : "🟦 ") + membriTxt(sq) }));
      st.scen[k].bonus.forEach(function (c) {
        box.appendChild(el("div", { style: "padding:6px 8px;border-radius:8px;margin-bottom:4px;background:rgba(80,220,120,.14)", html: "✅ " + c }));
      });
      st.scen[k].malusRic.forEach(function (c) {
        box.appendChild(el("div", { style: "padding:6px 8px;border-radius:8px;margin-bottom:4px;background:rgba(255,80,80,.14)", html: "❌ " + c }));
      });
      s._contenuto.appendChild(box);
    });
    s._piede.appendChild(el("button", { class: "btn btn-primario", text: "All'arringa ▶", onclick: function () { arringa(t, st, 0); } }));
    t.mostra(s);
  }

  function arringa(t, st, k) {
    if (k >= st.squadre.length) return giudizio(t, st);
    var el = t.el;
    var s = t.schermata({ icona: "🎤", titolo: st.squadre[k].nome + ", convincete il giudice", sotto: "Prendetevi il tempo che volete" });
    s._contenuto.appendChild(el("div", { style: "text-align:center;font-size:2.8rem;margin:14px 0", text: (k === 0 ? "🟥" : "🟦") }));
    s._contenuto.appendChild(el("p", { class: "modulo-nota", text: "Spiegate a voce al giudice perché il vostro scenario, pur devastato, è il migliore da vivere. Nessuna fretta." }));
    s._piede.appendChild(el("button", { class: "btn btn-primario", text: (k === 0 ? "Tocca all'altra squadra ▶" : "Al giudizio ▶"), onclick: function () { arringa(t, st, k + 1); } }));
    t.mostra(s);
  }

  function giudizio(t, st) {
    t.passaA(st.giudice, function () {
      var el = t.el;
      var s = t.schermata({ icona: "⚖️", titolo: "Giudice " + st.giudice, sotto: "Quale scenario è il migliore da vivere?" });
      var g = el("div", { style: "display:flex;flex-direction:column;gap:10px" });
      st.squadre.forEach(function (sq, k) {
        g.appendChild(el("button", { class: "btn btn-fantasma", style: "font-size:1.1rem;padding:16px;text-align:left", html: (k === 0 ? "🟥 " : "🟦 ") + membriTxt(sq),
          onclick: function () { sq.membri.forEach(function (m) { st.punti[m] = (st.punti[m] || 0) + 1; }); esitoRound(t, st, k); } }));
      });
      s._contenuto.appendChild(g);
      t.mostra(s);
    });
  }

  function esitoRound(t, st, vincitore) {
    var el = t.el;
    var s = t.schermata({ icona: "🏅", titolo: "Round a " + st.squadre[vincitore].nome + "!", sotto: membriTxt(st.squadre[vincitore]) });
    var ordine = st.giocatori.slice().sort(function (a, b) { return (st.punti[b] || 0) - (st.punti[a] || 0); });
    var ol = el("ol", { class: "classifica" });
    ordine.forEach(function (nome, i) {
      ol.appendChild(el("li", { class: i === 0 ? "vincitore" : "" }, [
        el("span", { class: "pos", text: (i + 1) + "°" }),
        el("span", { class: "nome", text: nome }),
        el("span", { class: "punti", text: st.punti[nome] || 0 })
      ]));
    });
    s._contenuto.appendChild(ol);
    var ultimo = st.round >= st.totale;
    s._piede.appendChild(el("button", { class: "btn btn-primario", text: ultimo ? "Classifica finale 🏆" : "Prossimo round ▶",
      onclick: function () { if (ultimo) finePartita(t, st); else iniziaRound(t, st); } }));
    t.mostra(s);
  }

  function finePartita(t, st) {
    var classifica = st.giocatori.slice()
      .sort(function (a, b) { return (st.punti[b] || 0) - (st.punti[a] || 0); })
      .map(function (nome) { return { nome: nome, punti: st.punti[nome] || 0 }; });
    t.fine(classifica);
  }

  // =========================================================
  //  ONLINE — ognuno dal suo telefono (host-authoritative).
  //  Giudice e squadre FISSI, scelti in lobby dall'host.
  //  Il tavolo (i due scenari) è sempre visibile a tutti; la
  //  propria mano di carte è visibile solo alla propria squadra.
  // =========================================================
  function squadreDa(giocatori, assegna) {
    var sq = [{ membri: [] }, { membri: [] }];
    giocatori.forEach(function (g) { var a = assegna[g.id]; if (a === 0 || a === 1) sq[a].membri.push({ id: g.id, nome: g.nome }); });
    return sq;
  }
  function giudiceDa(giocatori, assegna) {
    for (var i = 0; i < giocatori.length; i++) if (assegna[giocatori[i].id] === "g") return giocatori[i];
    return null;
  }
  function squadraDiId(assegna, id) { var a = assegna[id]; return (a === 0 || a === 1) ? a : -1; }
  function perIdS(st, id) { return st.giocatori.some(function (x) { return x.id === id; }); }

  function vmSipero(st) {
    var g = giudiceDa(st.giocatori, st.assegna);
    var vm = {
      fase: st.fase, codice: st.codice,
      giocatori: st.giocatori.map(function (x) { return { id: x.id, nome: x.nome }; }),
      assegna: st.assegna, giudiceId: g ? g.id : null, giudiceNome: g ? g.nome : "",
      squadre: squadreDa(st.giocatori, st.assegna),
      scen: st.scen, mani: st.mani || null, vincitore: st.vincitore, step: null,
      regoleModalita: st.regoleModalita, seqCustom: st.seqCustom
    };
    if (st.fase === "gioco" && st.steps && st.stepIdx < st.steps.length) {
      var s = st.steps[st.stepIdx];
      vm.step = { sq: s.sq, tipo: s.f.tipo, n: s.f.n, bers: s.f.bers, i: st.stepIdx + 1, tot: st.steps.length };
    }
    return vm;
  }

  function hostSipero(t, seq) {
    if (!(window.SGNet && SGNet.disponibile())) return senzaReteS(t);
    var st = {
      fase: "lobby", codice: "…", iniziata: false,
      giocatori: [{ id: "host", nome: (t.giocatori && t.giocatori[0]) || "Host" }],
      assegna: {}, seq: seq, vincitore: null,
      regoleModalita: "classica", seqCustom: [],
      scen: [{ bonus: [], malusRic: [] }, { bonus: [], malusRic: [] }],
      mani: null, steps: [], stepIdx: 0,
      bonus: (window.SG_SIPERO || {}).bonus || [], malus: (window.SG_SIPERO || {}).malus || []
    };
    var rete = SGNet.ospita("sipero", {
      onCodice: function (c) { st.codice = c; bd(); },
      onConnesso: function () { st.pronta = true; bd(); },
      onAddio: function (id) {
        st.giocatori = st.giocatori.filter(function (x) { return x.id !== id; });
        delete st.assegna[id];
        if (st.giocatori.length === 0) { rete.chiudi(); return t.esci(); }
        bd();
      },
      onMsg: function (id, m) {
        if (!m || !m.t) return;
        if (m.t === "join") { if (!perIdS(st, id) && st.giocatori.length < 10) st.giocatori.push({ id: id, nome: String(m.nome || "Amico").slice(0, 16) }); bd(); }
        else if (m.t === "gioca") giocaCarte(id, m.carte);
        else if (m.t === "giudica") giudica(id, m.sq);
        else if (m.t === "avanti") avanti(id);
      },
      onErrore: function () { senzaReteS(t); }
    });
    function invia() { rete.invia({ t: "vm", vm: vmSipero(st) }); }
    function bd() { invia(); disegna(); }

    function comincia() {
      if (st.iniziata) return;
      var sq = squadreDa(st.giocatori, st.assegna), g = giudiceDa(st.giocatori, st.assegna);
      var tutti = st.giocatori.every(function (x) { var a = st.assegna[x.id]; return a === 0 || a === 1 || a === "g"; });
      if (!g || !sq[0].membri.length || !sq[1].membri.length || !tutti) return;
      st.iniziata = true; st.fase = "gioco"; st.vincitore = null;
      st.scen = [{ bonus: [], malusRic: [] }, { bonus: [], malusRic: [] }];
      st.mani = [
        { bonus: ricarica(t, [], st.bonus, MAX_MANO), malus: ricarica(t, [], st.malus, MAX_MANO) },
        { bonus: ricarica(t, [], st.bonus, MAX_MANO), malus: ricarica(t, [], st.malus, MAX_MANO) }
      ];
      var seqScelta = (st.regoleModalita === "custom" && st.seqCustom.length) ? st.seqCustom : CLASSICA;
      st.steps = []; seqScelta.forEach(function (f) { st.steps.push({ sq: 0, f: f }); st.steps.push({ sq: 1, f: f }); });
      st.stepIdx = 0; bd();
    }
    function regoleMod(m) { if (st.fase === "lobby") { st.regoleModalita = m; disegna(); } }
    function regoleAdd(f) { if (st.fase === "lobby") { st.seqCustom.push(f); disegna(); } }
    function regoleDel(i) { if (st.fase === "lobby") { st.seqCustom.splice(i, 1); disegna(); } }
    function giocaCarte(id, carte) {
      if (st.fase !== "gioco" || st.stepIdx >= st.steps.length) return;
      var step = st.steps[st.stepIdx];
      if (squadraDiId(st.assegna, id) !== step.sq) return;
      if (!Array.isArray(carte) || carte.length !== step.f.n) return;
      var mano = st.mani[step.sq][step.f.tipo];
      for (var i = 0; i < carte.length; i++) if (mano.indexOf(carte[i]) < 0) return;
      var target = (step.f.bers === "se") ? step.sq : altra(step.sq);
      var dest = (step.f.tipo === "bonus") ? st.scen[target].bonus : st.scen[target].malusRic;
      carte.forEach(function (c) { dest.push(c); });
      st.mani[step.sq][step.f.tipo] = mano.filter(function (c) { return carte.indexOf(c) < 0; });
      ricarica(t, st.mani[step.sq][step.f.tipo], step.f.tipo === "bonus" ? st.bonus : st.malus, MAX_MANO);
      st.stepIdx += 1;
      if (st.stepIdx >= st.steps.length) st.fase = "arringa";
      bd();
    }
    function avanti(id) {
      var g = giudiceDa(st.giocatori, st.assegna);
      if (st.fase === "arringa" && (id === "host" || (g && id === g.id))) { st.fase = "giudizio"; bd(); }
    }
    function giudica(id, sq) {
      var g = giudiceDa(st.giocatori, st.assegna);
      if (st.fase === "giudizio" && g && id === g.id && (sq === 0 || sq === 1)) { st.vincitore = sq; st.fase = "fine"; bd(); }
    }
    function nuova() {
      st.fase = "lobby"; st.iniziata = false; st.vincitore = null;
      st.scen = [{ bonus: [], malusRic: [] }, { bonus: [], malusRic: [] }];
      st.mani = null; st.steps = []; st.stepIdx = 0; bd();
    }
    var cb = {
      sonoHost: true, myId: "host",
      onAssegna: function (pid, val) { if (st.fase === "lobby") { st.assegna[pid] = val; bd(); } },
      onRegoleMod: regoleMod, onRegoleAdd: regoleAdd, onRegoleDel: regoleDel,
      onComincia: comincia,
      onGioca: function (carte) { giocaCarte("host", carte); },
      onGiudica: function (sq) { giudica("host", sq); },
      onAvanti: function () { avanti("host"); },
      onNuova: nuova,
      onEsci: function () { rete.chiudi(); t.esci(); }
    };
    function disegna() { disegnaSiperoVM(t, vmSipero(st), cb); }
    disegna();
  }

  // --- Suoni + vibrazione ---
  var AC = null;
  function ctx() { try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === "suspended") AC.resume(); } catch (e) {} return AC; }
  function beep(freqs, dur, tipo) {
    var c = ctx(); if (!c) return;

      g.gain.exponentialRampToValueAtTime(0.25, s + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, s + dur);
      o.connect(g); g.connect(c.destination); o.start(s); o.stop(s + dur);

    turno: function () { beep([880, 1180], 0.12, "sine"); vibra(120); },
    voto: function () { beep([520], 0.1, "square"); vibra(30); },
    tic: function () { beep([1200], 0.05, "sine"); },

  function ordina(linea) { linea.sort(function (a, b) { return a.anno - b.anno; }); }

  var gioco = {

  // =========================================================
  //  MODALITÀ "UN TELEFONO SOLO"
  // =========================================================
  function partenzaTelefono(t) {
    var mazzo = mischiaArr(pescaDati(t.impostazioni));
    var carte = (t.impostazioni && t.impostazioni.carte) || 5;
    var stato = {
      mazzo: mazzo, linea: [mazzo.pop()], turno: 0, carta: null, _stop: null,
      giocatori: t.giocatori.map(function (n) { return { nome: n, restano: carte, punti: 0 }; })
    };
    ordina(stato.linea);
    var uno = stato.giocatori.length === 1;

  function turnoTel(t, stato) {
    if (attivi(stato) === 0 || stato.mazzo.length === 0) return fineTel(t, stato);
    saltaFiniti(stato);
    stato.carta = stato.mazzo.pop();
    stato.giocatori.forEach(function (x) { delete x._voto; });
    var el = t.el, g = stato.giocatori[stato.turno % stato.giocatori.length];
    g._me = true;

      indietro: function () { if (window.confirm("Uscire dalla partita?")) t.esci(); } });
    s._contenuto.appendChild(nodoTop(el, stato.giocatori, g.nome));

    stato._stop = function () { if (bar._stop) bar._stop(); };

    s._contenuto.appendChild(nodoCartaMano(el, stato.carta, "Dove va?"));

  function gapTel(t, stato, i, bar) {

  function scegliTel(t, stato, gap, bar) {

    votaTel(t, stato, gap, votanti, 0);

  function schermoVotoTel(t, stato, gap, votanti, j) {

    s._contenuto.appendChild(nodoCartaMano(el, carta, "È giusto qui?"));
    var linea = el("div", { class: "tl-linea" });
    stato.linea.forEach(function (ev, i) {
      if (i === gap) linea.appendChild(nodoEvento(el, { anno: 0, titolo: carta.titolo, fatto: carta.fatto }, true));
      linea.appendChild(nodoEvento(el, ev));
    });
    if (gap >= stato.linea.length) linea.appendChild(nodoEvento(el, { anno: 0, titolo: carta.titolo, fatto: carta.fatto }, true));
    s._contenuto.appendChild(linea);
    s._piede.appendChild(el("div", { class: "tl-vota" }, [
      el("button", { class: "btn btn-verde", text: "👍 D'accordo", onclick: function () { FX.voto(); v._voto = true; votaTel(t, stato, gap, votanti, j + 1); } }),
      el("button", { class: "btn btn-rosso", text: "👎 No", onclick: function () { FX.voto(); v._voto = false; votaTel(t, stato, gap, votanti, j + 1); } })
    ]));

  }
  function risolviTel(t, stato, gap) {
    var carta = stato.carta, g = stato.giocatori[stato.turno % stato.giocatori.length];
    var ok = gap != null && gapGiusto(stato.linea, gap, carta.anno);
    // punti ai votanti (±50) a seconda se hanno indovinato o no
    var votiEsito = [];
    stato.giocatori.forEach(function (x) {

  function esitoTel(t, stato, ok, appenaFinito, scaduto, votiEsito) {
    var el = t.el, carta = stato.carta, g = stato.giocatori[stato.turno % stato.giocatori.length];

    var box = el("div", { class: "tl-esito" }, [

      el("div", { class: "verdetto " + (ok ? "giusto" : "sbagliato"), text: scaduto ? "Tempo scaduto!" : (ok ? "Esatto!" : "Sbagliato") }),
      ok ? el("div", { class: "annone", text: annoTesto(carta.anno) }) : el("div", { class: "titoletto tenue", text: "La data resta un mistero…" }),
      el("div", { class: "titoletto", text: carta.titolo }),
      el("div", { class: "delta " + (ok ? "su" : "giu"), text: (ok ? "+" : "−") + PUNTI + " a " + g.nome }),
      appenaFinito ? el("div", { class: "tl-finito", text: "🎉 " + g.nome + " ha finito le sue carte!" }) : null
    ]);
    if (votiEsito && votiEsito.length) {
      var ul = el("ul", { class: "tl-voti" });
      votiEsito.forEach(function (vt) { ul.appendChild(el("li", {}, [
        el("span", { text: (vt.d ? "👍 " : "👎 ") + vt.nome }),
        el("span", { class: "d", text: (vt.delta > 0 ? "+" : "−") + Math.abs(vt.delta), style: "color:" + (vt.giusto ? "var(--verde)" : "var(--rosso)") })
      ])); });
      box.appendChild(ul);
    }
    s._contenuto.appendChild(box);
    var finita = attivi(stato) === 0 || stato.mazzo.length === 0;
    if (finita) { s._piede.appendChild(el("button", { class: "btn btn-primario", text: "🏆 Vedi la classifica", onclick: function () { fineTel(t, stato); } })); return t.mostra(s); }
    stato.turno += 1; saltaFiniti(stato);
    var prossimo = stato.giocatori[stato.turno % stato.giocatori.length].nome, uno = stato.giocatori.length === 1;
    s._piede.appendChild(el("button", { class: "btn btn-primario", text: uno ? "Continua ▶" : "Passa a " + prossimo + " ▶",
      onclick: function () { if (uno) turnoTel(t, stato); else t.passaA(prossimo, function () { turnoTel(t, stato); }); } }));
    t.mostra(s);
  }
  function classificaPunti(giocatori) {
    return giocatori.slice().sort(function (a, b) { return b.punti - a.punti; }).map(function (g) { return { nome: g.nome, punti: g.punti }; });
  }
  function fineTel(t, stato) { schermataFine(t, classificaPunti(stato.giocatori), function () { partenzaTelefono(t); }); }

  // =========================================================
  //  MODALITÀ ONLINE (host-authoritative, con votazione)
  // =========================================================
  function indexById(st, id) { for (var i = 0; i < st.giocatori.length; i++) if (st.giocatori[i].id === id) return i; return -1; }
  function trovaG(vm, id) { for (var i = 0; i < vm.giocatori.length; i++) if (vm.giocatori[i].id === id) return vm.giocatori[i]; return null; }
  function vmDa(st) {
    var g = st.giocatori, idx = g.length ? (st.turno % g.length) : 0;
    return {
      fase: st.fase, codice: st.codice, scadenza: st.scadenza || null, scelta: st.scelta != null ? st.scelta : null,
      giocatori: g.map(function (x) { return { id: x.id, nome: x.nome, restano: x.restano, punti: x.punti }; }),
      turnoId: g.length ? g[idx].id : null, turnoNome: g.length ? g[idx].nome : "",
      linea: st.linea.map(function (e) { return { anno: e.anno, titolo: e.titolo, fatto: e.fatto || "" }; }),
      carta: st.carta ? { titolo: st.carta.titolo, fatto: st.carta.fatto || "" } : null,
      hannoVotato: Object.keys(st.voti || {}), esito: st.esito || null, classifica: st.classifica || null
    };
  }
  function hostCrea(t) {
    if (!(window.SGNet && SGNet.disponibile())) return schermataNoNet(t);
    var carte = (t.impostazioni && t.impostazioni.carte) || 5;
    var st = {
      mazzo: mischiaArr(pescaDati(t.impostazioni)), linea: [], turno: 0, carta: null, esito: null, classifica: null,
      fase: "lobby", iniziata: false, carte: carte, codice: "…", scelta: null, voti: {}, scadenza: null, _to: null,
      giocatori: [{ id: "host", nome: (t.giocatori && t.giocatori[0]) || "Host", restano: carte, punti: 0 }]
    };
    function corr() { return st.giocatori[st.turno % st.giocatori.length]; }
    function clearTo() { if (st._to) { clearTimeout(st._to); st._to = null; } }

    var rete = SGNet.ospita("timeline", {
      onCodice: function (c) { st.codice = c; bd(); },
      onConnesso: function () { st.pronta = true; bd(); },
      onAddio: function (id) {
        var i = indexById(st, id); if (i < 0) return;
        var eraCorr = st.iniziata && corr().id === id;
        st.giocatori.splice(i, 1); delete st.voti[id];
        if (st.iniziata && st.giocatori.length === 0) { clearTo(); rete.chiudi(); return t.esci(); }
        if (st.iniziata && st.fase !== "fine" && attivi(st) === 0) return finisci();
        if (eraCorr && st.fase === "turno") { clearTo(); st.turno = st.turno % st.giocatori.length; iniziaTurno(); return; }
        if (st.fase === "votazione") verificaVoti();
        bd();
      },
      onMsg: function (id, m) {
        if (!m || !m.t) return;
        if (m.t === "join") {
          if (!st.iniziata && indexById(st, id) < 0 && st.giocatori.length < MAX_GIOCATORI)
            st.giocatori.push({ id: id, nome: String(m.nome || "Amico").slice(0, 16), restano: st.carte, punti: 0 });
          bd();
        }
        else if (m.t === "scelta") { scelta(id, m.gap); }
        else if (m.t === "voto") { voto(id, m.d); }
        else if (m.t === "avanti") { if (st.fase === "esito" && corr().id === id) prossimo(); }
      },
      onErrore: function (e) { schermataNoNet(t, e); }
    });
    function invia() { rete.invia({ t: "vm", vm: vmDa(st) }); }
    function bd() { invia(); disegna(); }

    function comincia() {
      if (st.iniziata || st.giocatori.length < 1) return;
      st.iniziata = true; st.linea = [st.mazzo.pop()]; ordina(st.linea); iniziaTurno();
    }
    function iniziaTurno() {
      clearTo();
      if (attivi(st) === 0 || st.mazzo.length === 0) return finisci();
      saltaFiniti(st);
      st.carta = st.mazzo.pop(); st.scelta = null; st.voti = {}; st.esito = null; st.fase = "turno";
      st.scadenza = Date.now() + TEMPO * 1000;
      st._to = setTimeout(function () { scelta(corr().id, null); }, TEMPO * 1000); // tempo scaduto = niente scelta
      bd();
    }
    function scelta(playerId, gap) {
      if (st.fase !== "turno" || corr().id !== playerId) return;
      clearTo();
      st.scelta = (gap == null ? -1 : gap); // -1 = tempo scaduto senza scegliere
      var votanti = st.giocatori.filter(function (x) { return x.id !== corr().id; });
      if (st.scelta === -1 || votanti.length === 0) return risolvi(); // nessuno da far votare
      st.fase = "votazione"; st.voti = {}; st.scadenza = Date.now() + TEMPO * 1000;
      st._to = setTimeout(function () { risolvi(); }, TEMPO * 1000);
      bd();
    }
    function voto(id, d) {
      if (st.fase !== "votazione" || id === corr().id) return;
      if (indexById(st, id) < 0) return;
      st.voti[id] = !!d; bd(); verificaVoti();
    }
    function verificaVoti() {
      var votanti = st.giocatori.filter(function (x) { return x.id !== corr().id; });
      if (votanti.every(function (x) { return st.voti[x.id] != null; })) risolvi();
    }
    function risolvi() {
      clearTo();
      var g = corr(), carta = st.carta, gap = st.scelta;
      var ok = gap != null && gap >= 0 && gapGiusto(st.linea, gap, carta.anno);
      var voti = [];
      st.giocatori.forEach(function (x) {
        if (x.id === g.id) return;
        if (st.voti[x.id] == null) return; // non ha votato: 0
        var giustoV = (st.voti[x.id] === ok);
        x.punti += giustoV ? VOTO : -VOTO;
        voti.push({ nome: x.nome, d: st.voti[x.id], giusto: giustoV, delta: giustoV ? VOTO : -VOTO });
      });
      if (ok) { st.linea.push(carta); ordina(st.linea); g.punti += PUNTI; } else { g.punti -= PUNTI; }
      g.restano -= 1;
      st.esito = { giusto: ok, anno: carta.anno, titolo: carta.titolo, fatto: carta.fatto || "", nome: g.nome,
        delta: ok ? PUNTI : -PUNTI, scaduto: gap === -1, voti: voti, finito: g.restano === 0 };
      st.scelta = null; st.scadenza = null; st.fase = "esito";
      bd();
    }
    function prossimo() {
      if (attivi(st) === 0 || st.mazzo.length === 0) return finisci();
      st.turno += 1; iniziaTurno();
    }
    function finisci() {
      clearTo(); st.fase = "fine"; st.scadenza = null;
      st.classifica = classificaPunti(st.giocatori);
      bd();
    }
    var cb = { myId: "host", sonoHost: true,
      onGap: function (g) { scelta("host", g); }, onVoto: function (d) { voto("host", d); },
      onAvanti: function () { if (st.fase === "esito" && corr().id === "host") prossimo(); },
      onComincia: comincia, onEsci: function () { clearTo(); rete.chiudi(); t.esci(); } };
    function disegna() { disegnaVM(t, vmDa(st), cb); }
    disegna();
  }

  function ospiteEntra(t, codice) {
    if (!(window.SGNet && SGNet.disponibile())) return schermataNoNet(t);
    var el = t.el, S = { myId: null, vm: null, rete: null, nome: "", msg: null };
    var cb = { myId: null, sonoHost: false,
      onGap: function (g) { S.rete && S.rete.invia({ t: "scelta", gap: g }); },
      onVoto: function (d) { S.rete && S.rete.invia({ t: "voto", d: d }); },
      onAvanti: function () { S.rete && S.rete.invia({ t: "avanti" }); },
      onEsci: function () { if (S.rete) S.rete.chiudi(); t.esci(); } };
    function disegna() { if (S.vm) { cb.myId = S.myId; disegnaVM(t, S.vm, cb); } }
    schermaNome();
    function schermaNome() {
      var s = t.schermata({ icona: "🔗", titolo: "Entra nella partita", sotto: "Stanza " + codice.toUpperCase(), indietro: t.esci });
      var input = el("input", { type: "text", placeholder: "Il tuo nome", maxlength: "16", class: "link-campo" });
      S.msg = el("div", { class: "link-avviso" });
      s._contenuto.appendChild(input); s._contenuto.appendChild(S.msg);
      s._piede.appendChild(el("button", { class: "btn btn-primario", text: "Entra ▶", onclick: function () {
        ctx(); S.nome = (input.value || "Amico").trim() || "Amico"; S.msg.textContent = "Collegamento in corso…"; collega();
      } }));
      t.mostra(s);
    }
    function collega() {
      S.rete = SGNet.entra(codice, {
        onAperto: function (id) { S.myId = id; S.rete.invia({ t: "join", nome: S.nome });
          setTimeout(function () { if (!S.vm && S.msg) S.msg.textContent = "Non trovo la partita. Controlla il codice o aspetta che l'host apra la stanza…"; }, 8000); },
        onMsg: function (m) { if (m && m.t === "vm") { S.vm = m.vm; disegna(); } },
        onChiuso: function () { schermaErr("Collegamento perso. L'host potrebbe aver chiuso la partita."); },
        onErrore: function (e) { schermaErr(codiceErrore(e)); }
      });
    }
    function schermaErr(txt) {
      var s = t.schermata({ icona: "⚠️", titolo: "Ops" });
      s._contenuto.appendChild(el("p", { text: txt, style: "font-size:1.05rem;line-height:1.5" }));
      s._piede.appendChild(el("button", { class: "btn btn-primario", text: "🏠 Torna all'inizio", onclick: t.esci }));
      t.mostra(s);
    }
  }

  // Ricordo dell'ultima fase, per suonare al momento giusto
  var ultimaFase = null, ultimoEsitoGiusto = null;

  function disegnaVM(t, vm, cb) {
    var el = t.el;
    if (vm.fase === "lobby") { ultimaFase = "lobby"; return disegnaLobby(t, vm, cb); }
    if (vm.fase === "fine") {
      if (ultimaFase !== "fine") { ultimaFase = "fine"; return schermataFine(t, vm.classifica || [], null); }
      return schermataFine(t, vm.classifica || [], null);
    }
    var io = trovaG(vm, cb.myId);
    var mioTurno = vm.turnoId && cb.myId && vm.turnoId === cb.myId;

    // suoni sui cambi di fase
    if (vm.fase === "turno" && ultimaFase !== "turno") { if (mioTurno) FX.turno(); }
    if (vm.fase === "esito" && ultimaFase !== "esito") { vm.esito && (vm.esito.giusto ? FX.giusto() : FX.sbagliato()); }
    ultimaFase = vm.fase;

    var s = t.schermata({ titolo: titoloFase(vm, mioTurno), sotto: "Stanza " + (vm.codice || ""), icona: "📜",
      indietro: function () { if (window.confirm("Uscire dalla partita?")) cb.onEsci(); } });
    var meId = cb.myId;
    var gioc = vm.giocatori.map(function (g) { return { id: g.id, nome: g.nome, punti: g.punti, _me: g.id === meId }; });
    s._contenuto.appendChild(nodoTop(el, gioc, vm.turnoId));

    if (vm.scadenza && (vm.fase === "turno" || vm.fase === "votazione")) {
      var rim = vm.scadenza - Date.now();
      s._contenuto.appendChild(barraTimer(el, rim, TEMPO * 1000, null));
    }

    if (vm.fase === "turno") {
      s._contenuto.appendChild(nodoCartaMano(el, vm.carta || { titolo: "" }, mioTurno ? "Dove va?" : ("Sta scegliendo " + vm.turnoNome)));
      var linea = el("div", { class: "tl-linea" });
      if (mioTurno) linea.appendChild(gapBtn(el, cb, 0));
      vm.linea.forEach(function (ev, i) { linea.appendChild(nodoEvento(el, ev)); if (mioTurno) linea.appendChild(gapBtn(el, cb, i + 1)); else linea.appendChild(el("div", { style: "height:6px" })); });
      s._contenuto.appendChild(linea);
      if (!mioTurno) s._contenuto.appendChild(el("p", { class: "tl-attesa", text: "Aspetta: sta scegliendo " + vm.turnoNome + "." }));
    } else if (vm.fase === "votazione") {
      var ioHoVotato = vm.hannoVotato.indexOf(cb.myId) >= 0;
      s._contenuto.appendChild(nodoCartaMano(el, vm.carta || { titolo: "" }, mioTurno ? "Gli altri votano…" : "È giusto qui?"));
      var lin = el("div", { class: "tl-linea" }), tentId = "tent";
      vm.linea.forEach(function (ev, i) {
        if (i === vm.scelta) lin.appendChild(nodoEvento(el, { anno: 0, titolo: vm.carta ? vm.carta.titolo : "", fatto: vm.carta ? vm.carta.fatto : "" }, true));
        lin.appendChild(nodoEvento(el, ev));
      });
      if (vm.scelta >= vm.linea.length) lin.appendChild(nodoEvento(el, { anno: 0, titolo: vm.carta ? vm.carta.titolo : "", fatto: vm.carta ? vm.carta.fatto : "" }, true));
      s._contenuto.appendChild(lin);
      if (mioTurno) s._contenuto.appendChild(el("p", { class: "tl-attesa", text: "Gli altri stanno votando la tua scelta…" }));
      else if (ioHoVotato) s._contenuto.appendChild(el("p", { class: "tl-attesa", text: "Hai votato. Aspetta gli altri…" }));
      else {
        s._piede.appendChild(el("div", { class: "tl-vota" }, [
          el("button", { class: "btn btn-verde", text: "👍 D'accordo", onclick: function () { FX.voto(); cb.onVoto(true); } }),
          el("button", { class: "btn btn-rosso", text: "👎 No", onclick: function () { FX.voto(); cb.onVoto(false); } })
        ]));
      }
      setTimeout(function () { var e = document.querySelector(".tl-tent"); if (e && e.scrollIntoView) e.scrollIntoView({ block: "center", behavior: "smooth" }); }, 60);
    } else if (vm.fase === "esito") {
      var es = vm.esito || {};
      var box = el("div", { class: "tl-esito" }, [
        el("div", { class: "faccia", text: es.giusto ? "✅" : "❌" }),
        el("div", { class: "verdetto " + (es.giusto ? "giusto" : "sbagliato"), text: (es.nome || "") + (es.giusto ? ": esatto!" : (es.scaduto ? ": tempo scaduto" : ": sbagliato")) }),
        es.giusto ? el("div", { class: "annone", text: annoTesto(es.anno) }) : el("div", { class: "titoletto tenue", text: "La data resta un mistero…" }),
        el("div", { class: "titoletto", text: es.titolo }),
        el("div", { class: "delta " + (es.giusto ? "su" : "giu"), text: (es.giusto ? "+" : "−") + PUNTI + " a " + es.nome }),
        es.finito ? el("div", { class: "tl-finito", text: "🎉 " + es.nome + " ha finito le sue carte!" }) : null
      ]);
      if (es.voti && es.voti.length) {
        var ul = el("ul", { class: "tl-voti" });
        es.voti.forEach(function (v) { ul.appendChild(el("li", {}, [
          el("span", { text: (v.d ? "👍 " : "👎 ") + v.nome }),
          el("span", { class: "d " + (v.giusto ? "su" : "giu"), text: (v.delta > 0 ? "+" : "−") + Math.abs(v.delta), style: "color:" + (v.giusto ? "var(--verde)" : "var(--rosso)") })
        ])); });
        box.appendChild(ul);
      }
      s._contenuto.appendChild(box);
      if (mioTurno) s._piede.appendChild(el("button", { class: "btn btn-primario", text: "Avanti ▶", onclick: cb.onAvanti }));
      else s._piede.appendChild(el("p", { class: "tl-attesa", text: "In attesa di " + vm.turnoNome + "…" }));
    }
    t.mostra(s);
  }
  function titoloFase(vm, mioTurno) {
    if (vm.fase === "turno") return mioTurno ? "Tocca a te!" : "Tocca a " + vm.turnoNome;
    if (vm.fase === "votazione") return mioTurno ? "Ti votano…" : "Vota!";
    if (vm.fase === "esito") return "Risultato";
    return gioco.nome;
  }
  function gapBtn(el, cb, i) { return el("button", { class: "tl-gap", html: "⤵ &nbsp;metti qui", onclick: function () { cb.onGap(i); } }); }

  function disegnaLobby(t, vm, cb) {
    var el = t.el;
    var s = t.schermata({ icona: "🔗", titolo: "Sala d'attesa", sotto: cb.sonoHost ? "Invita gli amici" : "Aspetta l'inizio", indietro: cb.onEsci });
    s._contenuto.appendChild(el("div", { class: "etichetta", text: "Codice della stanza" }));
    s._contenuto.appendChild(el("div", { class: "codice-stanza", text: (vm.codice || "…").toUpperCase() }));
    if (cb.sonoHost && vm.codice && vm.codice !== "…") {
      var link = SG.creaLink({ gioco: "timeline", stanza: vm.codice });
      var campo = el("input", { class: "link-campo", type: "text", readonly: "readonly", value: link });
      s._contenuto.appendChild(el("button", { class: "btn btn-fantasma", html: "🔗 Copia il link da mandare",
        onclick: function () { campo.focus(); campo.select(); try { navigator.clipboard.writeText(link); } catch (e) {} } }));
      s._contenuto.appendChild(campo);
    }
    s._contenuto.appendChild(el("div", { class: "etichetta", text: "Chi c'è (" + vm.giocatori.length + ")" }));
    var lista = el("div");
    vm.giocatori.forEach(function (g) { lista.appendChild(el("div", { class: "lobby-giocatore", text: "🙂 " + g.nome + (g.id === cb.myId ? " (tu)" : "") })); });
    s._contenuto.appendChild(lista);
    if (cb.sonoHost) s._piede.appendChild(el("button", { class: "btn btn-primario", text: vm.giocatori.length < 2 ? "Comincia (meglio in 2+)" : "Comincia ▶", onclick: cb.onComincia }));
    else s._piede.appendChild(el("p", { class: "tl-attesa", text: "In attesa che l'host cominci…" }));
    t.mostra(s);
  }

  function schermataNoNet(t) {
    var s = t.schermata({ icona: "🔗", titolo: "Serve il sito pubblicato", indietro: t.esci });
    s._contenuto.appendChild(t.el("p", { style: "font-size:1.05rem;line-height:1.5",
      text: "La modalità \"ognuno dal suo telefono\" funziona quando il gioco è aperto dal sito pubblicato. Da un file locale o da un'anteprima non è disponibile: intanto usa \"Un telefono solo\"." }));
    s._piede.appendChild(t.el("button", { class: "btn btn-primario", text: "Ok", onclick: t.esci }));
    t.mostra(s);
  }
  function codiceErrore(e) { var ty = e && e.type; if (ty === "no-mqtt") return "Il collegamento non è disponibile qui."; return "Problema di collegamento. Controlla la connessione e riprova."; }

  SG.registra(gioco);
})();

SG.avviaApp();
</script>
