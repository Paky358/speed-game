  .schermo > svg { position: absolute; left: 0; top: 0; width: 300px; height: 600px; display: block; }
  /* barra in alto: avatar, livello, monete, casa */
  .hud { position: absolute; left: 8px; right: 8px; top: 8px; display: flex; align-items: center; gap: 6px; z-index: 2; }
  .io { display: flex; align-items: center; gap: 6px; padding: 3px 10px 3px 3px; border-radius: 999px; }
  .faccia { width: 32px; height: 32px; border-radius: 50%; overflow: hidden; background: #e9ecef; flex: none; }
  .faccia svg { width: 100%; height: 100%; display: block; }
  .io b { display: block; font-size: 12px; line-height: 1.1; }
  .io small { display: block; font-size: 10px; line-height: 1.15; opacity: .85; }
  .xp { display: block; width: 56px; height: 4px; border-radius: 2px; background: rgba(0,0,0,.15); margin-top: 2px; overflow: hidden; }

  .monete { margin-left: auto; display: flex; align-items: center; gap: 5px; padding: 5px 10px 5px 5px; border-radius: 999px; font-weight: 900; font-size: 13px; }
  .moneta { width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3bf, #fab005 55%, #e67700); box-shadow: inset 0 0 0 2px #f08c00; }
  .tondo { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 900; flex: none; }
  .titolo { padding: 8px 13px; border-radius: 999px; font-weight: 800; font-size: 13px; }
  .giu { position: absolute; left: 8px; right: 8px; bottom: 8px; display: flex; gap: 6px; z-index: 2; }

  .A .io, .A .monete, .A .titolo, .A .giu span { background: rgba(255,255,255,.94); color: #5a3b1a; box-shadow: 0 2px 0 #c9a46a; }

      [L, B, R].forEach(function (p) { var dx = (X - p[0]) * .12, dy = (Ty - p[1]) * .12; s += "<rect x='" + f1(p[0] + dx - 1.5) + "' y='" + f1(p[1] + dy) + "' width='3' height='" + h + "' fill='#3b2a1a'/>"; });
      s += poly([L, B, su(B, -5), su(L, -5)], "#8b5a2b", LN) + poly([B, R, su(R, -5), su(B, -5)], "#6b3f17", LN) + poly([T, R, B, L], "#d9a066", LN);
      s += carta(X - 12, Ty, 0, false, true) + carta(X, Ty - 5, 0, false, true) + carta(X + 12, Ty, 0, false, true) + carta(X, Ty + 7, 0, true, true);
      fr = sgab(X + k, Y + k / 2) + (quattro ? sgab(X - k, Y + k / 2) : "");
    }
    return s + fr + cartello(X, Y + (t.k === "bj" ? 46 : 44), t.nome, "#fff", "#2b2b3a", "Nunito", 900, "#e03131");
  }
  function dentroD() {
    var H = 112;
    function Pf(u, v) { return [150 + (u - v) * 22, 150 + (u + v) * 11]; }
    var s = "<rect width='300' height='600' fill='#2b2140'/>";
    s += poly([Pf(0, 0), Pf(30, 0), Pf(30, 30), Pf(0, 30)], "#e9b872");
    for (var v = 1; v < 30; v++) { var p1 = Pf(0, v), p2 = Pf(30, v); s += "<line x1='" + f1(p1[0]) + "' y1='" + f1(p1[1]) + "' x2='" + f1(p2[0]) + "' y2='" + f1(p2[1]) + "' stroke='#d9a35b' stroke-width='1.2'/>"; }
    s += poly([Pf(2, 2), Pf(24, 2), Pf(24, 24), Pf(2, 24)], "#c92a2a", " stroke='#fcc419' stroke-width='4'");
    s += poly([Pf(2.8, 2.8), Pf(23.2, 2.8), Pf(23.2, 23.2), Pf(2.8, 23.2)], "none", " stroke='#ff8787' stroke-width='1.5' stroke-dasharray='6 5'");
    // le due pareti: carta da parati, zoccolo di legno, bordi dorati
    var A0 = Pf(0, 0), AL = Pf(0, 12), AR = Pf(12, 0);
    s += poly([A0, AL, su(AL, H), su(A0, H)], "#8f2433") + poly([A0, AR, su(AR, H), su(A0, H)], "#6d1a27");
    for (var t = 0.5; t < 12; t += 1) { var pl = Pf(0, t), pr = Pf(t, 0); s += "<line x1='" + f1(pl[0]) + "' y1='" + f1(pl[1] - 26) + "' x2='" + f1(pl[0]) + "' y2='" + f1(pl[1] - H) + "' stroke='rgba(255,255,255,.07)' stroke-width='7'/><line x1='" + f1(pr[0]) + "' y1='" + f1(pr[1] - 26) + "' x2='" + f1(pr[0]) + "' y2='" + f1(pr[1] - H) + "' stroke='rgba(0,0,0,.08)' stroke-width='7'/>"; }
    s += poly([A0, AL, su(AL, 26), su(A0, 26)], "#5a3417") + poly([A0, AR, su(AR, 26), su(A0, 26)], "#47290f");
    [26, H].forEach(function (z) { s += "<polyline points='" + pts([su(AL, z), su(A0, z), su(AR, z)]) + "' fill='none' stroke='#fcc419' stroke-width='2.5'/>"; });
    s += "<line x1='150' y1='150' x2='150' y2='" + (150 - H) + "' stroke='#4a0f18' stroke-width='2'/>";
    s += "<g transform='matrix(0.894,-0.447,0,1,16,166)'><rect x='-6' y='-30' width='112' height='40' rx='8' fill='#1a0f0f' stroke='#fcc419' stroke-width='3'/><text x='50' y='0' text-anchor='middle' font-family='Nunito, Arial, sans-serif' font-weight='900' font-size='24' fill='#ffd43b'>CASINÒ</text></g>";
    s += "<g transform='matrix(0.894,0.447,0,1,186,86)'><rect x='0' y='0' width='74' height='44' rx='4' fill='#fcc419'/><rect x='5' y='5' width='64' height='34' rx='3' fill='#1e3a2a'/><text x='37' y='28' text-anchor='middle' font-size='16' fill='#fff' font-family='Nunito, Arial, sans-serif' font-weight='900'>♠︎♥︎♦︎♣︎</text></g>";
    [[122, 118], [282, 128]].forEach(function (l) { s += "<circle cx='" + l[0] + "' cy='" + l[1] + "' r='13' fill='#ffe066' opacity='.3'/><circle cx='" + l[0] + "' cy='" + l[1] + "' r='5' fill='#fff3bf' stroke='#fcc419' stroke-width='2'/>"; });
    var POS = { bj: [85, 262], poker: [222, 272], scopa: [80, 384], scopa2: [220, 386], scopone: [150, 478] };
    TAVOLI.forEach(function (t) { var p = POS[t.k]; s += tavD({ k: t.k, nome: t.nome, x: p[0], y: p[1] }); });
    s += figura(IO, 36, 546, 28) + cartello(36, 502, "Tu", "#4c6ef5", "#fff", "Nunito", 900);
    return s;
  }

  // ---------- la pagina ----------
  function hudCitta() {
    return '<div class="hud"><div class="io"><span class="faccia">' + O.svg(IO, { busto: true }) + '</span><span><b>Paky</b><small>Livello 7</small><i class="xp"><i></i></i></span></div>' +
      '<div class="monete"><span class="moneta"></span>1.250</div><div class="tondo">🏠</div></div>' +
      '<div class="giu"><span>🔍 Cerca un gioco</span><span>⏱️ Ultimi giocati</span></div>';
  }
  function hudDentro(titolo) {
    return '<div class="hud"><div class="tondo">←</div>' + (titolo ? '<div class="titolo">🃏 Casinò</div>' : '') + '<div class="monete"><span class="moneta"></span>1.250</div></div>' +
      '<div class="giu"><span>👆 Tocca un tavolo per giocare</span></div>';
  }
  function tel(cap, svg, hud) { return '<div class="vista"><b>' + cap + '</b><div class="tel"><div class="schermo"><svg viewBox="0 0 300 600" xmlns="http://www.w3.org/2000/svg">' + svg + '</svg>' + hud + '</div></div></div>'; }
  var STILI = [
    { k: "A", nome: "A · Cartone animato", sotto: "Come Pet Society: colori allegri, tetti tondi, prato, alberi e la fontana in piazza. Dentro: carta da parati, parquet e tappeto rosso.", citta: cittaA, dentro: dentroA, titolo: true },
    { k: "B", nome: "B · Città di notte al neon", sotto: "Una piccola Las Vegas: insegne luminose e finestre accese. Va d'accordo con lo studio TV.", citta: cittaB, dentro: dentroB, titolo: true },
    { k: "C", nome: "C · Mappa pulita", sotto: "Lo stile chiaro di Parola d'ordine: edifici come schede, amici come segnaposto. Dentro: i tavoli visti dall'alto, con chi è seduto.", citta: cittaC, dentro: dentroC, titolo: false },
    { k: "D", nome: "D · Isometrica 3D", sotto: "Come i giochi di città e di stanze (tipo Habbo): palazzi in 3D e dentro una vera stanza. È lo stile più adatto anche per la casa da arredare.", citta: cittaD, dentro: dentroD, titolo: true }
  ];
  var box = document.getElementById("stili");
  STILI.forEach(function (S) {
    box.insertAdjacentHTML("beforeend", '<section class="stile ' + S.k + '"><h2>' + S.nome + '<small>' + S.sotto + '</small></h2><div class="coppia">' +
      tel("La città", S.citta(), hudCitta()) + tel("Dentro il Casinò", S.dentro(), hudDentro(S.titolo)) + '</div></section>');
  });
})();
