<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content">
  <script>
    // prove sul computer (localhost): niente suoni, così gli aiutanti che provano i giochi non disturbano. Il sito vero non ha questa riga.
    (function () {
      if (!/^(localhost|127\.0\.0\.1)$/.test(location.hostname) || /suono=1/.test(location.search)) return;
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) { var Muto = function (o) { var c = new AC(o); try { c.suspend(); } catch (e) {} c.resume = function () { return Promise.resolve(); }; return c; }; Muto.prototype = AC.prototype; window.AudioContext = Muto; window.webkitAudioContext = Muto; }
      if (window.AudioScheduledSourceNode) { AudioScheduledSourceNode.prototype.start = function () {}; AudioScheduledSourceNode.prototype.stop = function () {}; }
      if (window.HTMLMediaElement) HTMLMediaElement.prototype.play = function () { return Promise.resolve(); };
      if (window.speechSynthesis) try { window.speechSynthesis.speak = function () {}; } catch (e) {}
    })();
  </script>
  <meta name="theme-color" content="#0d1020">
  <title>SPeeD GAME</title>
  <link rel="manifest" href="app/manifest.webmanifest?v=2">
  <link rel="icon" type="image/png" href="app/icona-192.png">
  <link rel="apple-touch-icon" href="app/icona-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SPeeD GAME">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app"><!-- le schermate vengono disegnate qui --></div>

  <!-- Caselle di posta del sito (Netlify): servono solo perché Netlify le
       riconosca quando pubblichi. Sono nascoste: l'app invia i messaggi da sola.
       I messaggi si leggono su Netlify, nella scheda "Forms" del sito. -->
  <form name="proposte" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="text" name="bot-field" />
    <input type="text" name="nome" />
    <textarea name="messaggio"></textarea>
  </form>
  <form name="bug" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="text" name="bot-field" />
    <input type="text" name="nome" />
    <textarea name="messaggio"></textarea>
    <input type="text" name="contesto" />
  </form>

  <script src="js/scegliamo.js"></script>   <!-- Scegliamo insieme: scheda del voto e ruota dei giochi -->
  <script src="js/amici-online.js"></script>   <!-- amici online (pallino verde) e inviti nella Sala -->

  <!-- Diario delle novità -->
  <script src="data/novita.js"></script>

  <!-- 📦 I giochi: qui solo l'elenco (le schede per la home e i pezzi da scaricare quando si gioca). I file dei giochi
