<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c1636">
  <title>SPeeD GAME</title>
  <link rel="manifest" href="app/manifest.webmanifest?v=2">
  <link rel="icon" type="image/png" href="app/icona-192.png">
  <link rel="apple-touch-icon" href="app/icona-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SPeeD GAME">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app"><!-- le schermate vengono disegnate qui --></div>

  <!-- Caselle di posta del sito (Netlify): servono solo perché Netlify le
       riconosca quando pubblichi. Sono nascoste: l'app invia i messaggi da sola.
       I messaggi si leggono su Netlify, nella scheda "Forms" del sito. -->
  <form name="proposte" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="text" name="bot-field" />
    <input type="text" name="nome" />
    <textarea name="messaggio"></textarea>
  </form>
  <form name="bug" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="text" name="bot-field" />
    <input type="text" name="nome" />
    <textarea name="messaggio"></textarea>
    <input type="text" name="contesto" />
  </form>

  <!-- Collegamento tra telefoni (modalità "ognuno dal suo telefono") -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
  <!-- Realtime a bassa latenza (Ably) — usato da Glow Hockey -->
  <script src="https://cdn.ably.com/lib/ably.min-2.js"></script>
  <!-- Profili e dati in cloud (Firebase) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/nube.js"></script>
  <script src="js/omino.js"></script>

  <!-- Motore comune (schermate, giocatori, punteggio, giro di partita) -->
  <script src="js/core.js"></script>
  <script src="js/net.js"></script>
  <script src="js/ably-key.js"></script>
  <script src="js/net-ably.js"></script>
  <script src="js/net-p2p.js"></script>

  <!-- Dati: avvenimenti divisi per categoria (aggiungerne altri = altri file qui) -->
  <script src="data/eventi-storia.js"></script>
  <script src="data/eventi-invenzioni.js"></script>
  <script src="data/eventi-calcio.js"></script>
  <script src="data/eventi-rap.js"></script>
  <script src="data/eventi-cinema.js"></script>

  <!-- Dati: carte del gioco "L'Asta" (temi) -->
  <script src="data/asta-carte.js"></script>
  <script src="data/asta-pizza.js"></script>
  <script src="data/asta-panino.js"></script>
  <script src="data/asta-rapina.js"></script>
  <script src="data/asta-supereroi.js"></script>
  <script src="data/asta-appuntamento.js"></script>
  <script src="data/asta-giardino.js"></script>
  <script src="data/asta-vacanza.js"></script>
  <script src="data/asta-coinquilino.js"></script>
  <script src="data/asta-calcetto.js"></script>
  <script src="data/asta-palestra.js"></script>
  <script src="data/asta-capodanno.js"></script>
  <script src="data/asta-universita.js"></script>
  <script src="data/asta-roadtrip.js"></script>
  <script src="data/asta-fanta.js"></script>

  <!-- Diario delle novità -->
  <script src="data/ncc-categorie.js"></script>
  <script src="data/impostore-parole.js"></script>
  <script src="data/sipero-carte.js"></script>
  <script src="data/patata-categorie.js"></script>
  <script src="data/novita.js"></script>

  <!-- Giochi (ognuno si "innesta" da solo nel motore) -->
  <script src="js/games/timeline.js"></script>
  <script src="js/games/asta.js"></script>
  <script src="js/games/nomicoseecitta.js"></script>
  <script src="js/games/impostore.js"></script>
  <script src="js/games/sipero.js"></script>
  <script src="js/games/scalinata.js"></script>
  <script src="js/games/horto.js"></script>
  <script src="js/games/pendolo.js"></script>
  <script src="js/games/patata.js"></script>
  <script src="js/games/hockey.js"></script>
  <script src="js/games/tris.js"></script>
  <script src="js/games/drop4.js"></script>
  <script src="js/games/navale.js"></script>
  <script src="js/games/scopa.js"></script>
  <script src="js/games/scopa2.js"></script>
  <script src="js/games/scopone.js"></script>
  <script src="js/games/blackjack.js"></script>

  <!-- Avvio -->
  <script>SG.avviaApp();</script>
  <script>if ("serviceWorker" in navigator) addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });</script>
</body>
</html>
